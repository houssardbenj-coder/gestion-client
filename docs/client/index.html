<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F5EE">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://nzxphozupnmqyikitwhv.supabase.co; connect-src 'self' https://nzxphozupnmqyikitwhv.supabase.co; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>OIKOS Espace client</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Espace client OIKOS : même charte que l'appli des intervenants (Lumière le jour, Nuit d'olive en mode sombre).
   Le client ne lit et n'écrit que par les fonctions de la base (SQL 53) : aucune table n'est lue en direct. */
:root{
  --bg:#F7F5EE; --surface:#FFFFFF; --sunk:#EDEAE0; --ink:#23241F; --muted:#5A5B52; --line:#DAD7CA;
  --accent:#525A44; --accent-ink:#FFFFFF; --accent-soft:#E7E8DA;
  --go:#3E7D3A; --stop:#A8432B; --stop-soft:#FBE3DE; --warn:#8A5A0E; --warn-soft:#F4E9CC;
  --carte:#FFFFFF; --carte-bord:transparent; --ombre:0 1px 2px rgb(35 36 31 / .05),0 14px 32px rgb(35 36 31 / .07); --ombre-btn:0 10px 26px rgb(82 90 68 / .26);
  --bouton:#F0EEE4; --mono:#D6D9CC; --tri:transparent; --trait:transparent; --bulle-moi:#525A44; --bulle-moi-ink:#FFFFFF;
  --titre:Fraunces,"Cormorant Garamond",Georgia,serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1B1D15; --surface:#26291F; --sunk:#14160F; --ink:#F3F1E7; --muted:#BDBEAE; --line:#3D4033;
  --accent:#C9D4AA; --accent-ink:#1B1D15; --accent-soft:#363A2B;
  --go:#7CC26F; --stop:#E9775F; --stop-soft:#43231A; --warn:#E0B458; --warn-soft:#3A3115;
  --carte:rgb(243 241 231 / .075); --carte-bord:rgb(243 241 231 / .16); --ombre:0 24px 50px rgb(0 0 0 / .28); --ombre-btn:none;
  --bouton:rgb(243 241 231 / .08); --mono:#5C6349; --tri:#2B2E21; --trait:rgb(243 241 231 / .22); --bulle-moi:#C9D4AA; --bulle-moi-ink:#1B1D15; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1B1D15; --surface:#26291F; --sunk:#14160F; --ink:#F3F1E7; --muted:#BDBEAE; --line:#3D4033;
  --accent:#C9D4AA; --accent-ink:#1B1D15; --accent-soft:#363A2B;
  --go:#7CC26F; --stop:#E9775F; --stop-soft:#43231A; --warn:#E0B458; --warn-soft:#3A3115;
  --carte:rgb(243 241 231 / .075); --carte-bord:rgb(243 241 231 / .16); --ombre:0 24px 50px rgb(0 0 0 / .28); --ombre-btn:none;
  --bouton:rgb(243 241 231 / .08); --mono:#5C6349; --tri:#2B2E21; --trait:rgb(243 241 231 / .22); --bulle-moi:#C9D4AA; --bulle-moi-ink:#1B1D15; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.page{flex:1;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 104px);display:flex;flex-direction:column;gap:14px}
.page.solo{padding:calc(env(safe-area-inset-top,0px) + 28px) 20px calc(env(safe-area-inset-bottom,0px) + 28px);justify-content:center;gap:18px}
h1{font-family:var(--titre);font-weight:500;font-size:28px;line-height:1.15;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-family:var(--titre);font-weight:500;font-size:20px;line-height:1.2;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.ico{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fond{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.fond svg{position:absolute;inset:-10%;width:120%;height:120%}
.fond .t1{fill:var(--tri)} .fond .t2{fill:none;stroke:var(--trait);stroke-width:.14}
/* Marque */
.tuile{flex:none;background:#F7F5EE;border:1px solid var(--line);border-radius:24px;object-fit:contain;width:112px;height:112px;padding:8px}
.marque-acc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.marque-nom{font-family:var(--titre);font-size:22px;line-height:1.15;font-weight:500}
.marque-sous{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.entete{position:sticky;top:0;z-index:9;display:flex;align-items:center;justify-content:space-between;gap:10px;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px}
.entete-marque{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;letter-spacing:.2em}
.entete-marque small{display:block;font-size:11px;font-weight:500;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.mono{width:30px;height:28px;flex:none}
.mono path:first-child{fill:var(--mono)} .mono path:last-child{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round}
.compte-btn{border:0;background:var(--bouton);border-radius:999px;min-height:44px;padding:0 14px;display:flex;align-items:center;gap:8px;font-weight:500;font-size:15px;cursor:pointer}
/* Blocs */
.card{background:var(--carte);border:1px solid var(--carte-bord);border-radius:22px;box-shadow:var(--ombre);padding:18px 18px;display:flex;flex-direction:column;gap:10px}
.card.note{background:var(--warn-soft);box-shadow:none;border-color:transparent}
.card.alerte{background:var(--stop-soft);box-shadow:none;border-color:transparent}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.entre{justify-content:space-between}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 18px;border-radius:16px;border:1px solid transparent;background:var(--bouton);font-weight:500;font-size:16px;cursor:pointer;text-decoration:none;color:var(--ink);text-align:center;transition:transform .14s,opacity .2s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-radius:999px;box-shadow:var(--ombre-btn);font-weight:600}
.btn.contour{background:transparent;border-color:var(--accent);color:var(--accent)}
.btn.flat{background:transparent;color:var(--accent);min-height:44px;font-size:15px}
.btn.petit{min-height:44px;padding:8px 14px;font-size:15px}
.btn.stop{background:transparent;color:var(--stop)}
.btn:disabled{opacity:.5}
label.f{display:flex;flex-direction:column;gap:5px;font-size:15px;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--surface);color:var(--ink);font-size:17px;width:100%}
label.f textarea{min-height:110px;resize:vertical}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:15px;padding:6px 0}
.chk input{width:24px;height:24px;flex:none;margin-top:1px;accent-color:var(--accent)}
.err{color:var(--stop);font-weight:600;min-height:1.2em}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:color-mix(in srgb,var(--go) 16%,transparent);color:var(--go)}
.tag.non{background:var(--stop-soft);color:var(--stop)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:44px;padding:6px 16px;font-size:15px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;min-height:44px;padding:8px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .15)}
.ligne{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.ligne:first-child{border-top:0;padding-top:0}
.ligne:last-child{padding-bottom:0}
.corps{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rond{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex:none;font-size:18px}
.doc{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;min-height:56px}
.doc:first-child{border-top:0}
.doc b{font-weight:500}
.mini{flex:none;width:52px;height:66px;border-radius:8px;background:var(--sunk);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:20px}
.mini img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;background:#fff}
.galerie{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.carte-doc{border:0;padding:0;background:var(--carte);border:1px solid var(--carte-bord);border-radius:18px;box-shadow:var(--ombre);overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column}
.carte-doc .vignette{aspect-ratio:3/4;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--muted);overflow:hidden}
.carte-doc .vignette img,.carte-doc .vignette canvas{width:100%;height:100%;object-fit:cover;object-position:top;display:block;background:#fff}
.carte-doc .legende{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.carte-doc .legende b{font-weight:500;line-height:1.3}
.apercu{display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--sunk);border-radius:14px;padding:10px;min-height:160px;justify-content:center}
.apercu img,.apercu canvas{max-width:100%;height:auto;border-radius:6px;background:#fff;box-shadow:0 1px 6px rgb(0 0 0 / .18)}
details.mois{border-top:1px solid var(--line);padding:12px 0}
details.mois:first-of-type{border-top:0;padding-top:0}
details.mois summary{display:flex;justify-content:space-between;gap:10px;cursor:pointer;min-height:44px;align-items:center;list-style:none;font-weight:500}
details.mois summary::-webkit-details-marker{display:none}
details.mois .passage{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:15px}
.rdv{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rdv:first-child{border-top:0;padding-top:0} .rdv:last-child{padding-bottom:0}
.rdv .jour{flex:none;width:54px;height:58px;border-radius:14px;background:var(--accent-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.rdv .jour b{font-family:var(--titre);font-size:22px;font-weight:500} .rdv .jour small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rdv.passe{opacity:.55}
.tache{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.tache:first-child{border-top:0;padding-top:0} .tache:last-child{padding-bottom:0}
.etoile{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:44px;padding:0 14px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;cursor:pointer;color:var(--muted)}
.etoile[aria-pressed="true"]{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.etoile[aria-pressed="true"] .ico{fill:currentColor}
.ajout-ligne{display:flex;gap:8px;align-items:center}
.ajout-ligne input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--surface);font-size:16px;min-height:44px}
.resume{display:flex;flex-direction:column;gap:8px}
.resume .item{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:14px;padding:6px 6px 6px 14px;min-height:48px}
.resume .item.prio{background:var(--warn-soft)}
.resume .item .corps b{font-weight:500}
.resume .item button{border:0;background:none;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);flex:none}
.defile{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none} .defile::-webkit-scrollbar{display:none}
.defile .chip{flex:none;white-space:nowrap}
.conv{position:relative}
.conv .badge{position:static;margin-left:6px;display:inline-block;vertical-align:middle}
.bulle .de{display:block;font-size:12px;font-weight:600;letter-spacing:.02em;margin-bottom:2px;color:var(--accent)}
.reponse{border-left:3px solid var(--accent);padding:2px 0 2px 12px;white-space:pre-wrap}
.pre{white-space:pre-wrap}
/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--n,5),1fr)}
.nav button{position:relative;border:0;background:none;padding:9px 2px 10px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.nav button .ico{width:24px;height:24px}
.nav div.defile-nav{display:flex;overflow-x:auto;scrollbar-width:none}.nav div.defile-nav::-webkit-scrollbar{display:none}.nav div.defile-nav button{flex:0 0 68px}
.annexe-tete{flex-direction:row;align-items:center;gap:14px}.annexe-tete .rond{width:56px;height:56px}.annexe-tete .rond .ico{width:28px;height:28px}.annexe-tete h1{margin:0}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:5px;width:46px;height:30px;border-radius:999px;background:var(--accent-soft);z-index:-1}
.badge{position:absolute;top:3px;left:calc(50% + 7px);min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--stop);color:#fff;font-size:12px;line-height:19px;font-weight:600}
/* Messages */
.fil{display:flex;flex-direction:column;gap:8px}
.bulle{max-width:86%;padding:10px 14px;border-radius:18px 18px 18px 6px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap}
.bulle.moi{align-self:flex-end;background:var(--bulle-moi);color:var(--bulle-moi-ink);border-color:transparent;border-radius:18px 18px 6px 18px}
.bulle small{display:block;font-size:12px;opacity:.75;margin-top:3px;white-space:normal}
.bulle .piece{display:flex;align-items:center;gap:8px;border:0;background:color-mix(in srgb,currentColor 12%,transparent);color:inherit;border-radius:12px;padding:8px 10px;margin-top:4px;cursor:pointer;min-height:44px;text-align:left;width:100%}
.ecrire{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 66px);display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding:8px 0 4px;margin-top:auto}
.ecrire textarea{flex:1;border:1px solid var(--line);border-radius:20px;padding:12px 14px;background:var(--surface);min-height:48px;max-height:160px;resize:none;font-size:16px}
.ecrire .rondbtn{width:48px;height:48px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;background:var(--bouton);font-size:20px}
.ecrire .rondbtn.envoi{background:var(--accent);color:var(--accent-ink)}
.jointe{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--accent-soft);border-radius:12px;padding:6px 6px 6px 12px}
.jointe button{border:0;background:none;min-width:44px;min-height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vignettes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vignettes figure{margin:0;position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--sunk)}
.vignettes img{width:100%;height:100%;object-fit:cover;display:block}
.vignettes figure button{position:absolute;top:4px;right:4px;width:36px;height:36px;border-radius:50%;border:0;background:rgb(0 0 0 / .6);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.vignettes .ajout{border:1px dashed var(--line);border-radius:14px;aspect-ratio:1;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;color:var(--muted);cursor:pointer}
/* Feuille du bas */
.voile{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fondu .2s backwards}
.feuille{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column;gap:12px;animation:monte .3s cubic-bezier(.2,.8,.2,1) backwards}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:30;max-width:calc(100vw - 32px);font-weight:500;text-align:center}
.charge{display:flex;justify-content:center;padding:44px 0}
.charge svg{width:38px;height:34px;overflow:visible}
.charge path{fill:none;stroke:var(--accent);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:32 68;animation:trace 1.3s linear infinite}
@keyframes fondu{from{opacity:0}}
@keyframes monte{from{transform:translateY(40px);opacity:0}}
@keyframes trace{to{stroke-dashoffset:-100}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* Couleurs franches (12/11/2026), comme le pilote : en-tête et barre d'onglets olive sombre, olive = action, terracotta = urgent, ocre = à décider, vert = validé */

/* ===================== Fichiers ===================== */
const EXTENSIONS = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp", "image/heic": "heic", "application/pdf": "pdf", "text/plain": "txt",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document": "docx", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": "xlsx",
  "application/vnd.oasis.opendocument.text": "odt", "application/vnd.oasis.opendocument.spreadsheet": "ods" };
function reduire(f, max, qualite) {
  return new Promise((oui, non) => {
    const img = new Image(), u = URL.createObjectURL(f);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(b => b ? oui(b) : non(new Error("image")), "image/jpeg", qualite);
    };
    img.onerror = () => { URL.revokeObjectURL(u); non(new Error("image")); };
    img.src = u;
  });
}
/* Dépose un fichier dans le dossier du client ; le nom est tiré au hasard, l'extension vient du type. Rend son chemin. */
async function deposer(sous, f) {
  let blob = f, ext = EXTENSIONS[f.type];
  if (!ext) throw new Error("Ce type de fichier n'est pas accepté. Envoyez une photo, un PDF ou un document Word, Excel ou texte.");
  if (/^image\/(jpeg|png|webp)$/.test(f.type) && f.size > 4e5) { try { blob = await reduire(f, 1600, 0.82); ext = "jpg"; } catch (e) {} }
  if (blob.size > POIDS_MAX) throw new Error("Ce fichier est trop lourd (10 Mo au maximum).");
  const alea = Array.from(crypto.getRandomValues(new Uint8Array(8)), x => x.toString(16).padStart(2, "0")).join("");
  const chemin = `${D.client.id}/${sous}/${Date.now().toString(36)}-${alea}.${ext}`;
  const { error } = await sb.storage.from(SEAU).upload(chemin, blob, { contentType: ext === "jpg" ? "image/jpeg" : f.type });
  if (error) throw new Error(reseau(error) ? "Pas de réseau : réessayez." : "L'envoi du fichier a été refusé pour le moment. Réessayez plus tard.");
  return chemin;
}
/* Lien vers un fichier du stockage, valable 5 minutes (gardé 4 minutes pour ne pas le redemander à chaque affichage) */
const liens = {};
async function lienFichier(chemin, telecharger) {
  const cle = chemin + "|" + (telecharger || ""), l = liens[cle];
  if (l && Date.now() - l.le < 24e4) return l.url;
  const { data, error } = await sb.storage.from(SEAU).createSignedUrl(chemin, 300, telecharger ? { download: telecharger } : undefined);
  if (error || !data) throw new Error("fichier");
  liens[cle] = { url: data.signedUrl, le: Date.now() };
  return data.signedUrl;
}
/* Ouvre un fichier dans une nouvelle fenêtre (pièce jointe d'un message). La fenêtre est ouverte tout de suite, sinon le téléphone la bloque. */
async function ouvrirFichier(chemin) {
  const w = window.open("", "_blank");
  try { const u = await lienFichier(chemin); if (w) w.location = u; else location.href = u; }
  catch (e) { if (w) w.close(); toast("Ce fichier n'est pas disponible pour le moment."); }
}
const extDe = chemin => (String(chemin).match(/\.([a-z0-9]+)$/i) || [, ""])[1].toLowerCase();
const estImage = chemin => /^(jpe?g|png|webp)$/.test(extDe(chemin));
/* Lecteur de PDF (pdf.js, fourni avec l'appli) : chargé seulement quand un PDF est à montrer */
let pdfPret = null;
function chargerPdf() {
  const script = n => new Promise((oui, non) => { const e = document.createElement("script"); e.src = n; e.onload = oui; e.onerror = () => non(new Error("lecteur")); document.head.append(e); });
  return pdfPret || (pdfPret = script("pdf.worker.min.js").then(() => script("pdf.min.js")).then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js"; return window.pdfjsLib; }).catch(e => { pdfPret = null; throw e; }));
}
async function pagesPdf(url, largeur, max) {
  const lib = await chargerPdf(), pdf = await lib.getDocument({ url, isEvalSupported: false }).promise, pages = [];
  for (let i = 1; i <= Math.min(max, pdf.numPages); i++) {
    const pg = await pdf.getPage(i), v = pg.getViewport({ scale: largeur / pg.getViewport({ scale: 1 }).width }), c = document.createElement("canvas");
    c.width = Math.round(v.width); c.height = Math.round(v.height);
    await pg.render({ canvasContext: c.getContext("2d"), viewport: v }).promise; pages.push(c);
  }
  return { pages, total: pdf.numPages };
}

/* Deux sortes de conversation : avec OIKOS, et avec chaque intervenant qui a l'appli. Chaque bulle dit qui écrit. */

    };
  }

}

/* Un seul espace : chaque document en vignette, avec aperçu et téléchargement. Les factures gardent leur liste. Puis le relevé d'heures. */

const vignettes = {};   // aperçus déjà fabriqués, gardés tant que l'appli reste ouverte
const heuresFr = m => (Math.round(m / 60 * 100) / 100).toLocaleString("fr-FR") + " h";

const FAMILLES_DOC = [["Contrat et devis", ["contrat", "devis"]], ["Administratif", ["juridique", "feuille_signee"]], ["Suivi de vos prestations", ["feuille_route", "autre"]]];
function vueDocuments(z) {

  const mois = {}; D.heures.forEach(h => { const d = new Date(h.jour), k = d.getFullYear() + "-" + pad2(d.getMonth() + 1); (mois[k] = mois[k] || []).push(h); });

    if (d.chemin) ouvrirDocument(d); else if (/^https:\/\//.test(d.lien || "")) window.open(d.lien, "_blank", "noopener"); };
  remplirVignettes(docs);
}
/* Les vignettes se fabriquent l'une après l'autre : photo telle quelle, première page pour un PDF */
async function remplirVignettes(docs) {
  for (const d of docs) {
    const poser = () => { const el = document.querySelector(`[data-vig="${d.id}"]`); if (el && vignettes[d.id]) el.innerHTML = `<img src="${vignettes[d.id]}" alt="">`; return !!el; };
    if (vignettes[d.id]) { poser(); continue; }
    if (!d.chemin || !(estImage(d.chemin) || extDe(d.chemin) === "pdf")) continue;
    try {
      const u = await lienFichier(d.chemin);
      vignettes[d.id] = estImage(d.chemin) ? u : (await pagesPdf(u, 360, 1)).pages[0].toDataURL("image/jpeg", 0.8);
      if (!poser()) return;   // l'utilisateur a changé d'onglet
    } catch (e) {}
  }
}
function ouvrirDocument(d) {
  const ext = extDe(d.chemin), nom = (d.titre.replace(/[\\/:*?"<>|]+/g, " ").trim() || "document") + "." + ext;
  feuille(`<div class="row entre" style="flex-wrap:nowrap"><div class="corps"><h2>${esc(d.titre)}</h2><span class="muted small">${TYPES_DOC[d.categorie] || "Document"}${d.date_doc ? " · " + jourFr(d.date_doc) : ""}</span></div>
      <button class="btn petit flat" data-fermer aria-label="Fermer">${ico("croix")}</button></div>
    <button class="btn primary" type="button" id="dl">${ico("telecharger")} Télécharger</button>
    <div class="apercu" id="apercu">${CHARGE}</div>`, async z => {
    const zone = z.querySelector("#apercu");
    z.querySelector("#dl").onclick = async () => {
      try { const a = document.createElement("a"); a.href = await lienFichier(d.chemin, nom); a.download = nom; a.rel = "noopener"; document.body.append(a); a.click(); a.remove(); }
      catch (e) { toast("Le téléchargement n'a pas abouti. Réessayez."); }
    };
    try {
      const u = await lienFichier(d.chemin);
      if (estImage(d.chemin)) zone.innerHTML = `<img src="${u}" alt="${esc(d.titre)}">`;
      else if (ext === "pdf") {
        const { pages, total } = await pagesPdf(u, Math.min(1100, Math.round((zone.clientWidth || 340) * Math.min(2, devicePixelRatio || 1))), 12);
        zone.innerHTML = ""; pages.forEach(c => zone.append(c));
        if (total > pages.length) zone.insertAdjacentHTML("beforeend", `<p class="muted small">${total - pages.length} page${total - pages.length > 1 ? "s" : ""} de plus dans le fichier : téléchargez-le pour tout voir.</p>`);
      } else zone.innerHTML = `<p class="muted" style="text-align:center">Pas d'aperçu pour ce type de fichier.<br>Téléchargez-le pour l'ouvrir.</p>`;
    } catch (e) { zone.innerHTML = `<p class="muted" style="text-align:center">L'aperçu n'a pas pu s'afficher.<br>Vous pouvez télécharger le document.</p>`; }
  });
}

/* ===================== Avance immédiate (URSSAF) ===================== */
function ibanValide(t) {
  const s = String(t).replace(/\s/g, "").toUpperCase(); if (!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(s)) return false;
  const r = (s.slice(4) + s.slice(0, 4)).replace(/[A-Z]/g, c => c.charCodeAt(0) - 55); let m = 0; for (const c of r) m = (m * 10 + +c) % 97; return m === 1;
}

      ${urssaf[2] ? `<button class="btn petit" data-va="urssaf">${ico("euro")} Ouvrir le formulaire</button>` : ""}</section>` : ""}
    <section class="stack">
      ${!installee ? `<button class="btn" id="installer">${ico("ecran")} Mettre l'appli sur mon écran d'accueil</button>` : ""}
      <button class="btn" id="mdp">${ico("cadenas")} Changer mon mot de passe</button>
      <a class="btn" href="tel:${chiffres(TEL_OIKOS)}">${ico("tel")} Appeler OIKOS · ${TEL_OIKOS}</a>
      <button class="btn stop" id="sortir">${ico("sortie")} Me déconnecter</button>
    </section>
    <p class="muted small" style="text-align:center">OIKOS Sud Services · Espace client</p>`;
  z.onclick = async e => {
    const b = e.target.closest("[data-va]"); if (b) { LS.set("urssaf-range", null); return accueil(b.dataset.va); }
    if (e.target.closest("#mdp")) return ecranNouveauMdp(false);
    if (e.target.closest("#sortir")) { await sortir(); return ecranCode(); }
    if (e.target.closest("#installer")) {
      if (invite) { invite.prompt(); invite = null; return; }
      feuille(`<h2>Sur l'écran d'accueil</h2><p>Sur iPhone : touchez le bouton Partager de Safari, puis « Sur l'écran d'accueil ».</p><p>Sur Android : ouvrez le menu de Chrome (les trois points), puis « Ajouter à l'écran d'accueil ».</p><button class="btn primary" data-fermer>J'ai compris</button>`);
    }
  };
}

const VUES = { accueil: vueAccueil, suivi: vueSuivi, demander: vueDemander, messages: vueMessages, documents: vueDocuments, urssaf: vueUrssaf, compte: vueCompte };
document.addEventListener("visibilitychange", async () => { if (!document.hidden && D && !document.querySelector(".voile") && !saisieEnCours() && await charger()) dessiner(true); });
demarrer();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
