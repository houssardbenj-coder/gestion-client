<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7A8568">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://nzxphozupnmqyikitwhv.supabase.co; connect-src 'self' https://nzxphozupnmqyikitwhv.supabase.co wss://nzxphozupnmqyikitwhv.supabase.co; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>OIKOS Intervenant</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600;700;800&display=swap">
<style>
/* Appli des intervenantes OIKOS : un écran à la fois, gros boutons, barre d'onglets en bas.
   Rien n'est gardé sur le téléphone à part la session et le code à 4 chiffres (chiffré). */
:root{
  --bg:#F7F5EE; --surface:#FFFFFF; --sunk:#EDEAE0; --ink:#23241F; --muted:#5A5B52; --line:#DAD7CA;
  --accent:#525A44; --accent-ink:#FFFFFF; --accent-soft:#E7E8DA;
  --go:#3E7D3A; --go-ink:#FFFFFF; --stop:#A8432B; --warn:#8A5A0E; --warn-soft:#F4E9CC;
  --carte:#FFFFFF; --carte-bord:transparent; --ombre:0 1px 2px rgb(35 36 31 / .05),0 16px 36px rgb(35 36 31 / .07); --ombre-btn:0 10px 26px rgb(82 90 68 / .26); --flou:none;
  --bouton:#F0EEE4; --verre:rgb(255 255 255 / .86); --verre-bord:transparent; --ombre-nav:0 1px 2px rgb(35 36 31 / .06),0 14px 34px rgb(35 36 31 / .13); --ind:var(--accent-soft); --ind-ic:var(--ink);
  --mono:#D6D9CC; --tri:transparent; --trait:transparent; --paie:#DFF0DC; --paie-ink:#2C6B29; --delai:#FBE3DE; --delai-ink:#8E2F1C;
  --titre:Fraunces,"Cormorant Garamond",Georgia,serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1B1D15; --surface:#26291F; --sunk:#14160F; --ink:#F3F1E7; --muted:#BDBEAE; --line:#3D4033;
  --accent:#C9D4AA; --accent-ink:#1B1D15; --accent-soft:#363A2B;
  --go:#7CC26F; --go-ink:#14160F; --stop:#E9775F; --warn:#E0B458; --warn-soft:#3A3115;
  --carte:rgb(243 241 231 / .075); --carte-bord:rgb(243 241 231 / .16); --ombre:0 24px 50px rgb(0 0 0 / .28); --ombre-btn:none; --flou:blur(20px);
  --bouton:rgb(243 241 231 / .08); --verre:rgb(38 41 30 / .8); --verre-bord:rgb(243 241 231 / .14); --ombre-nav:none; --ind:#C9D4AA; --ind-ic:#1B1D15;
  --mono:#5C6349; --tri:#2B2E21; --trait:rgb(243 241 231 / .22); --paie:#26361F; --paie-ink:#A6DC9B; --delai:#43231A; --delai-ink:#F4B5A5; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1B1D15; --surface:#26291F; --sunk:#14160F; --ink:#F3F1E7; --muted:#BDBEAE; --line:#3D4033;
  --accent:#C9D4AA; --accent-ink:#1B1D15; --accent-soft:#363A2B;
  --go:#7CC26F; --go-ink:#14160F; --stop:#E9775F; --warn:#E0B458; --warn-soft:#3A3115;
  --carte:rgb(243 241 231 / .075); --carte-bord:rgb(243 241 231 / .16); --ombre:0 24px 50px rgb(0 0 0 / .28); --ombre-btn:none; --flou:blur(20px);
  --bouton:rgb(243 241 231 / .08); --verre:rgb(38 41 30 / .8); --verre-bord:rgb(243 241 231 / .14); --ombre-nav:none; --ind:#C9D4AA; --ind-ic:#1B1D15;
  --mono:#5C6349; --tri:#2B2E21; --trait:rgb(243 241 231 / .22); --paie:#26361F; --paie-ink:#A6DC9B; --delai:#43231A; --delai-ink:#F4B5A5; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.page{flex:1;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
.page.solo{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;justify-content:center;gap:18px}
h1{font-family:var(--titre);font-weight:600;font-size:28px;line-height:1.15;letter-spacing:-.01em;margin:0}
h2{font-family:var(--titre);font-weight:600;font-size:20px;margin:22px 0 10px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
/* La marque OIKOS : le logo reste sur sa tuile crème, lisible aussi en mode sombre */
.tuile{flex:none;background:#F7F5EE;border:1px solid var(--line);border-radius:12px;object-fit:contain}
.marque-acc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.marque-acc .tuile{width:128px;height:128px;border-radius:24px;padding:8px}
.marque-nom{font-family:var(--titre);font-size:22px;line-height:1.15;font-weight:500}
.marque-nom b{font-weight:600}
.marque-sous{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.entete{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px}
.entete .tuile{width:50px;height:50px;padding:1px}
.entete .marque-nom{font-size:18px}
.entete .marque-sous{font-size:10px}
.entete + .page{padding-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:18px;cursor:pointer;text-decoration:none;color:var(--ink);text-align:center}
.btn.big{min-height:72px;font-size:21px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);border-radius:999px}
.btn.go{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.btn.stop{background:var(--stop);border-color:var(--stop);color:#fff}
.btn.flat{background:transparent;border-color:transparent;color:var(--accent);min-height:44px;font-size:16px}
.btn:disabled{opacity:.5}
.btn .ic{font-size:24px;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:15px;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--surface);color:var(--ink);font-size:17px;width:100%}
label.f textarea{min-height:90px;resize:vertical}
.chk{display:flex;align-items:center;gap:10px;font-size:17px;padding:6px 0}
.chk input{width:24px;height:24px}
.err{color:var(--stop);font-weight:600;min-height:1.2em}
.client-nom{font-weight:600;font-size:19px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.encours{border:2px solid var(--go)}
.ligne{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ligne:first-child{border-top:0}
.ligne button{border:0;background:none;text-align:left;padding:0;cursor:pointer;flex:1}
.ligne button.coche{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;text-align:center}
.ligne button.coche[aria-pressed="true"]{background:var(--go);border-color:var(--go);color:#fff}
.compteur{font-size:40px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--accent);margin:0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid3 .btn{font-size:15px;padding:10px 6px;flex-direction:column;gap:2px}
.lien{color:var(--accent);text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;cursor:pointer;text-align:left;font:inherit}
.lien.client-nom{font-weight:600;font-size:19px;text-decoration:none;color:var(--ink)}
a.lien.muted{color:var(--muted)}
/* agenda : même présentation que Pense intelligent */
.ag{display:flex;flex-direction:column;gap:10px}
.ag-head{display:flex;align-items:center;gap:6px}
.ag-title{font-weight:600;font-size:20px;flex:1;text-align:center;text-transform:capitalize}
.ag-nav{border:0;background:none;color:var(--accent);font-size:32px;line-height:1;padding:2px 14px;cursor:pointer}
.ag-auj{min-height:38px;padding:6px 12px;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .15)}
.ag-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ag-d{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0;cursor:pointer;min-width:0}
.ag-d span{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.ag-d b{font-size:17px;font-variant-numeric:tabular-nums}
.ag-d i{font-style:normal;color:var(--accent);font-size:11px;line-height:1;height:11px;letter-spacing:1px}
.ag-d.today b{color:var(--accent)}
.ag-d.sel{background:var(--ink);border-color:var(--ink)}
.ag-d.sel span,.ag-d.sel b,.ag-d.sel i{color:var(--bg)}
.ag-dayname{font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ag-grid,.wk-body{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ag-hour{position:absolute;left:0;right:0;height:56px;border-top:1px solid var(--line);pointer-events:none}
.ag-hour:first-child{border-top:0}
.ag-hour span{position:absolute;left:8px;top:3px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ag-hour::after{content:"";position:absolute;left:44px;right:0;top:50%;border-top:1px dashed var(--line)}
/* choix rapide du jour et de l'heure : comme Pense intelligent */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:40px;padding:6px 12px;font-size:15px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pk{display:flex;flex-direction:column;gap:8px}
.pk-tete{display:flex;gap:2px;align-items:center}
.pk-tete .chips{flex:1;justify-content:center}
.pk-tete .ag-nav{padding:2px 8px}
.pk-autre{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--sunk);border-radius:12px}
.pk-autre .pk-tete b{flex:1;text-align:center;text-transform:capitalize}
.pk-champ{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--surface);color:var(--ink);font-size:17px;width:100%}
#pk-txt{border-style:dashed}
.ag-d.passe{opacity:.5}
.pk-grille{position:relative;background:var(--sunk);border-radius:12px;overflow:hidden;cursor:copy}
.pk-h{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.pk-h:first-child{border-top:0}
.pk-h span{position:absolute;left:8px;top:2px;font-size:12px;color:var(--muted)}
.pk-h::after{content:"";position:absolute;left:44px;right:0;top:50%;border-top:1px dashed var(--line)}
.pk-rdv,.pk-new{position:absolute;border-radius:6px;padding:1px 6px;font-size:13px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;pointer-events:none}
.pk-rdv{background:var(--accent-soft);border-left:3px solid var(--accent)}
.pk-new{left:44px;right:4px;background:var(--accent);color:var(--accent-ink);border:2px solid var(--ink)}
.pk-new.conflit{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.pk-maint{position:absolute;left:40px;right:0;height:2px;background:var(--stop);pointer-events:none}
.pk-alerte{color:var(--warn);font-weight:600;font-size:15px}
.cl-liste{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.cl-liste .btn{display:block;width:100%;min-height:48px;text-align:left;font-size:16px;font-weight:400}
.ag-ev,.wk-ev{position:absolute;border:0;border-left:4px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:3px 7px;text-align:left;display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
.ag-ev b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-ev span{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-fait{border-left-color:var(--go);background:color-mix(in srgb,var(--go) 20%,var(--surface))}
.k-perso{border-left-color:var(--muted);background:color-mix(in srgb,var(--muted) 14%,var(--surface))}
.ag-now,.wk-now{position:absolute;height:2px;background:var(--stop);pointer-events:none}
.ag-now{left:40px;right:0}
.ag-now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--stop)}
.wk{display:flex;flex-direction:column;gap:4px}
.wk-hd{display:grid;grid-template-columns:30px repeat(7,1fr);gap:2px}
.wk-day{border:0;background:none;display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:4px 0;border-radius:10px;min-width:0}
.wk-day span{font-size:11px;text-transform:uppercase;color:var(--muted)}
.wk-day b{font-size:16px}
.wk-day.today b{color:var(--accent)}
.wk-hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.wk-hr span{position:absolute;left:4px;top:2px;font-size:11px;color:var(--muted)}
.wk-ev{padding:2px 3px;border-left-width:3px;border-radius:5px}
.wk-ev b{font-size:11px}
.wk-ev span{font-size:10px;line-height:1.15;overflow:hidden}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photo{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.vignette{display:block;width:100%;border:0;padding:0;background:var(--sunk);cursor:pointer}
.vignette img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.photo figcaption{padding:6px 8px;font-size:13px;line-height:1.3}
.info dt{font-size:13px;color:var(--muted);margin-top:8px}
.info dd{margin:0;white-space:pre-wrap}
/* barre d'onglets */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav button{border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.nav button .ic{font-size:24px;line-height:1.1}
.nav button[aria-current="page"]{color:var(--accent)}
/* clavier du code */
/* Écran du code : fond olive, triangles du logo, chiffres fins. Toujours sombre, quel que soit le thème. */
.verrou{position:fixed;inset:0;z-index:15;overflow:auto;isolation:isolate;color:#F3F1E7;background:radial-gradient(120% 80% at 50% 16%,#6C7458 0%,#515741 52%,#383C2E 100%);display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.5dvh,16px);padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(env(safe-area-inset-bottom,0px) + 14px)}
.verrou>.v-logo{margin-top:auto}
.verrou>:last-child{margin-bottom:auto}
.verrou::before{content:"";position:fixed;z-index:-1;width:120vmax;height:120vmax;left:calc(50% - 60vmax);top:calc(50% - 60vmax);border-radius:50%;background:radial-gradient(circle,rgb(247 245 238 / .17),transparent 58%);pointer-events:none;animation:v-lumiere 24s ease-in-out infinite alternate}
.v-fond{position:fixed;inset:-25%;width:150%;height:150%;z-index:-1;pointer-events:none}
.v-fond path{fill:none;stroke:#F3F1E7;stroke-opacity:.15;stroke-width:.14;transform-origin:50% 50%;transform-box:view-box}
.v-fond .t1{animation:v-tourne 90s linear infinite}
.v-fond .t2{animation:v-tourne 130s linear infinite reverse;stroke-opacity:.2}
.v-logo{position:relative;width:clamp(84px,17dvh,148px);aspect-ratio:1;flex:none}
.v-logo::before{content:"";position:absolute;inset:-34%;z-index:-1;border-radius:50%;background:radial-gradient(circle,rgb(247 245 238 / .26),transparent 66%);animation:v-halo 7s ease-in-out infinite alternate}
.v-logo img{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 6px rgb(26 28 21 / .28))}
.v-logo i{position:absolute;inset:0;-webkit-mask:url(logo-clair.png) center/contain no-repeat;mask:url(logo-clair.png) center/contain no-repeat;background:linear-gradient(105deg,transparent 42%,rgb(255 255 255 / .85) 50%,transparent 58%) 130% 0/300% 100% no-repeat;animation:v-reflet 9s 1s ease-in-out infinite}
.v-marque{font-size:10.5px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:rgb(243 241 231 / .95);padding-left:.32em}
.verrou h1{font-weight:300;font-size:clamp(28px,4.6dvh,40px);letter-spacing:-.015em;text-align:center;margin-top:clamp(4px,1.6dvh,18px)}
.v-texte{font-size:15px;color:rgb(243 241 231 / .92);text-align:center;max-width:300px;font-weight:400}
.v-slots{display:flex;gap:18px;margin-top:clamp(6px,1.6dvh,16px);position:relative}
.v-slots svg{width:16px;height:14.4px;overflow:visible;transition:transform .34s cubic-bezier(.3,1.7,.5,1)}
.v-slots path{fill:transparent;stroke:rgb(243 241 231 / .85);stroke-width:1.3;stroke-linejoin:round;transition:fill .18s,stroke .18s}
.v-slots svg.on{transform:translateY(-2px) scale(1.2)}
.v-slots svg.on path{fill:#F3F1E7;stroke:#F3F1E7}
.v-err{min-height:1.4em;font-size:14px;font-weight:500;color:#FFD6CA;text-align:center}
.v-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(0px,.8dvh,8px) 8px;width:min(300px,84vw)}
.v-pad button{position:relative;overflow:hidden;justify-self:center;width:clamp(58px,10.4dvh,80px);height:clamp(58px,10.4dvh,80px);border:0;border-radius:50%;background:none;color:inherit;font:300 clamp(28px,4.4dvh,36px)/1 var(--titre);font-variant-numeric:lining-nums;cursor:pointer;touch-action:manipulation;transition:transform .16s,background-color .3s;-webkit-tap-highlight-color:transparent}
.v-pad button::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgb(243 241 231 / .3);transition:border-color .25s}
.v-pad button:active{transform:scale(.93);background:rgb(243 241 231 / .07)}
.v-pad button:active::after{border-color:rgb(243 241 231 / .5)}
.v-pad .vide{visibility:hidden}
.v-pad .v-eff::after{border:0}
.v-pad .v-eff{opacity:0;transition:opacity .2s,transform .16s}
.v-pad .v-eff.vis{opacity:1}
.v-pad .v-eff svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.v-onde{position:absolute;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;background:radial-gradient(circle,rgb(243 241 231 / .28),transparent 68%);pointer-events:none;animation:v-onde .55s ease-out forwards}
.v-lien{border:0;background:none;color:rgb(243 241 231 / .92);font-size:14px;padding:10px;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.v-in{animation:v-monte .8s calc(var(--i)*70ms) cubic-bezier(.2,.7,.2,1) both}

/* Chaque morceau donne un client (reconnu parmi SES clients, même mal écrit), un jour, une durée ou un créneau. */
const MOIS_FR = ["janvier", "fevrier", "mars", "avril", "mai", "juin", "juillet", "aout", "septembre", "octobre", "novembre", "decembre"];
const JOURS_FR = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];

const VIDES = new Set("le la les l du de des d chez pour avec et puis ensuite apres un une a au aux ce cet cette matin midi soir aprem apresmidi j ai fait fais vu menage passage heure heures h min minutes mn aujourd hui aujourdhui hier avant demi demie quart madame monsieur mme mr m".split(" "));
const sansAcc = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function distance(a, b) {   // nombre de lettres à changer pour passer de a à b
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
/* Comme ça se prononce : « lieutot » = « Lieutaud », « bibasse » = « Bibas » */
const oreille = w => w.replace(/ph/g, "f").replace(/qu/g, "k").replace(/c([eiy])/g, "s$1").replace(/(eau|ault|aud|aut|au)/g, "o").replace(/(.)\1+/g, "$1").replace(/[dtsxe]+$/, "");
const proche = (a, b) => a === b ? 1 : (a.length >= 3 && b.startsWith(a)) || (b.length >= 3 && a.startsWith(b)) ? .9 : 1 - distance(a, b) / Math.max(a.length, b.length);
const ressemblance = (a, b) => Math.max(proche(a, b), a.length >= 3 && b.length >= 3 ? proche(oreille(a), oreille(b)) * .95 : 0);
function devinerClient(mots) {
  let mieux = null, second = 0;
  clients.forEach(c => {
    const siens = sansAcc(c.nom).split(/[^a-z0-9]+/).filter(m => m.length >= 2);
    const score = Math.max(0, ...mots.map(m => Math.max(0, ...siens.map(s => ressemblance(m, s)))));
    if (!mieux || score > mieux.score) { second = mieux ? mieux.score : 0; mieux = { c, score }; } else second = Math.max(second, score);
  });
  return mieux && mieux.score >= .75 && mieux.score - second > .05 ? mieux.c.id : "";
}

function lireMorceau(brut, jourParDefaut) {
  let t = " " + sansAcc(brut).replace(/[’']/g, " ").replace(/\s+/g, " ") + " ", m;
  const l = { client_id: "", jour: "", debut: "", fin: "", minutes: 0, note: "" };
  const [d, trouve] = lireDate(t, debutJour());
  if (d) { l.jour = versLocal(d).slice(0, 10); t = t.replace(trouve, " "); } else l.jour = jourParDefaut;
  // créneau : 9h-12h, 9h30 à 12h, de 14 h à 16h30
  if ((m = /(?:de )?(\d{1,2}) ?[h:] ?(\d{2})? ?(?:-|a|au|jusqu a) ?(\d{1,2}) ?[h:]? ?(\d{2})?(?![\d])/.exec(t))) {
    const a = +m[1] * 60 + +(m[2] || 0), b = +m[3] * 60 + +(m[4] || 0);
    if (b > a && b <= 24 * 60) { l.debut = pad2(m[1]) + ":" + pad2(m[2] || 0); l.fin = pad2(m[3]) + ":" + pad2(m[4] || 0); l.minutes = b - a; t = t.replace(m[0], " "); }
  }
  if (!l.minutes) {   // durée : 3h, 3h30, 2,5h, 45 min, trois heures et demie
    if ((m = /(\d{1,2})[.,](\d{1,2}) ?h\b/.exec(t))) l.minutes = Math.round(parseFloat(m[1] + "." + m[2]) * 60);
    else if ((m = /(\d{1,2}) ?h ?(\d{2})?(?!\d)/.exec(t))) l.minutes = +m[1] * 60 + +(m[2] || 0);
    else if ((m = /(\d{1,3}) ?(?:min|mn|minutes?)\b/.exec(t))) l.minutes = +m[1];
    else if ((m = new RegExp("\\b(" + Object.keys(NOMBRES).join("|") + ") heures?( et demie?| et quart)?").exec(t))) l.minutes = NOMBRES[m[1]] * 60 + (m[2] ? (/quart/.test(m[2]) ? 15 : 30) : 0);
    if (m) { t = t.replace(m[0], " "); if (/et demie?/.test(t) && !/et demie?|et quart/.test(m[0])) { l.minutes += 30; t = t.replace(/et demie?/, " "); } }
  }
  const mots = t.split(/[^a-z0-9]+/).filter(x => x.length >= 2 && !VIDES.has(x) && !/^\d+$/.test(x));

}
function lireDeclaration(texte) {
  const lignes = [];
  texte.split(/\n+/).forEach(ligne => {
    // virgule, point-virgule, « puis », « et » séparent les passages (mais pas « 2,5h » ni « 3h et demie »)
    const morceaux = ligne.split(/,(?!\d)|(?<!\d),|;| puis | ensuite | et (?!demi|quart)/i).map(s => s.trim()).filter(Boolean);
    let jourLigne = versLocal(debutJour()).slice(0, 10);   // « hier : Bibas 3h, Haddad 2h » : le jour vaut aussi pour les suivants
    morceaux.forEach(mc => {
      const l = lireMorceau(mc, jourLigne);
      jourLigne = l.jour;
      if (l.client_id || l.minutes) lignes.push(l);
      else if (lignes.length) lignes[lignes.length - 1].note = ((lignes[lignes.length - 1].note || "") + " " + mc).trim();   // reste = remarque

}

/* ---------- Feuille de route : les tâches du client, classées par points ; elle coche ce qu'elle fait ---------- */
/* Même calcul que dans le tableau de bord : plus une tâche dépasse sa fréquence sans être cochée, plus elle
   monte ; « en partie » compte pour la moitié ; la météo inhabituelle en pousse ou en met en pause. */
const METEO_PLUS = { canicule: ["arrosage"], secheresse: ["arrosage"], vent: ["ramassage", "nettoyage"], pluie: ["ramassage", "nettoyage"] };
const METEO_PAUSE = { gel: ["taille", "plantation", "traitement"], canicule: ["plantation", "traitement", "taille"], pluie: ["traitement", "tonte"] };
const CATS_ROUTE = { tonte: "Tonte", taille: "Taille", desherbage: "Désherbage", arrosage: "Arrosage", ramassage: "Ramassage", plantation: "Plantation", traitement: "Traitement", nettoyage: "Nettoyage", menage: "Ménage", autre: "Autre" };
const FREQS = [["", "Une seule fois"], [7, "Chaque semaine"], [14, "Tous les 15 jours"], [30, "Chaque mois"], [90, "Chaque saison"], [365, "Une fois par an"]];
function pointsTache(t, meteo, maintenant = Date.now()) {
  if (!t.actif || t.termine) return { points: 0, etat: "fini" };
  const mois = new Date(maintenant).getMonth() + 1;
  if (t.mois && t.mois.length && !t.mois.includes(mois)) return { points: 0, etat: "hors saison" };
  const types = ((meteo && meteo.alertes) || []).map(a => a.type);
  if (types.some(k => (METEO_PAUSE[k] || []).includes(t.categorie))) return { points: 0, etat: "pause météo" };
  const freq = t.frequence_jours || 14;   // ponctuelle : monte en deux semaines
  let depuis = t.derniere_fois ? +new Date(t.derniere_fois) : +new Date(t.cree_le) - freq * 864e5;   // jamais faite : due tout de suite
  if (t.derniere_partielle) depuis = Math.max(depuis, +new Date(t.derniere_partielle) - freq * 864e5 / 2);   // en partie : repart à mi-chemin
  const retard = Math.max(0, (maintenant - depuis) / (freq * 864e5));
  let points = Math.round(t.priorite * 10 * retard);
  if (types.some(k => (METEO_PLUS[k] || []).includes(t.categorie))) points *= 2;
  return { points, retard, etat: retard >= 1 ? "à faire" : retard >= 0.7 ? "bientôt" : "à jour" };
}
const dureeTxt = m => !m ? "" : m < 60 ? m + " min" : heuresTxt(m);
async function feuilleRoute(clientId, minPassage) {
  const c = clients.find(k => k.id === clientId) || {};

    const j0 = debutJour().toISOString();
    const [tr, cr] = await Promise.all([
      sb.from("route_taches").select("*").eq("client_id", clientId).eq("actif", true).eq("termine", false),
      sb.from("route_coches").select("*").eq("client_id", clientId).gte("fait_le", j0)]);
    if (tr.error) { souci(tr.error); return ""; }
    const coches = cr.data || [], budget = minPassage || c.temps_semaine_min || 0;
    const liste = tr.data.map(t => ({ t, ...pointsTache(t, c.meteo), coche: coches.filter(k => k.tache_id === t.id).sort((a, b) => b.fait_le.localeCompare(a.fait_le))[0] }))
      .sort((a, b) => b.points - a.points || b.t.priorite - a.t.priorite);
    const actives = liste.filter(o => o.coche || o.etat === "à faire" || o.etat === "bientôt");
    let cumul = 0;
    actives.forEach(o => { o.auProgramme = !budget || cumul < budget; cumul += o.t.duree_min || 0; });
    const reste = liste.filter(o => !actives.includes(o));

    const alertes = (c.meteo && c.meteo.alertes) || [];
    return `<h2 style="margin:0">${ico("route")} ${esc(c.nom || "Client")}</h2>
      <p class="muted small">Classées par priorité du moment. Les durées sont indicatives : fais au mieux, coche ce que tu as fait.</p>
      ${alertes.length ? `<p class="tag warn" style="padding:8px 12px;border-radius:12px">${alertes.map(a => ico("alerte") + " " + esc(a.texte)).join("<br>")}</p>` : ""}
      ${budget ? `<p><b>Temps prévu : ≈ ${heuresTxt(budget)}</b></p>` : ""}
      ${actives.filter(o => o.auProgramme).length ? `<h2 style="margin:4px 0 0">Au programme</h2><div class="stack">${actives.filter(o => o.auProgramme).map(ligne).join("")}</div>` : `<p class="muted">Rien d'urgent : tout est à jour.</p>`}

      ${reste.length ? `<details><summary class="muted small">${reste.length} autre(s) tâche(s) à jour, hors saison ou en pause</summary><div class="stack" style="margin-top:8px">${reste.map(o => `<div class="card"><b>${esc(o.t.titre)}</b><span class="muted small">${o.etat}</span></div>`).join("")}</div></details>` : ""}

  };

    el.onclick = async e => {

        return;

async function reduire(f, max, qualite) {
  const img = await createImageBitmap(f), k = Math.min(1, max / Math.max(img.width, img.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  return new Promise((ok, ko) => cv.toBlob(b => b ? ok(b) : ko(new Error("image illisible")), "image/jpeg", qualite));
}

  const n = Date.now() + "-" + Math.random().toString(36).slice(2, 7), ch = `${d.client_id}/photos/${n}.jpg`, ap = `${d.client_id}/apercus/${n}.jpg`;

/* Photo réduite (2000 px) pour un envoi rapide, PDF tel quel ; 10 Mo au plus */
async function preparerFichier(f) {
  if (!/^image\/(jpeg|png|webp)$/.test(f.type) || f.size < 1.5e6) return f;
  try {
    const img = await createImageBitmap(f), k = Math.min(1, 2000 / Math.max(img.width, img.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    const b = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.85));
    return b ? new File([b], f.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : f;
  } catch (e) { return f; }
}
async function envoyerPapier(piece, brut) {
  const f = await preparerFichier(brut);
  if (f.size > 10 * 1024 * 1024) throw new Error("fichier trop gros (10 Mo au plus) : prends plutôt une photo.");
  const ext = (f.name.match(/\.(\w+)$/) || [, f.type === "application/pdf" ? "pdf" : "jpg"])[1].toLowerCase();
  const nom = piece.libelle.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40).toLowerCase() || "document";
  const chemin = `${moi.id}/${Date.now()}-${Math.random().toString(36).slice(2, 6)}-${nom}.${ext}`;   // plusieurs pages d'un coup : jamais le même nom
  const up = await sb.storage.from("documents").upload(chemin, f, { contentType: f.type || "application/octet-stream" });
  if (up.error) throw up.error;
  const { error } = await sb.from("documents").insert({ piece_id: piece.id, libelle: piece.libelle, fichier: chemin, nom_origine: brut.name });
  if (error) throw error;
}

  el.innerHTML = `<div class="did-trou"></div><button class="did-zone" type="button" hidden></button><div class="did-queue cache"></div><div class="did-bulle"></div>`;
  document.body.append(el);
  did = { el, etapes: etapesDidacticiel(), i: -1, trou: el.querySelector(".did-trou"), zone: el.querySelector(".did-zone"), queue: el.querySelector(".did-queue"), bulle: el.querySelector(".did-bulle") };
  /* Toute la page est sous le voile : seuls la zone éclairée et les boutons de la bulle répondent, jamais un vrai bouton de l'appli */
  el.addEventListener("click", e => {
    if (e.target.closest(".did-bulle,.did-zone")) return;
    did.trou.classList.remove("secoue"); void did.trou.offsetWidth; did.trou.classList.add("secoue");
  });
  did.zone.onclick = () => { const e = did.etapes[did.i]; if (e.action) passerEtape(e.action); };
  did.minuteur = setInterval(placerDidacticiel, 250);
  addEventListener("resize", placerDidacticiel);
  afficherEtape(0);
}
/* Marque la visite comme vue (une fin ou « Passer ») ; sans marque, elle reprendra à la prochaine ouverture */
function fermerDidacticiel(vu) {
  if (did) { clearInterval(did.minuteur); removeEventListener("resize", placerDidacticiel); did.el.remove(); did = null; }
  if (vu && moi) {
    LS.set("didacticiel-vu", 1);
    moi.didacticiel_vu_le = new Date().toISOString();
    sb.from("profils").update({ didacticiel_vu_le: moi.didacticiel_vu_le }).eq("id", moi.id).then(() => {}, () => {});
  }
}
/* L'écran voulu apparaît sans voile un court instant, puis la lumière part vers le point suivant */
async function passerEtape(action) {
  const d = did; if (d.occupe) return;
  d.occupe = true; vibre(5);
  d.trou.classList.add("repos"); d.trou.classList.remove("vise"); d.bulle.classList.add("repos"); d.queue.classList.add("cache"); d.zone.hidden = true;
  try { if (action) await action(); } catch (x) {}
  if (did !== d) return;
  await new Promise(r => setTimeout(r, action ? 750 : 0));
  if (did !== d) return;
  d.occupe = false;
  afficherEtape(d.i + 1);
}
async function afficherEtape(i) {
  const d = did, e = d.etapes[i];
  if (!e) { fermerDidacticiel(true); return; }
  d.i = i;
  if (e.cible) {
    for (let n = 0; n < 16 && !document.querySelector(e.cible); n++) await new Promise(r => setTimeout(r, 125));
    if (did !== d) return;
    const c = document.querySelector(e.cible);
    if (!c) return afficherEtape(i + 1);   // bouton absent : on ne reste jamais bloqué
    c.scrollIntoView({ block: "center" });
  }
  d.bulle.innerHTML = `<button class="did-passer" type="button">Passer</button>
    <div class="${e.chute ? "did-chute" : "did-pose"}">${olive(e.pose)}</div>
    <div class="did-txt"><h2>${e.titre}</h2><p>${e.texte}</p>${e.aide ? `<p class="did-aide">${e.aide}</p>` : ""}</div>
    ${e.boutons ? `<div class="did-btns">${e.boutons.map(([t, principal], n) => `<button class="btn${principal ? " primary" : ""}" type="button" data-b="${n}">${t}</button>`).join("")}</div>` : ""}`;
  d.bulle.querySelector(".did-passer").onclick = () => { fermerDidacticiel(true); toast("Vous pourrez revoir la visite dans l'onglet Moi."); };
  d.bulle.querySelectorAll("[data-b]").forEach(b => b.onclick = async () => {
    const f = e.boutons[b.dataset.b][2];
    if (f === undefined) return passerEtape();
    await f();
    if (did === d) passerEtape();
  });
  d.trou.classList.remove("repos"); d.bulle.classList.remove("repos");
  placerDidacticiel();
  (d.bulle.querySelector(".btn.primary") || d.zone).focus({ preventScroll: true });
}
function placerDidacticiel() {
  const d = did; if (!d || d.occupe || d.i < 0) return;
  const e = d.etapes[d.i], c = e && e.cible && document.querySelector(e.cible);
  if (!c) {
    Object.assign(d.trou.style, { left: "50%", top: "50%", width: "0", height: "0" });
    d.trou.classList.remove("vise"); d.zone.hidden = true; d.queue.classList.add("cache");
    d.bulle.classList.add("centre"); d.bulle.style.top = ""; d.bulle.style.bottom = "";
    return;
  }
  const r = c.getBoundingClientRect(), m = 4;
  const zone = { left: r.left - m + "px", top: r.top - m + "px", width: r.width + 2 * m + "px", height: r.height + 2 * m + "px" };
  Object.assign(d.trou.style, zone); Object.assign(d.zone.style, zone);
  d.trou.classList.add("vise"); d.zone.hidden = false;
  d.zone.setAttribute("aria-label", e.titre.replace(/ !$/, ""));
  d.bulle.classList.remove("centre");
  const dessus = r.top > innerHeight / 2, ecart = 18;
  d.bulle.style.top = dessus ? "" : r.bottom + m + ecart + "px";
  d.bulle.style.bottom = dessus ? innerHeight - r.top + m + ecart + "px" : "";
  const b = d.bulle.getBoundingClientRect();
  d.queue.className = "did-queue " + (dessus ? "bas" : "haut");
  d.queue.style.left = Math.max(b.left + 14, Math.min(b.right - 32, r.left + r.width / 2 - 9)) + "px";
  d.queue.style.top = (dessus ? b.bottom - 1 : b.top - 9) + "px";
}

/* ===================== Verrou quand l'appli revient au premier plan ===================== */
let cachee = 0, verrouille = false;
document.addEventListener("visibilitychange", async () => {
  if (document.hidden) { cachee = Date.now(); return; }
  if (!cachee || Date.now() - cachee < VERROU_MIN * 60000 || verrouille) return;
  const { data: { session } } = await sb.auth.getSession();
  if (session && LS.get("pin")) { verrouille = true; document.querySelectorAll(".voile").forEach(v => v.remove()); fermerDidacticiel(); demarrer(); }
});

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
demarrer();
</script>
