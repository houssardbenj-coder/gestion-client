<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6266">
<meta name="robots" content="noindex,nofollow">
<title>OIKOS Intervenante</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
/* Appli des intervenantes OIKOS : un écran à la fois, gros boutons, barre d'onglets en bas.
   Rien n'est gardé sur le téléphone à part la session et le code à 4 chiffres (chiffré). */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#E3E9E7; --ink:#17242A; --muted:#55646B; --line:#C8D1CE;
  --accent:#0E6266; --accent-ink:#FFFFFF; --accent-soft:#D3E6E5;
  --go:#2E8B3E; --stop:#B8432F; --warn:#9A6A00; --warn-soft:#F6EBCB;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111A1D; --surface:#18242A; --sunk:#0C1417; --ink:#E4ECEA; --muted:#9AABB0; --line:#2C3C42;
  --accent:#5BC0BE; --accent-ink:#0C1417; --accent-soft:#173A3C;
  --go:#4CC453; --stop:#E9775F; --warn:#E2B341; --warn-soft:#3A3115; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111A1D; --surface:#18242A; --sunk:#0C1417; --ink:#E4ECEA; --muted:#9AABB0; --line:#2C3C42;
  --accent:#5BC0BE; --accent-ink:#0C1417; --accent-soft:#173A3C;
  --go:#4CC453; --stop:#E9775F; --warn:#E2B341; --warn-soft:#3A3115; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.page{flex:1;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
.page.solo{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;justify-content:center;gap:18px}
h1{font-size:26px;line-height:1.2;margin:0}
h2{font-size:19px;margin:22px 0 10px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.logo{width:64px;height:64px;border-radius:18px;display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;cursor:pointer;text-decoration:none;color:var(--ink);text-align:center}
.btn.big{min-height:72px;font-size:21px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--go);border-color:var(--go);color:#fff}
.btn.stop{background:var(--stop);border-color:var(--stop);color:#fff}
.btn.flat{background:transparent;border-color:transparent;color:var(--accent);min-height:44px;font-size:16px}
.btn:disabled{opacity:.5}
.btn .ic{font-size:24px;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:15px;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--surface);color:var(--ink);font-size:17px;width:100%}
label.f textarea{min-height:90px;resize:vertical}
.chk{display:flex;align-items:center;gap:10px;font-size:17px;padding:6px 0}
.chk input{width:24px;height:24px}
.err{color:var(--stop);font-weight:700;min-height:1.2em}
.client-nom{font-weight:800;font-size:19px}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.encours{border:2px solid var(--go)}
.ligne{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ligne:first-child{border-top:0}
.ligne button{border:0;background:none;text-align:left;padding:0;cursor:pointer;flex:1}
.compteur{font-size:40px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--accent);margin:0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid3 .btn{font-size:15px;padding:10px 6px;flex-direction:column;gap:2px}
.lien{color:var(--accent);text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;cursor:pointer;text-align:left;font:inherit}
.lien.client-nom{font-weight:800;font-size:19px;text-decoration:none;color:var(--ink)}
a.lien.muted{color:var(--muted)}
/* agenda : même présentation que Pense intelligent */
.ag{display:flex;flex-direction:column;gap:10px}
.ag-head{display:flex;align-items:center;gap:6px}
.ag-title{font-weight:800;font-size:20px;flex:1;text-align:center;text-transform:capitalize}
.ag-nav{border:0;background:none;color:var(--accent);font-size:32px;line-height:1;padding:2px 14px;cursor:pointer}
.ag-auj{min-height:38px;padding:6px 12px;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .15)}
.ag-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ag-d{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0;cursor:pointer;min-width:0}
.ag-d span{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.ag-d b{font-size:17px;font-variant-numeric:tabular-nums}
.ag-d i{font-style:normal;color:var(--accent);font-size:11px;line-height:1;height:11px;letter-spacing:1px}
.ag-d.today b{color:var(--accent)}
.ag-d.sel{background:var(--ink);border-color:var(--ink)}
.ag-d.sel span,.ag-d.sel b,.ag-d.sel i{color:var(--bg)}
.ag-dayname{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ag-grid,.wk-body{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ag-hour{position:absolute;left:0;right:0;height:56px;border-top:1px solid var(--line);pointer-events:none}
.ag-hour:first-child{border-top:0}
.ag-hour span{position:absolute;left:8px;top:3px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ag-hour::after{content:"";position:absolute;left:44px;right:0;top:50%;border-top:1px dashed var(--line)}
.ag-ev,.wk-ev{position:absolute;border:0;border-left:4px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:3px 7px;text-align:left;display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
.ag-ev b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-ev span{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-fait{border-left-color:var(--go);background:color-mix(in srgb,var(--go) 20%,var(--surface))}
.ag-now,.wk-now{position:absolute;height:2px;background:var(--stop);pointer-events:none}
.ag-now{left:40px;right:0}
.ag-now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--stop)}
.wk{display:flex;flex-direction:column;gap:4px}
.wk-hd{display:grid;grid-template-columns:30px repeat(7,1fr);gap:2px}
.wk-day{border:0;background:none;display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:4px 0;border-radius:10px;min-width:0}
.wk-day span{font-size:11px;text-transform:uppercase;color:var(--muted)}
.wk-day b{font-size:16px}
.wk-day.today b{color:var(--accent)}
.wk-hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.wk-hr span{position:absolute;left:4px;top:2px;font-size:11px;color:var(--muted)}
.wk-ev{padding:2px 3px;border-left-width:3px;border-radius:5px}
.wk-ev b{font-size:11px}
.wk-ev span{font-size:10px;line-height:1.15;overflow:hidden}
.info dt{font-size:13px;color:var(--muted);margin-top:8px}
.info dd{margin:0;white-space:pre-wrap}
/* barre d'onglets */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.nav button .ic{font-size:24px;line-height:1.1}
.nav button[aria-current="page"]{color:var(--accent)}
/* clavier du code */
.dots{display:flex;gap:16px;justify-content:center;margin:6px 0}
.dots span{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent)}
.dots span.on{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:320px;margin:0 auto;width:100%}
.pad button{height:68px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:26px;font-weight:700;cursor:pointer}
.pad button.vide{visibility:hidden}
/* fenêtre du bas */
.voile{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.feuille{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 88px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;max-width:min(92vw,520px);z-index:30;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
/* ===================== Réglages ===================== */
/* Adresse et clé PUBLIQUE du projet (faites pour être dans l'appli : la base protège les données elle-même) */
const SB_URL = "https://nzxphozupnmqyikitwhv.supabase.co";
const SB_CLE = "sb_publishable_lBCpThUu95LiYhyYy2VZfA_0NZRFE1q";
const JOURS_MDP = 30;            // mot de passe complet redemandé tous les 30 jours
const ESSAIS_CODE = 5;           // erreurs de code à 4 chiffres avant de tout effacer
const VERROU_MIN = 5;            // l'appli se reverrouille après 5 min en arrière-plan
const ACTIVITES = ["Ménage", "Jardinage", "Bricolage"];
const RAYON_M = 300;             // « J'arrive / Je pars » vérifié à moins de 300 m de l'adresse du client

const sb = window.supabase.createClient(SB_URL, SB_CLE, {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: "oikos-int-session" }
});

/* ===================== Outils ===================== */
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem("oikos-int-" + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem("oikos-int-" + k, JSON.stringify(v)); } catch (e) {} }
};
let tt;
function toast(t) { const e = document.getElementById("toast"); e.textContent = t; e.hidden = false; clearTimeout(tt); tt = setTimeout(() => e.hidden = true, 3800); }
const pad2 = n => String(n).padStart(2, "0");
const heure = d => { d = new Date(d); return d.getHours() + " h " + pad2(d.getMinutes()); };
const jourTxt = d => new Date(d).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
/* Durées toujours en heures (comme dans la feuille d'heures) : 90 min → « 1,5 h » */
const heuresTxt = min => (Math.round(Math.max(0, min) / 60 * 100) / 100).toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " h";
const minutesEntre = (a, b) => (new Date(b) - new Date(a)) / 60000;
const debutJour = (d = new Date()) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const ajouterJours = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const versLocal = d => { d = new Date(d); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + "T" + pad2(d.getHours()) + ":" + pad2(d.getMinutes()); };
const reseau = e => !navigator.onLine || /fetch|network|réseau/i.test(String(e && (e.message || e)));
function souci(e) { toast(reseau(e) ? "Pas de réseau : réessaie dans un instant." : "Ça n'a pas marché : " + ((e && e.message) || e)); }
const estIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const lienSMS = (tel, texte) => "sms:" + String(tel || "").replace(/[^\d+]/g, "") + (estIOS ? "&" : "?") + "body=" + encodeURIComponent(texte);
const lienItineraire = adr => "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(adr || "");
const lienTel = tel => "tel:" + String(tel || "").replace(/[^\d+]/g, "");
const lienWaze = adr => "https://waze.com/ul?navigate=yes&q=" + encodeURIComponent(adr || "");
const lienWhatsApp = tel => { let n = String(tel || "").replace(/[^\d+]/g, ""); n = n.startsWith("+") ? n.slice(1) : n.startsWith("00") ? n.slice(2) : n.startsWith("0") ? "33" + n.slice(1) : n; return "https://wa.me/" + n; };

async function empreinte(texte) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(texte));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
/* Efface tout ce que l'appli garde sur le téléphone : il ne reste qu'une coquille vide */
function toutEffacer() {
  try { Object.keys(localStorage).filter(k => k.startsWith("oikos-int")).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  try { sessionStorage.clear(); } catch (e) {}
  moi = null; clients = []; ouvert = null;
}
async function sortir() { try { await sb.auth.signOut({ scope: "local" }); } catch (e) {} toutEffacer(); }

/* ===================== État ===================== */
let moi = null, clients = [], ouvert = null, onglet = "jour", moisVu = debutJour(new Date(new Date().setDate(1)));
let cache = {};   // créneaux, pointages du mois… rechargés à chaque affichage
const nomClient = id => (clients.find(c => c.id === id) || {}).nom || "Client";
const sousTraitante = () => moi && moi.statut === "sous-traitant";

/* ===================== Démarrage ===================== */
async function demarrer() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return ecranCode();
  if (!LS.get("pin")) return suite();
  if (Date.now() - (LS.get("mdp-le") || 0) > JOURS_MDP * 864e5) {
    await sortir();
    return ecranCode("Par sécurité, entre de nouveau ton mot de passe (tous les " + JOURS_MDP + " jours).");
  }
  ecranPin();
}
/* Après une connexion réussie : chaque étape manquante, dans l'ordre */
async function suite() {
  if (!(await chargerMoi())) return;
  if (moi.mdp_provisoire) return ecranNouveauMdp(true);
  if (!LS.get("pin")) return ecranChoisirPin();
  if (!moi.profil_complet) return ecranProfil(true);
  accueil();
}
/* Lit son profil. Accès coupé par OIKOS → la base ne renvoie rien → tout est effacé */
async function chargerMoi() {
  const { data: u, error: eu } = await sb.auth.getUser();
  if (eu || !u.user) {
    if (eu && reseau(eu)) { ecranHorsLigne(); return false; }
    await sortir();
    if (eu && /banned|bann/i.test(eu.message)) ecranFin(); else ecranCode("Connecte-toi de nouveau.");
    return false;
  }
  const { data, error } = await sb.from("profils").select("*").eq("id", u.user.id).maybeSingle();
  if (error) { if (reseau(error)) { ecranHorsLigne(); return false; } souci(error); return false; }
  if (!data || !data.actif) { await sortir(); ecranFin(); return false; }
  moi = data; return true;
}

/* ===================== Écrans d'accès ===================== */
function page(html, solo) { app.innerHTML = `<main class="page${solo ? " solo" : ""}">${html}</main>`; window.scrollTo(0, 0); }
const LOGO = `<img class="logo" src="icone-192.png" alt="">`;

function ecranCode(message) {
  page(`${LOGO}
    <h1>Code d'accès OIKOS</h1>
    <p class="muted">Cette application est réservée aux intervenantes d'OIKOS. Entre ton e-mail et le code d'accès donné par OIKOS (ou ton mot de passe si tu l'as déjà choisi).</p>
    ${message ? `<p class="tag warn" style="padding:8px 12px;border-radius:12px">${esc(message)}</p>` : ""}
    <form class="stack" id="f">
      <label class="f">Ton e-mail<input id="email" type="email" autocomplete="username" required inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
      <label class="f">Code d'accès ou mot de passe<input id="code" type="password" autocomplete="current-password" required autocapitalize="none" autocorrect="off" spellcheck="false"></label>
      <label class="chk small"><input type="checkbox" id="voir">Afficher le code</label>
      <p class="err" id="err"></p>
      <button class="btn primary big" type="submit">Entrer</button>
    </form>
    <button class="btn flat" id="oubli" type="button">J'ai oublié mon mot de passe</button>`, true);
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const err = document.getElementById("err"), b = e.submitter; err.textContent = ""; b.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: document.getElementById("email").value.trim().toLowerCase(), password: document.getElementById("code").value.trim() });
    b.disabled = false;
    if (error) { err.textContent = reseau(error) ? "Pas de réseau : réessaie." : /banned/i.test(error.message) ? "Ton accès OIKOS est coupé." : /confirm/i.test(error.message) ? "Compte pas encore activé : contacte OIKOS." : "E-mail ou code incorrect. Vérifie qu'il n'y a pas d'espace ni de majuscule."; return; }
    LS.set("mdp-le", Date.now()); LS.set("erreurs", 0);
    suite();
  };
  document.getElementById("voir").onchange = e => document.getElementById("code").type = e.target.checked ? "text" : "password";
  document.getElementById("oubli").onclick = () => feuille(`<h2 style="margin:0">Mot de passe oublié</h2>
    <p>Appelle OIKOS : on te donnera un nouveau code d'accès. Tu choisiras ensuite un nouveau mot de passe.</p>
    <button class="btn" data-fermer>J'ai compris</button>`);
}

function ecranNouveauMdp(obligatoire) {
  page(`${LOGO}
    <h1>${obligatoire ? "Choisis ton mot de passe" : "Changer mon mot de passe"}</h1>
    <p class="muted">${obligatoire ? "Le code d'accès ne sert qu'une fois. " : ""}Au moins 8 caractères. Garde-le pour toi : il te sera redemandé tous les ${JOURS_MDP} jours.</p>
    <form class="stack" id="f">
      <label class="f">Nouveau mot de passe<input id="m1" type="password" autocomplete="new-password" minlength="8" required></label>
      <label class="f">Encore une fois<input id="m2" type="password" autocomplete="new-password" minlength="8" required></label>
      <p class="err" id="err"></p>
      <button class="btn primary big" type="submit">Valider</button>
      ${obligatoire ? "" : `<button class="btn flat" type="button" id="annuler">Annuler</button>`}
    </form>`, true);
  if (!obligatoire) document.getElementById("annuler").onclick = () => accueil("moi");
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const m1 = document.getElementById("m1").value, m2 = document.getElementById("m2").value, err = document.getElementById("err");
    if (m1 !== m2) { err.textContent = "Les deux mots de passe ne sont pas pareils."; return; }
    e.submitter.disabled = true;
    const { error } = await sb.auth.updateUser({ password: m1 });
    if (error) { e.submitter.disabled = false; err.textContent = reseau(error) ? "Pas de réseau : réessaie." : /different|same/i.test(error.message) ? "Choisis un mot de passe différent du code d'accès." : /weak|short|least/i.test(error.message) ? "Mot de passe trop simple : allonge-le." : error.message; return; }
    await sb.from("profils").update({ mdp_provisoire: false }).eq("id", moi.id);
    LS.set("mdp-le", Date.now());
    toast("Mot de passe enregistré");
    if (obligatoire) suite(); else accueil("moi");
  };
}

/* Clavier du code à 4 chiffres */
function clavier(titre, texte, quandFini, extra = "") {
  let saisi = "";
  page(`${LOGO}<h1>${titre}</h1><p class="muted">${texte}</p>

/* ---------- Présence vérifiée par le GPS ---------- */
/* La position n'est lue qu'au moment où elle touche « J'arrive » ou « Je pars » */
function maPosition() {
  if (!navigator.geolocation) return Promise.resolve({ etat: "sans", raison: "indisponible" });
  return new Promise(res => navigator.geolocation.getCurrentPosition(
    p => res({ lat: p.coords.latitude, lng: p.coords.longitude, precision: Math.round(p.coords.accuracy) }),
    e => res({ etat: "sans", raison: e.code === 1 ? "refus" : "introuvable" }),
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 30000 }));
}
const coordsVues = {};
/* Position de l'adresse du client : celle de la base, sinon la Base Adresse Nationale */
async function coordsClient(c) {
  if (c.lat != null && c.lng != null) return { lat: c.lat, lng: c.lng };
  if (!c.adresse) return null;
  if (coordsVues[c.id]) return coordsVues[c.id];
  for (const url of ["https://data.geopf.fr/geocodage/search?limit=1&q=", "https://api-adresse.data.gouv.fr/search/?limit=1&q="]) {
    try {
      const r = await fetch(url + encodeURIComponent(c.adresse)); if (!r.ok) continue;
      const f = ((await r.json()).features || [])[0];
      if (f) return coordsVues[c.id] = { lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0] };
    } catch (e) {}
  }
  return null;
}
function metres(a, b) {
  const R = 6371000, rad = x => x * Math.PI / 180, dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const distTxt = d => d < 1000 ? d + " m" : (d / 1000).toFixed(1).replace(".", ",") + " km";
async function controleGPS(c) {
  const [pos, cible] = await Promise.all([maPosition(), coordsClient(c)]);
  if (pos.etat) return pos;
  if (!cible) return { ...pos, etat: "adresse" };
  const d = Math.round(metres(pos, cible));
  return { ...pos, distance: d, etat: d <= RAYON_M ? "ok" : d - pos.precision <= RAYON_M ? "imprecis" : "loin" };
}
/* Renvoie la position à enregistrer, ou null si elle annule */
async function verifierPresence(c, moment) {
  for (;;) {
    const fermer = feuille(`<h2 style="margin:0">📍 Vérification de ta position…</h2><p class="muted">Quelques secondes. Si le téléphone le demande, touche « Autoriser ».</p>`);
    const g = await controleGPS(c);
    fermer();
    if (g.etat === "ok") return g;
    const texte = {
      loin: `Tu sembles être à <b>${distTxt(g.distance)}</b> de chez ${esc(c.nom)} (il faut être à moins de ${RAYON_M} m).`,
      imprecis: `Le GPS est imprécis (à ± ${distTxt(g.precision)}) : ta présence chez ${esc(c.nom)} n'est pas sûre. Va près d'une fenêtre ou dehors, puis réessaie.`,
      adresse: `L'adresse de ${esc(c.nom)} n'a pas été trouvée sur la carte : ta présence ne peut pas être vérifiée.`,
      sans: g.raison === "refus" ? `La position n'est pas autorisée. Pour l'activer : réglages du téléphone › Applications › Chrome › Autorisations › Position › Autoriser.` : `Le téléphone ne trouve pas ta position. Vérifie que la localisation est allumée.`
    }[g.etat];
    const r = await new Promise(res => feuille(`<h2 style="margin:0">Présence non vérifiée</h2><p>${texte}</p>
      <button class="btn primary big" data-r="re"><span class="ic">🔄</span>Réessayer</button>
      <button class="btn" data-r="ok">Noter mon ${moment} quand même</button>
      <p class="muted small">OIKOS sera prévenu que ta position n'a pas pu être vérifiée.</p>
      <button class="btn flat" data-fermer>Annuler</button>`, (el, f) => { el.onclick = e => { const b = e.target.closest("[data-r]"); if (b) { res(b.dataset.r); f(); } }; }, () => res(null)));
    if (r === "ok") return g;
    if (r !== "re") return null;
  }
}
const gpsBadge = g => !g ? "" : g.etat === "ok" ? `<span class="tag">📍 vérifié</span>` : `<span class="tag warn">📍 ${g.etat === "loin" && g.distance ? "à " + distTxt(g.distance) : "non vérifié"}</span>`;
const gpsTxt = g => !g ? "pas de position (ancien pointage ou heure tapée à la main)" : g.etat === "ok" ? `vérifiée, à ${distTxt(g.distance)} du client`
  : g.etat === "loin" ? `à ${distTxt(g.distance)} du client` : g.etat === "imprecis" ? `imprécise (± ${distTxt(g.precision)})` : g.etat === "adresse" ? "adresse du client introuvable" : "position refusée ou introuvable";

async function arriver(clientId) {
  if (ouvert) return toast("Termine d'abord chez " + nomClient(ouvert.client_id));
  const c = clients.find(k => k.id === clientId); if (!c) return;
  const g = await verifierPresence(c, "arrivée"); if (!g) return;
  const { error } = await sb.from("pointages").insert({ client_id: clientId, gps_arrivee: g });
  if (error) return souci(error);
  toast((g.etat === "ok" ? "✓ Présence vérifiée. " : "") + "Arrivée notée à " + heure(new Date()) + " chez " + c.nom);
  accueil("jour");
}
const oubli = p => p && (debutJour(new Date(p.arrivee)) < debutJour() || minutesEntre(p.arrivee, new Date()) > 12 * 60);
async function partir() {
  if (!ouvert) return;
  if (oubli(ouvert)) { cache.mois = [ouvert]; return corrigerPointage(ouvert.id, "jour"); }   // « Je pars » oublié : elle indique l'heure réelle
  const p = ouvert, c = clients.find(k => k.id === p.client_id) || { id: p.client_id, nom: nomClient(p.client_id) };
  const g = await verifierPresence(c, "départ"); if (!g) return;
  const fin = new Date();
  const { error } = await sb.from("pointages").update({ depart: fin.toISOString(), gps_depart: g }).eq("id", p.id);
  if (error) return souci(error);
  accueil("jour");
  const fermer = feuille(`<h2 style="margin:0">Passage terminé ✓</h2>
    <p>${esc(c.nom)} : <b>${heuresTxt(minutesEntre(p.arrivee, fin))}</b>${g.etat === "ok" ? " · départ vérifié 📍" : ""}</p>
    <form class="stack" id="fn"><label class="f">Une remarque pour OIKOS sur ce passage ? (facultatif)<textarea name="t" placeholder="Ex. il manque du produit vitres, le client part en vacances…"></textarea></label>
    <button class="btn primary big" type="submit">Envoyer à OIKOS</button><button class="btn flat" type="button" data-fermer>Non merci</button></form>`, el => {
    el.querySelector("#fn").onsubmit = async e => { e.preventDefault(); if (await ajouterNote(c.id, p.id, new FormData(e.target).get("t"))) fermer(); };
  });
}

/* ---------- Agenda (même présentation que Pense intelligent) ---------- */
let agJour = debutJour(), agVue = LS.get("agvue") || "jour", agVu = false;
const AG_PX = 56, JOURS_C = ["dim", "lun", "mar", "mer", "jeu", "ven", "sam"];
const debutSemaine = d => ajouterJours(debutJour(d), -((new Date(d).getDay() + 6) % 7));
async function vueAgenda() {
  const s0 = debutSemaine(agJour), s1 = ajouterJours(s0, 7), auj = debutJour();

    ${moi.statut === "salarie" ? `<p class="muted small">Ton planning est préparé par OIKOS.</p>` : ""}
    <p class="muted small">${moi.agenda_id ? `📅 Ton planning est aussi copié tout seul dans ton agenda Google « OIKOS – ${esc(moi.prenom || "")} ».` : "📅 Bientôt, ton planning sera aussi copié tout seul dans ton agenda Google."}</p></div>`);
  const el = document.getElementById("contenu");

    if (v) { agVue = v.dataset.agvue; LS.set("agvue", agVue); return accueil("agenda"); }
    if (ev) return detailAgenda(ev.dataset.agref, cr.data);
    const g = e.target.closest(".ag-grid,.wk-body");
    if (g && sousTraitante() && clients.length) {   // créneau libre touché : on y ajoute un passage

      let jour = agJour;
      if (g.classList.contains("wk-body")) { const x = e.clientX - r.left - 30; if (x < 0) return; jour = ajouterJours(s0, Math.min(6, Math.floor(x / ((r.width - 30) / 7)))); }
      const min = h0 * 60 + Math.floor((e.clientY - r.top) / px * 2) * 30;
      ajouterPassage({ jour, h: pad2(Math.floor(min / 60)) + ":" + pad2(min % 60) });

const agTete = (titre, s0, auj) => `<div class="ag-head"><button class="ag-nav" data-agnav="-7" aria-label="Semaine précédente">‹</button>
  <div class="ag-title">${esc(titre)}</div><button class="ag-nav" data-agnav="7" aria-label="Semaine suivante">›</button>
  ${(agVue === "jour" ? agJour.getTime() !== auj.getTime() : s0.getTime() !== debutSemaine(auj).getTime()) ? `<button class="btn ag-auj" data-agauj="1">Aujourd'hui</button>` : ""}</div>
  <div class="seg" role="group" aria-label="Affichage"><button data-agvue="jour" aria-pressed="${agVue === "jour"}">Jour</button><button data-agvue="semaine" aria-pressed="${agVue === "semaine"}">Semaine</button></div>`;
function couloirs(liste) {   // passages qui se chevauchent : côte à côte
  let lanes = [], grp = [], fin = -Infinity;
  const clore = () => { grp.forEach(x => x.nl = Math.max(1, lanes.length)); lanes = []; grp = []; };
  liste.forEach(it => { if (it.t >= fin) clore(); let k = lanes.findIndex(e => e <= it.t); if (k < 0) { k = lanes.length; lanes.push(0); } lanes[k] = it.end; it.lane = k; grp.push(it); fin = Math.max(fin, it.end); });
  clore();
}
function plage(liste) { let h0 = 7, h1 = 21; liste.forEach(it => { h0 = Math.min(h0, new Date(it.t).getHours()); h1 = Math.max(h1, Math.min(24, new Date(it.end - 1).getHours() + 1)); }); return [h0, h1]; }
function agJourHtml(s0, items, auj) {
  const d = agJour, d1 = ajouterJours(d, 1);
  let h = agTete(d.toLocaleDateString("fr-FR", { month: "long", year: "numeric" }), s0, auj);
  h += `<div class="ag-week">` + [0, 1, 2, 3, 4, 5, 6].map(i => { const t = ajouterJours(s0, i), n = items.filter(it => it.t >= t && it.t < ajouterJours(t, 1)).length;
    return `<button class="ag-d${t.getTime() === d.getTime() ? " sel" : ""}${t.getTime() === auj.getTime() ? " today" : ""}" data-agjour="${t.getTime()}"><span>${JOURS_C[t.getDay()]}</span><b>${t.getDate()}</b><i>${n ? "•".repeat(Math.min(n, 3)) : "&nbsp;"}</i></button>`; }).join("") + `</div>`;
  h += `<div class="ag-dayname">${esc(jourTxt(d))}${d.getTime() === auj.getTime() ? " · aujourd'hui" : ""}</div>`;
  const jour = items.filter(it => it.t >= d && it.t < d1).sort((a, b) => a.t - b.t);
  const [h0, h1] = plage(jour); couloirs(jour);
  const y = t => ((t - d) / 36e5 - h0) * AG_PX;
  let g = `<div class="ag-grid" data-h0="${h0}" data-px="${AG_PX}" style="height:${(h1 - h0) * AG_PX}px">`;
  for (let hr = h0; hr < h1; hr++) g += `<div class="ag-hour" style="top:${(hr - h0) * AG_PX}px"><span>${hr}h</span></div>`;
  jour.forEach(it => { const top = Math.max(0, y(it.t)), ht = Math.max(26, Math.min((h1 - h0) * AG_PX, y(it.end)) - top - 2);
    g += `<button class="ag-ev k-${it.k}" data-agref="${it.ref}" style="top:${top}px;height:${ht}px;left:calc(44px + (100% - 48px) * ${it.lane} / ${it.nl});width:calc((100% - 48px) / ${it.nl} - 3px)">
      <b>${heure(it.t).replace(" h ", "h")} ${esc(it.titre)}</b>${ht > 40 ? `<span>${it.k === "fait" ? "✓ pointé" : "prévu"} · ${heuresTxt((it.end - it.t) / 6e4)}</span>` : ""}</button>`; });
  if (d.getTime() === auj.getTime()) { const n = y(Date.now()); if (n >= 0 && n <= (h1 - h0) * AG_PX) g += `<div class="ag-now" style="top:${n}px"></div>`; }
  return h + g + `</div><p class="muted small">${sousTraitante() ? "Touche un créneau libre pour y ajouter un passage, ou un passage pour le détail." : "Touche un passage pour le détail."}</p>`;

function agSemaine(s0, items, auj) {
  const PX = 30, s6 = ajouterJours(s0, 6);
  const titre = s0.getMonth() === s6.getMonth() ? `${s0.getDate()} – ${s6.getDate()} ${s6.toLocaleDateString("fr-FR", { month: "long" })}`
    : `${s0.getDate()} ${s0.toLocaleDateString("fr-FR", { month: "short" })} – ${s6.getDate()} ${s6.toLocaleDateString("fr-FR", { month: "short" })}`;
  const jours = [0, 1, 2, 3, 4, 5, 6].map(i => ajouterJours(s0, i)), [h0, h1] = plage(items);
  let h = agTete(titre, s0, auj) + `<div class="wk"><div class="wk-hd"><span></span>` + jours.map(t => `<button class="wk-day${t.getTime() === auj.getTime() ? " today" : ""}" data-agjour="${t.getTime()}"><span>${JOURS_C[t.getDay()]}</span><b>${t.getDate()}</b></button>`).join("") + `</div>`;
  let g = `<div class="wk-body" data-h0="${h0}" data-px="${PX}" style="height:${(h1 - h0) * PX}px">`;
  for (let hr = h0; hr < h1; hr++) g += `<div class="wk-hr" style="top:${(hr - h0) * PX}px;height:${PX}px"><span>${hr}</span></div>`;
  jours.forEach((t, i) => {

    col.forEach(it => { const top = Math.max(0, ((it.t - t) / 36e5 - h0) * PX), ht = Math.max(16, ((it.end - t) / 36e5 - h0) * PX - top - 1);
      g += `<button class="wk-ev k-${it.k}" data-agref="${it.ref}" title="${esc(it.titre)}" style="top:${top}px;height:${ht}px;left:calc(30px + (100% - 30px) * ${i}/7 + (100% - 30px) / 7 * ${it.lane}/${it.nl} + 1px);width:calc((100% - 30px) / 7 / ${it.nl} - 2px)"><b>${new Date(it.t).getHours()}h${new Date(it.t).getMinutes() ? pad2(new Date(it.t).getMinutes()) : ""}</b>${ht > 26 ? `<span>${esc(it.titre)}</span>` : ""}</button>`; });
    if (t.getTime() === auj.getTime()) { const n = ((Date.now() - t) / 36e5 - h0) * PX; if (n >= 0 && n <= (h1 - h0) * PX) g += `<div class="wk-now" style="top:${n}px;left:calc(30px + (100% - 30px) * ${i}/7);width:calc((100% - 30px) / 7)"></div>`; }

}

    ${finis.length && !tousValides ? `<button class="btn primary big" id="valider" style="margin-top:14px" ${sansDepart.length ? "disabled" : ""}><span class="ic">👍</span>Mes heures du mois sont justes</button>` : ""}
    <p class="muted small" style="margin-top:8px">Chaque passage terminé part tout seul dans ton rapport d'activité (ta feuille d'heures OIKOS). OIKOS fait ta facture à partir de ces heures.</p>`);
  document.getElementById("prec").onclick = () => { moisVu = new Date(m0.getFullYear(), m0.getMonth() - 1, 1); accueil("mois"); };
  document.getElementById("suiv").onclick = () => { moisVu = m1; accueil("mois"); };
  document.getElementById("contenu").onclick = e => { const b = e.target.closest("[data-pt]"); if (b) feuillePassage(b.dataset.pt); };
  const v = document.getElementById("valider");
  if (v) v.onclick = async () => {
    const { error } = await sb.from("pointages").update({ valide_par_intervenante: true }).eq("intervenante_id", moi.id)
      .gte("arrivee", m0.toISOString()).lt("arrivee", m1.toISOString()).not("depart", "is", null).eq("verrouille", false);
    if (error) return souci(error);
    toast("Merci, tes heures sont validées"); accueil("mois");
  };
}
function feuillePassage(id) {
  const p = (cache.mois || []).find(x => x.id === id); if (!p) return;
  if (!p.depart && (!ouvert || ouvert.id !== p.id)) return corrigerPointage(id);
  feuille(`<h2 style="margin:0">${esc(nomClient(p.client_id))}</h2><p class="muted">${jourTxt(p.arrivee)}</p>
    <dl class="info card"><dt>Horaires</dt><dd>${heure(p.arrivee)} → ${p.depart ? heure(p.depart) + " · <b>" + heuresTxt(minutesEntre(p.arrivee, p.depart)) + "</b>" : "en cours"}</dd>
      <dt>Position à l'arrivée</dt><dd>${gpsTxt(p.gps_arrivee)}</dd>${p.depart ? `<dt>Position au départ</dt><dd>${gpsTxt(p.gps_depart)}</dd>` : ""}
      <dt>Rapport d'activité</dt><dd>${p.exporte_le ? "✓ écrit dans ta feuille d'heures" : "en attente (quelques minutes)"}</dd></dl>
    ${p.verrouille ? `<p class="muted small">Ce passage est facturé : il ne se modifie plus. Une erreur ? Appelle OIKOS.</p>` : p.depart ? `<button class="btn" id="corr"><span class="ic">✏️</span>Corriger les heures</button>` : ""}
    ${blocNotes("Notes sur ce passage", "Une remarque pour OIKOS sur ce passage")}
    <button class="btn flat" data-fermer>Fermer</button>`, (el, fermer) => {
    if (el.querySelector("#corr")) el.querySelector("#corr").onclick = () => { fermer(); corrigerPointage(id); };
    brancherNotes(el, p.client_id, p.id);
  });
}
function corrigerPointage(id, retour) {
  const p = (cache.mois || []).find(x => x.id === id); if (!p) return;
  const jour = versLocal(p.arrivee).slice(0, 10);
  feuille(`<h2 style="margin:0">${esc(nomClient(p.client_id))}</h2><p class="muted">${jourTxt(p.arrivee)}</p>
    <form class="stack" id="fc"><div class="grid2"><label class="f">Arrivée<input name="a" type="time" value="${versLocal(p.arrivee).slice(11)}" required></label>
    <label class="f">Départ<input name="d" type="time" value="${p.depart ? versLocal(p.depart).slice(11) : ""}" required></label></div>
    <p class="muted small">Une heure tapée à la main n'est pas vérifiée par le GPS : OIKOS en est prévenu.</p>
    <p class="err" id="err"></p>
    <button class="btn primary big" type="submit">Enregistrer</button><button class="btn flat" type="button" data-fermer>Annuler</button></form>`, (el, fermer) => {
    el.querySelector("#fc").onsubmit = async e => {
      e.preventDefault(); const f = new FormData(e.target);
      const a = new Date(jour + "T" + f.get("a")), d = new Date(jour + "T" + f.get("d"));
      if (d <= a) { el.querySelector("#err").textContent = "Le départ doit être après l'arrivée."; return; }
      const { error } = await sb.from("pointages").update({ arrivee: a.toISOString(), depart: d.toISOString(), valide_par_intervenante: false }).eq("id", id);
      if (error) return souci(error);
      fermer(); toast("Enregistré : " + heuresTxt(minutesEntre(a, d))); accueil(retour || onglet);
    };
  });
}

/* ---------- Moi ---------- */
async function vueMoi() {
  const statut = { "sous-traitant": "Sous-traitante (auto-entrepreneuse)", salarie: "Salariée" }[moi.statut] || "Statut à préciser par OIKOS";
  contenu(`<h1>${esc((moi.prenom || "") + " " + (moi.nom || ""))}</h1><p class="muted" style="margin-bottom:14px">${statut}</p>
    <dl class="info card"><dt>E-mail</dt><dd>${esc(moi.email || "")}</dd><dt>Téléphone</dt><dd>${esc(moi.telephone || "—")}</dd>
      <dt>Adresse</dt><dd>${esc(moi.adresse || "—")}</dd><dt>Activités</dt><dd>${esc((moi.activites || []).join(", ") || "—")}</dd>
      <dt>Zones</dt><dd>${esc((moi.zones || []).map(z => "Zone " + z).join(", ") || "—")}</dd></dl>
    <div class="stack" style="margin-top:14px">
      <button class="btn" id="infos"><span class="ic">✏️</span>Modifier mes informations</button>
      <button class="btn" id="pin"><span class="ic">🔢</span>Changer mon code à 4 chiffres</button>
      <button class="btn" id="mdp"><span class="ic">🔑</span>Changer mon mot de passe</button>
      <button class="btn" id="sortir"><span class="ic">🚪</span>Me déconnecter de ce téléphone</button>
    </div>
    <p class="muted small" style="margin-top:18px">Mes papiers et mes factures arriveront ici prochainement.</p>`);
  document.getElementById("infos").onclick = () => ecranProfil(false);
  document.getElementById("pin").onclick = () => ecranChoisirPin(true);
  document.getElementById("mdp").onclick = () => ecranNouveauMdp(false);
  document.getElementById("sortir").onclick = () => feuille(`<h2 style="margin:0">Te déconnecter ?</h2><p>Il faudra ton e-mail et ton mot de passe pour revenir.</p>
    <button class="btn stop big" id="ok">Me déconnecter</button><button class="btn flat" data-fermer>Annuler</button>`, (el, fermer) => {
    el.querySelector("#ok").onclick = async () => { fermer(); await sortir(); ecranCode(); };
  });
}

/* ===================== Verrou quand l'appli revient au premier plan ===================== */
let cachee = 0, verrouille = false;
document.addEventListener("visibilitychange", async () => {
  if (document.hidden) { cachee = Date.now(); return; }
  if (!cachee || Date.now() - cachee < VERROU_MIN * 60000 || verrouille) return;
  const { data: { session } } = await sb.auth.getSession();
  if (session && LS.get("pin")) { verrouille = true; document.querySelectorAll(".voile").forEach(v => v.remove()); demarrer(); }
});

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
demarrer();
</script>
