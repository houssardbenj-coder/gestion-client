<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#7A8568">
<title>OIKOS Pilotage</title>
<link rel="icon" href="logo-oikos.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600;700;800&display=swap">
<style>
/* Tableau de bord du gérant : un onglet par sujet en haut, des listes et des fiches qui s'ouvrent sur place.
   Même base que l'appli des intervenantes ; seul le compte gérant peut entrer (la base le vérifie aussi). */
:root{
  --bg:#F7F5EE; --surface:#FFFFFF; --sunk:#EDEAE0; --ink:#23241F; --muted:#5A5B52; --line:#DAD7CA;
  --accent:#525A44; --accent-ink:#FFFFFF; --accent-soft:#E7E8DA;
  --go:#3E7D3A; --stop:#A8432B; --warn:#8A5A0E; --warn-soft:#F4E9CC;
  --titre:Fraunces,"Cormorant Garamond",Georgia,serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1D18; --surface:#26281F; --sunk:#15160F; --ink:#F0EEE5; --muted:#B4B5A6; --line:#3E4034;
  --accent:#B7C29E; --accent-ink:#1C1D18; --accent-soft:#363B2B;
  --go:#7CC26F; --stop:#E9775F; --warn:#E0B458; --warn-soft:#3A3115; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1C1D18; --surface:#26281F; --sunk:#15160F; --ink:#F0EEE5; --muted:#B4B5A6; --line:#3E4034;
  --accent:#B7C29E; --accent-ink:#1C1D18; --accent-soft:#363B2B;
  --go:#7CC26F; --stop:#E9775F; --warn:#E0B458; --warn-soft:#3A3115; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-family:var(--titre);font-weight:600;font-size:26px;letter-spacing:-.01em;margin:0} h2{font-family:var(--titre);font-weight:600;font-size:19px;margin:20px 0 8px} h3{font-size:15px;margin:14px 0 6px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.wrap{max-width:1150px;margin:0 auto;padding:16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:10px}
.marque{font-family:var(--titre);font-weight:500;font-size:20px;display:flex;gap:10px;align-items:center}
.marque b{font-weight:600}
.marque img{width:42px;height:42px;padding:2px;background:#F7F5EE;border:1px solid var(--line);border-radius:12px}
.connexion .btn.primary{justify-content:center}
.connexion .marque{flex-direction:column;text-align:center;font-size:24px}
.connexion .marque img{width:128px;height:128px;padding:8px;border-radius:24px}
nav.onglets{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav.onglets button{border:0;background:none;padding:8px 12px;border-radius:999px;font-weight:700;color:var(--muted);cursor:pointer}
nav.onglets button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.bulle{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--stop);color:#fff;font-size:12px;margin-left:4px;text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.deux{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:760px){.deux{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);border-radius:999px}
.btn.go{background:var(--go);border-color:var(--go);color:#fff}
.btn.stop{color:var(--stop)}
.btn.flat{border-color:transparent;background:none;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.45;cursor:default}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.off{background:var(--sunk);color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],select,textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);width:100%}
textarea{min-height:80px;resize:vertical}
.chk{display:flex;gap:8px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0}
.ligne{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ligne:first-child{border-top:0}
.cliquable{cursor:pointer} .cliquable:hover{border-color:var(--accent)}
.err{color:var(--stop);font-weight:700}
.diff del{color:var(--stop)} .diff ins{color:var(--go);text-decoration:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:30;max-width:92vw}
/* La feuille de route : à lire d'un coup d'œil, la couleur dit ce qui passe d'abord */
.fdr{display:flex;flex-direction:column;gap:14px;min-width:0;text-align:left}
.fdr-tete{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px 16px}
.fdr-tete b{display:block;font-family:var(--titre);font-size:21px;font-weight:600;line-height:1.2}
.fdr-tete a,.fdr-tete span{color:inherit;font-size:14px}
.fdr-chiffres{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fdr-chiffre{background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.fdr-chiffre b{display:block;font-size:21px;line-height:1.2}
.fdr-chiffre span{font-size:12px;color:var(--muted)}
.fdr-chiffre.paie{background:#DFF0DC}
.fdr-chiffre.paie b{color:#2C6B29}
.fdr-delai{background:#FBE3DE;color:#8E2F1C;border-radius:12px;padding:10px 12px;font-size:15px;font-weight:700}
.fdr-mot{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.fdr-photos{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.fdr-photos img{height:110px;width:146px;object-fit:cover;border-radius:10px;background:var(--sunk);display:block}
.fdr h4{margin:0 0 6px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.fdr-puces{display:flex;flex-wrap:wrap;gap:6px}
.fdr-puces span{padding:5px 10px;border-radius:999px;font-size:14px;background:var(--sunk)}
.fdr-puces.ramener span{background:var(--warn-soft);font-weight:700}
.fdr-groupe{display:flex;flex-direction:column;gap:6px}
.fdr-titre{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.fdr-titre i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.fdr-tache{border-left:5px solid var(--c);background:var(--surface);border-radius:8px;padding:8px 10px;box-shadow:0 0 0 1px var(--line)}
.fdr-tache>div{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.fdr-tache b{font-size:15px}
.fdr-tache em{font-style:normal;font-size:13px;color:var(--muted);white-space:nowrap}
.fdr-tache p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.fdr-tache details{font-size:13px;margin-top:2px}
.fdr-tache summary{cursor:pointer;color:var(--accent);font-weight:700}
.fdr-note{font-size:12px;color:var(--muted);margin:0}
.voile{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.fenetre{background:var(--bg);border-radius:16px;padding:18px;width:100%;max-width:820px;display:flex;flex-direction:column;gap:12px}
.connexion{max-width:380px;margin:12vh auto;display:flex;flex-direction:column;gap:12px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}
.photo{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.vignette{display:block;width:100%;border:0;padding:0;cursor:zoom-in;background:var(--sunk)}
.vignette img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.photo figcaption{padding:8px 10px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pk{display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.pk-tete{display:flex;gap:6px;align-items:center}
.pk-tete .chips{flex:1;justify-content:center}
.pk-autre{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--sunk);border-radius:10px}
.pk-autre .pk-tete b{flex:1;text-align:center}
.pk-jours{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pk-j{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:5px 0;cursor:pointer}
.pk-j span{font-size:11px;text-transform:uppercase;color:var(--muted)}
.pk-j b{font-size:16px}
.pk-j i{font-style:normal;font-size:11px;line-height:1;height:11px;color:var(--accent)}
.pk-j.auj b{color:var(--accent)}
.pk-j.passe{opacity:.5}
.pk-j.sel{background:var(--accent);border-color:var(--accent);opacity:1}
.pk-j.sel span,.pk-j.sel b,.pk-j.sel i{color:var(--accent-ink)}
.pk-grille{position:relative;background:var(--sunk);border-radius:10px;overflow:hidden;cursor:copy}
.pk-h{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.pk-h:first-child{border-top:0}
.pk-h span{position:absolute;left:8px;top:2px;font-size:11px;color:var(--muted)}
.pk-h::after{content:"";position:absolute;left:44px;right:0;top:50%;border-top:1px dashed var(--line)}
.pk-rdv,.pk-new{position:absolute;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;pointer-events:none}
.pk-rdv{background:var(--accent-soft);border-left:3px solid var(--accent)}
.pk-new{left:44px;right:4px;background:var(--accent);color:var(--accent-ink);border:2px solid var(--ink)}
.pk-new.conflit{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.pk-maint{position:absolute;left:40px;right:0;height:2px;background:var(--stop);pointer-events:none}
.pk-alerte{color:var(--warn);font-weight:700;font-size:13px}
#pk-txt{border-style:dashed}
.cl-liste{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.cl-liste .btn{text-align:left;font-weight:400;display:block;width:100%}
.tk-grp>summary::-webkit-details-marker{display:none}
.tk-grp>summary span{background:var(--bg);border-radius:999px;padding:0 8px;font-size:12px}
.tk-grp>summary::after{content:"▾";margin-left:auto;transition:transform .2s}
.tk-grp:not([open])>summary::after{transform:rotate(-90deg)}
.tk-late>summary{color:var(--warn)}
.doc-nom{flex:1;min-width:0;display:flex;flex-direction:column;text-align:left;background:none;border:0;padding:0;cursor:pointer;font-weight:700;overflow-wrap:anywhere}
.doc-nom span{font-weight:400}
.docs{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.doc-ap{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.dos-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.dos-carte{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:inherit;font:inherit}
.dos-carte[hidden]{display:none}
.dos-carte:hover{border-color:var(--muted)}
.dos-tache{padding:10px 0;border-top:1px solid var(--line)}
.tkc{padding:0;overflow:hidden}
.tk-grp{border-top:1px solid var(--line)}
.tk-grp>summary{cursor:pointer;padding:9px 16px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);list-style:none;display:flex;gap:8px;align-items:center}
ul.tasks{list-style:none;margin:0;padding:0}
ul.tasks li{display:flex;align-items:center;gap:12px;padding:9px 16px;border-top:1px solid var(--line)}
ul.tasks li input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--go)}
.tk-open{flex:1;min-width:0;display:flex;flex-direction:column;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.tk-open:hover .txt{color:var(--accent)}
li.is-done .tk-open .txt{text-decoration:line-through;color:var(--muted)}
.t-note{font-size:13px;color:var(--muted)}
.due{flex:none;font-weight:700;font-size:12px;color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 8px;white-space:nowrap}
.due.late{color:#fff;background:var(--stop)}
.doc{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--bg);border-radius:10px;padding:6px 10px}
.depot{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:12px}
.depot.survol{border-color:var(--accent);background:var(--accent-soft)}
.rp-ligne{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.rp-ligne.incomplete{border-color:var(--warn)}
.rp-champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.rp-ligne input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);width:100%}
.i{position:relative;display:inline-grid;place-items:center;width:17px;height:17px;padding:0;margin-left:3px;vertical-align:1px;border:1px solid var(--muted);border-radius:50%;background:none;color:var(--muted);font:italic 700 11px/1 Georgia,serif;text-transform:none;letter-spacing:0;cursor:pointer}
.i::after{content:"";position:absolute;inset:-9px}
.i:hover,.i[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.aide-bulle{position:fixed;z-index:40;max-width:min(360px,calc(100vw - 16px));background:var(--ink);color:var(--bg);font-size:13px;line-height:1.45;font-weight:400;padding:10px 12px;border-radius:10px;white-space:pre-line;box-shadow:0 6px 20px rgb(0 0 0 / .3)}
.dm{padding:0;margin-bottom:6px}
.dm>summary{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 12px;cursor:pointer;list-style:none}
.dm>summary::-webkit-details-marker{display:none}
.dm>summary::after{content:"▾";color:var(--muted);transition:transform .2s}
.dm:not([open])>summary::after{transform:rotate(-90deg)}
.dm-nom{flex:1 1 260px;min-width:0}
.dm .btn{padding:5px 11px;font-size:13px}
.dm-plus{display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ===================== Réglages ===================== */
const SB_URL = "https://nzxphozupnmqyikitwhv.supabase.co";
const SB_CLE = "sb_publishable_lBCpThUu95LiYhyYy2VZfA_0NZRFE1q";
const ANALYSE_IA = "https://claude.ai/artifact/7rdJyKKdipwtb5QNnWAnyV";   // page Claude « Analyse et devis » (ton abonnement, compte claude.ai OIKOS)
const ANALYSE_IA_2 = "https://claude.ai/artifact/Kfd4g6zGHQdZSC2AXdnsBx";   // sa copie sur le compte claude.ai houssard.benj, ouverte par le lien oikos-compte2: (raccourci\Installer le bouton compte 2.bat, PC seulement) ; vide = pas de choix du compte
function boutonIA(nom, cible, aide, classe = "btn") {
  return ANALYSE_IA_2 && !matchMedia("(pointer: coarse)").matches
    ? `<button class="${classe}" type="button" data-ia="${cible}" data-ia-nom="${nom}" title="${aide}">${nom}</button>`
    : `<a class="${classe}" href="${ANALYSE_IA}#${cible}" target="_blank" rel="noopener" title="${aide}">${nom}</a>`;
}
function boutonsIA(c) {
  const dossier = esc(c.dossier_drive);
  return [["🤖 Analyse IA", "", "Rapport jardin ou ménage par Claude, à partir des photos"], ["🧾 Faire un devis", "devis~", "Devis VosFactures : tu donnes ton prix, il n'est créé qu'après ton Oui"]].map(([nom, debut, aide]) => boutonIA(nom, debut + dossier, aide)).join(" ");
}
function choisirCompteIA(cible, nom) {
  fenetre(`<h2 style="margin:0">${nom}</h2><p class="muted">Avec quel compte Claude ? Si l'un a atteint sa limite, prends l'autre. Chaque compte garde ses propres rapports.</p>
    <div class="row"><a class="btn" href="${ANALYSE_IA}#${cible}" target="_blank" rel="noopener" data-fermer>Compte OIKOS</a>
      <a class="btn" href="oikos-compte2:${ANALYSE_IA_2}#${cible}" data-fermer>Compte Benjamin Houssard</a>
      <button class="btn flat" type="button" data-fermer>Annuler</button></div>`);
}
const SUPABASE_USERS ="https://supabase.com/dashboard/project/nzxphozupnmqyikitwhv/auth/users";
const sb = window.supabase.createClient(SB_URL, SB_CLE, { auth: { persistSession: true, storageKey: "oikos-gerant-session" } });

/* ===================== Outils ===================== */
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let tt; function toast(t) { const e = document.getElementById("toast"); e.textContent = t; e.hidden = false; clearTimeout(tt); tt = setTimeout(() => e.hidden = true, 3800); }
const souci = e => toast("Ça n'a pas marché : " + ((e && e.message) || e));
/* Le petit « i » : une explication qui ne prend aucune place tant qu'on ne clique pas dessus */
const aide = t => `<button class="i" type="button" data-aide="${esc(t)}" aria-label="Explication" aria-expanded="false">i</button>`;
function fermerAide() { const o = document.getElementById("aide-bulle"); if (o) { o.pour.setAttribute("aria-expanded", "false"); o.remove(); } return o; }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-aide]"), o = fermerAide();
  if (!b || (o && o.pour === b)) return;
  const u = document.createElement("div"), r = b.getBoundingClientRect();
  u.id = "aide-bulle"; u.className = "aide-bulle"; u.setAttribute("role", "note"); u.textContent = b.dataset.aide; u.pour = b;
  document.body.append(u); b.setAttribute("aria-expanded", "true");
  u.style.left = Math.max(8, Math.min(r.left, innerWidth - u.offsetWidth - 8)) + "px";
  u.style.top = (r.bottom + u.offsetHeight + 12 > innerHeight ? Math.max(8, r.top - u.offsetHeight - 6) : r.bottom + 6) + "px";
});
document.addEventListener("keydown", e => { if (e.key === "Escape") fermerAide(); });
addEventListener("scroll", fermerAide, true);
const pad2 = n => String(n).padStart(2, "0");
const jour = d => new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
const hm = d => { d = new Date(d); return d.getHours() + "h" + pad2(d.getMinutes()); };
const heures = min => (Math.round(min / 60 * 100) / 100).toLocaleString("fr-FR") + " h";
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const chiffres = s => String(s || "").replace(/\D/g, "").slice(-9);
const nomPers = p => ((p.prenom || "") + " " + (p.nom || "")).trim() || p.email || "?";
const STATUTS = { "sous-traitant": "Sous-traitant", salarie: "Salarié" };
async function q(promesse) { const { data, error } = await promesse; if (error) throw error; return data; }
function fenetre(html, brancher, quandFerme) {
  const v = document.createElement("div"); v.className = "voile";
  v.innerHTML = `<div class="fenetre" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(v);
  const fermer = () => { v.remove(); if (quandFerme) quandFerme(); };
  v.addEventListener("click", e => { if (e.target === v || e.target.closest("[data-fermer]")) fermer(); });
  if (brancher) brancher(v.querySelector(".fenetre"), fermer);
  return fermer;
}

/* ===================== Connexion (compte gérant seulement) ===================== */
let moi = null, onglet = "avoir";
async function demarrer() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return ecranConnexion();
  const p = await sb.from("profils").select("*").eq("id", session.user.id).maybeSingle();
  if (p.error) return ecranConnexion("Pas de réseau ou base en pause : " + p.error.message);
  if (!p.data || p.data.role !== "gerant" || !p.data.actif) { await sb.auth.signOut(); return ecranConnexion("Ce compte n'est pas le compte gérant."); }
  moi = p.data; afficher();
}
function ecranConnexion(msg) {
  app.innerHTML = `<form class="connexion card" id="f"><div class="marque"><img src="logo-oikos.png" alt=""><span><b>Oikos</b> Pilotage</span></div>
    <p class="muted">Réservé au gérant.</p>${msg ? `<p class="err">${esc(msg)}</p>` : ""}
    <label class="f">E-mail<input type="email" id="e" autocomplete="username" required></label>
    <label class="f">Mot de passe<span class="row" style="flex-wrap:nowrap"><input type="password" id="m" autocomplete="current-password" required>
      <button class="btn" type="button" id="voirMdp" aria-pressed="false">Voir</button></span></label>
    <button class="btn primary" type="submit">Entrer</button></form>`;
  document.getElementById("voirMdp").onclick = () => {
    const m = document.getElementById("m"), b = document.getElementById("voirMdp"), cache = m.type === "password";
    m.type = cache ? "text" : "password"; b.textContent = cache ? "Cacher" : "Voir"; b.setAttribute("aria-pressed", cache); m.focus();
  };
  document.getElementById("f").onsubmit = async ev => {
    ev.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: document.getElementById("e").value.trim().toLowerCase(), password: document.getElementById("m").value });
    if (error) return ecranConnexion("E-mail ou mot de passe incorrect.");
    demarrer();
  };
}

async function compteurAVoir() {
  try {
    const [n, d, c, ta, ph, ju, td, dv] = await Promise.all([
      sb.from("notes_terrain").select("id", { count: "exact", head: true }).is("vue_le", null),
      sb.from("documents").select("id", { count: "exact", head: true }).eq("etat", "recu"),
      sb.from("clients_import").select("id", { count: "exact", head: true }).in("etat", ["nouveau", "different", "a_verifier"]),
      sb.from("taches").select("id", { count: "exact", head: true }).is("vue_le", null),
      sb.from("client_photos").select("id", { count: "exact", head: true }).is("vue_le", null).is("supprime_le", null),
      sb.from("client_juridique").select("id", { count: "exact", head: true }).eq("traite", false).is("supprime_le", null).lte("echeance", ymd(plusJours(new Date(), 7))),
      sb.from("tache_documents").select("id", { count: "exact", head: true }).is("vue_le", null),
      sb.from("demandes_devis").select("id", { count: "exact", head: true }).in("etat", ETATS_ATTENTE)]);

}

async function reduire(f, max, qualite) {
  const img = await createImageBitmap(f), k = Math.min(1, max / Math.max(img.width, img.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  return new Promise((ok, ko) => cv.toBlob(b => b ? ok(b) : ko(new Error("image illisible")), "image/jpeg", qualite));
}

async function terminerDemande(d, c, taches, re) {
  const restent = taches.filter(t => !t.fait_le).length, autres = cacheDemandes.some(x => x.id !== d.id && x.client_id === c.id && (enAttenteDevis(x) || x.etat === "en_cours"));
  const fini = d.type_prestation === "one_shot", attributions = (d.mission || {}).attributions || [];
  const autresPresta = cacheAttrib.some(a => a.client_id === c.id && prestaEnCours(a) && !attributions.includes(a.id));
  const archiver = d.client_a_archiver && fini && !autres && !autresPresta;
  const message = (restent ? restent + " tâche(s) de cette mission ne sont pas cochées. " : "") + "Finaliser « " + d.titre + " » ?" + (archiver ? " " + c.nom + " passera dans les anciens clients ; son profil reste dans la base et se reprendra s'il revient." : "");
  const finir = async () => {
  if (fini && attributions.length) await maj(sb.from("attributions").update({ fin: ymd(new Date()) }).in("id", attributions));
  if (archiver) await maj(sb.from("clients").update({ etat: "termine", archive_auto: false }).eq("id", c.id));   // archive_auto faux : une facture récente ne le remet pas en cours tout seul
  await maj(sb.from("demandes_devis").update({ etat: "finalisee", finalise_le: new Date().toISOString() }).eq("id", d.id));
  await chargerBase(); toast(archiver ? "Prestation terminée : client rangé dans les anciens" : "Prestation terminée"); re();
  };
  if (fini) return validerMission(d, c, restent, finir);
  if (confirm(message)) await finir();
}

      ${sans.length ? `<p class="muted small">Sans compte, à régler à la main : ${sans.map(esc).join(", ")}</p>` : ""}
      <p class="muted small">Ces heures partent dans son reporting et sa feuille d'heures. Il ne pourra pas les modifier. 0 = rien à ajouter.</p>
      <div class="row"><button class="btn go" type="submit">✓ Confirmer les heures et valider</button><button class="btn flat" type="button" data-fermer>Annuler</button></div></form>`, (el, fermer) => {
    el.querySelector("#fvm").onsubmit = async e => {

/* Plus une tâche dépasse sa fréquence sans être cochée, plus ses points montent ; « en partie » compte pour
   la moitié du chemin ; la météo inhabituelle en pousse certaines (×2) ou en met d'autres en pause. */
const METEO_PLUS = { canicule: ["arrosage"], secheresse: ["arrosage"], vent: ["ramassage", "nettoyage"], pluie: ["ramassage", "nettoyage"] };
const METEO_PAUSE = { gel: ["taille", "plantation", "traitement"], canicule: ["plantation", "traitement", "taille"], pluie: ["traitement", "tonte"] };
const CATS_ROUTE = { tonte: "Tonte", taille: "Taille", desherbage: "Désherbage", arrosage: "Arrosage", ramassage: "Ramassage", plantation: "Plantation", traitement: "Traitement", nettoyage: "Nettoyage", menage: "Ménage", autre: "Autre" };
const FREQS = [["", "Une seule fois"], [7, "Chaque semaine"], [14, "Tous les 15 jours"], [30, "Chaque mois"], [60, "Tous les 2 mois"], [90, "Chaque saison"], [180, "2 fois par an"], [365, "Une fois par an"]];
const MOIS_C = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
function pointsTache(t, meteo, maintenant = Date.now()) {
  if (!t.actif || t.termine) return { points: 0, etat: "fini" };
  const mois = new Date(maintenant).getMonth() + 1;
  if (t.mois && t.mois.length && !t.mois.includes(mois)) return { points: 0, etat: "hors saison" };
  const types = ((meteo && meteo.alertes) || []).map(a => a.type);
  if (types.some(k => (METEO_PAUSE[k] || []).includes(t.categorie))) return { points: 0, etat: "pause météo" };
  const freq = t.frequence_jours || 14;   // ponctuelle : monte en deux semaines
  let depuis = t.derniere_fois ? +new Date(t.derniere_fois) : +new Date(t.cree_le) - freq * 864e5;   // jamais faite : due tout de suite
  if (t.derniere_partielle) depuis = Math.max(depuis, +new Date(t.derniere_partielle) - freq * 864e5 / 2);   // en partie : repart à mi-chemin
  const retard = Math.max(0, (maintenant - depuis) / (freq * 864e5));
  let points = Math.round(t.priorite * 10 * retard);
  if (types.some(k => (METEO_PLUS[k] || []).includes(t.categorie))) points *= 2;
  return { points, retard, etat: retard >= 1 ? "à faire" : retard >= 0.7 ? "bientôt" : "à jour" };
}
const quandTache = t => { const f = FREQS.find(([v]) => String(v) === String(t.frequence_jours || "")); const m = (t.mois || []).filter(Boolean);
  return (f ? f[1] : "tous les " + t.frequence_jours + " j") + (m.length && m.length < 12 ? " · " + m.map(x => MOIS_C[x - 1]).join(", ") : ""); };
/* Part des tâches de saison qui sont à jour, à une date donnée (à partir des coches gardées) */
function etatEntretien(taches, coches, meteo, date) {
  const t0 = +date, enCours = taches.filter(t => t.actif && +new Date(t.cree_le) <= t0);
  let compte = 0, ok = 0;
  enCours.forEach(t => {
    const avant = coches.filter(c => c.tache_id === t.id && +new Date(c.fait_le) <= t0);
    const der = k => avant.filter(c => c.etat === k).reduce((m, c) => Math.max(m, +new Date(c.fait_le)), 0) || null;
    const v = { ...t, derniere_fois: der("fait") && new Date(der("fait")), derniere_partielle: der("partiel") && new Date(der("partiel")), termine: !t.frequence_jours && !!der("fait") };
    const p = pointsTache(v, date === undefined ? meteo : null, t0);
    if (p.etat === "hors saison" || p.etat === "pause météo") return;
    compte++; if (p.etat !== "à faire") ok++;
  });
  return compte ? Math.round(ok / compte * 100) : null;
}
async function dosRoute(c, corps, re) {

  const actives = taches.filter(t => t.actif && !t.termine).map(t => ({ t, ...pointsTache(t, c.meteo) })).sort((a, b) => b.points - a.points);
  const finies = taches.filter(t => !t.actif || t.termine);
  const pct = etatEntretien(taches, coches, c.meteo, Date.now());

  const courbe = histo.filter(o => o.v != null);
  const svg = courbe.length > 1 ? `<svg viewBox="0 0 240 60" width="240" height="60" role="img" aria-label="Évolution de l'entretien sur 12 semaines">

        <p class="muted small" style="margin-top:6px">Entretien courant estimé : ${heures(parSem * 60)} par semaine${c.temps_semaine_min && parSem * 60 > c.temps_semaine_min * 1.15 ? " : plus que le temps acheté, les priorités passent d'abord" : ""}.</p></section>
      <section class="card"><h3 style="margin-top:0">État de l'entretien</h3>
        ${pct == null ? `<p class="muted">Pas encore de tâche.</p>` : `<div class="row" style="gap:16px"><span style="font-size:30px;font-weight:800;color:var(--accent)">${pct} %</span><span class="muted small">des tâches de saison sont à jour</span></div>${svg}<p class="muted small">12 dernières semaines</p>`}</section>

      ${actives.length ? `<div style="overflow-x:auto"><table><tr><th>Points</th><th>Tâche</th><th>Quand</th><th>Durée</th><th>Prio.</th><th>Dernière fois</th><th></th></tr>
        ${actives.map(o => `<tr data-rt="${o.t.id}"><td><b>${o.points}</b><br>${tag(o.etat)}</td>
          <td><b>${esc(o.t.titre)}</b> <span class="muted small">· ${CATS_ROUTE[o.t.categorie] || ""}${o.t.source === "intervenante" ? " · ajoutée par l'intervenant" : o.t.source === "ia" ? " · IA" : ""}</span>${o.t.detail ? `<br><span class="muted small">${esc(o.t.detail)}</span>` : ""}</td>

async function envoyerPhoto(f, d) {
  let complet = f, apercu = f;
  try { complet = await reduire(f, 1600, 0.82); apercu = await reduire(f, 640, 0.7); } catch (e) {}   // format illisible ici : envoyé tel quel
  if (complet.size > 15 * 1024 * 1024) throw new Error("photo trop grosse (15 Mo au plus)");
  const n = nomFichier(), ch = `${d.client_id}/photos/${n}.jpg`, ap = `${d.client_id}/apercus/${n}.jpg`;
  for (const [chemin, blob] of [[ch, complet], [ap, apercu]]) {
    const { error } = await sb.storage.from("dossiers").upload(chemin, blob, { contentType: blob.type || "image/jpeg" });
    if (error) throw error;
  }
  const { error } = await sb.from("client_photos").insert({ ...d, apercu: ap, fichier: ch });
  if (error) throw error;
}
async function dosJuridique(c, corps, re) {
  const liste = await q(sb.from("client_juridique").select("*").eq("client_id", c.id).is("supprime_le", null).order("date_evt", { ascending: false, nullsFirst: false }).order("cree_le", { ascending: false }));
  const dans7 = ymd(plusJours(new Date(), 7));
  corps.innerHTML = `<p class="muted small" style="margin-bottom:8px">🔒 Visible par toi seul, jamais par les intervenants. Les pièces sont rangées dans le Drive d'OIKOS (CLIENTS OIKOS › ${esc(c.nom.toUpperCase())} › Juridique).</p>
    <form id="fj" class="card" style="display:flex;flex-direction:column;gap:8px">
      <div class="deux"><label class="f">Type<select name="type">${Object.entries(TYPES_J).map(([k, t]) => `<option value="${k}">${t}</option>`).join("")}</select></label>
        <label class="f">Titre<input type="text" name="titre" required maxlength="200" placeholder="Ex. contrat signé, réclamation vitre cassée…"></label></div>
      <div class="deux"><label class="f">Date (du fait, du courrier…)<input type="date" name="date_evt"></label>
        <label class="f">Rappel le (facultatif : délai, fin de contrat…)<input type="date" name="echeance"></label></div>
      <label class="f">Détail<textarea name="texte" maxlength="8000"></textarea></label>
      <label class="f">Pièce jointe (PDF ou photo, facultatif)<input type="file" name="fichier" accept="application/pdf,image/*"></label>
      <div><button class="btn primary" type="submit">Ajouter au dossier</button></div></form>
    <section class="card" style="margin-top:12px">${liste.length ? liste.map(x => `<div class="ligne" data-j="${x.id}"><span style="min-width:0">
        <span class="tag">${TYPES_J[x.type]}</span> <b>${esc(x.titre)}</b>${x.date_evt ? ` <span class="muted small">· ${new Date(x.date_evt + "T12:00").toLocaleDateString("fr-FR")}</span>` : ""}
        ${x.echeance ? ` <span class="tag ${!x.traite && x.echeance <= dans7 ? "warn" : x.traite ? "off" : ""}">${x.traite ? "✓ traité" : "rappel le " + new Date(x.echeance + "T12:00").toLocaleDateString("fr-FR")}</span>` : ""}
        ${x.texte ? `<br><span style="white-space:pre-wrap">${esc(x.texte)}</span>` : ""}</span>
      <span class="row" style="flex:none">${x.drive_url || x.fichier ? `<button class="btn" data-jvoir>📎 Pièce</button>` : ""}${x.echeance && !x.traite ? `<button class="btn go" data-jok>Traité ✓</button>` : ""}<button class="btn flat stop" data-jsup>Supprimer</button></span></div>`).join("")
      : `<p class="muted">Rien dans le volet juridique.</p>`}</section>`;
  corps.querySelector("#fj").onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target), fic = f.get("fichier");
    const d = { client_id: c.id, type: f.get("type"), titre: String(f.get("titre")).trim(), texte: String(f.get("texte")).trim() || null, date_evt: f.get("date_evt") || null, echeance: f.get("echeance") || null };
    if (!d.titre) return toast("Le titre est obligatoire");
    e.submitter.disabled = true;
    try {
      if (fic && fic.size) {
        if (fic.size > 15 * 1024 * 1024) throw new Error("pièce trop grosse (15 Mo au plus)");
        const ext = (fic.name.match(/\.(\w+)$/) || [, fic.type === "application/pdf" ? "pdf" : "jpg"])[1].toLowerCase();
        d.fichier = `${c.id}/juridique/${nomFichier()}.${ext}`; d.nom_origine = fic.name;
        const { error } = await sb.storage.from("dossiers").upload(d.fichier, fic, { contentType: fic.type || "application/octet-stream" });
        if (error) throw error;
      }
      await maj(sb.from("client_juridique").insert(d)); toast("Ajouté au dossier juridique"); re();
    } catch (err) { e.submitter.disabled = false; souci(err); }
  };
  corps.onclick = async e => {
    const b = e.target.closest("button"), l = b && b.closest("[data-j]"); if (!l) return;
    const x = liste.find(k => k.id === l.dataset.j);
    if (b.hasAttribute("data-jvoir")) {   // relu : le pont a pu ranger la pièce dans le Drive depuis l'ouverture
      const { data: y } = await sb.from("client_juridique").select("drive_url,fichier").eq("id", x.id).maybeSingle();
      const j = y || x;
      return j.drive_url ? window.open(j.drive_url, "_blank", "noopener") : j.fichier ? ouvrirStockage(j.fichier) : toast("Pièce introuvable : recharge le dossier");
    }
    if (b.hasAttribute("data-jok")) { await maj(sb.from("client_juridique").update({ traite: true }).eq("id", x.id)); compteurAVoir(); re(); }
    if (b.hasAttribute("data-jsup")) { if (!confirm("Supprimer « " + x.titre + " » ? La pièce part aussi à la corbeille du Drive.")) return;
      await maj(sb.from("client_juridique").update({ supprime_le: new Date().toISOString() }).eq("id", x.id)); re(); }
  };
}
/* Formulaire de la fiche (nouveau client, ou onglet « Fiche » du dossier) */
const casesActivites = c => `<span class="row" aria-label="Activités">${ACTIVITES_CLIENT.map(a => `<label class="chk"><input type="checkbox" name="act" value="${a}" ${activitesClient(c).includes(a) ? "checked" : ""}>${a}</label>`).join("")}</span>`;
const casesEntreprise = c => `<span class="row" aria-label="Entreprise" style="margin-left:14px">${["OIKOS", "BE"].map(k => `<label class="chk"><input type="checkbox" name="ent" value="${k}" ${entreprisesDe(c).includes(k) ? "checked" : ""}>${NOMS_ENTREPRISE[k]}</label>`).join("")}</span>`;
function formClient(c) {
  const ch = (k, t, type = "text") => `<label class="f">${t}<input type="${type}" name="${k}" value="${esc(c[k] || "")}"></label>`;
  return `<form id="fc" style="display:flex;flex-direction:column;gap:10px">
      <div class="deux">${ch("nom", "Nom")}${ch("telephone", "Téléphone", "tel")}</div>
      <div class="deux">${ch("email", "E-mail", "email")}${ch("adresse", "Adresse")}</div>
      <div class="deux"><label class="f">Zone<select name="zone"><option value="">—</option>${[1, 2, 3].map(z => `<option ${c.zone === z ? "selected" : ""}>${z}</option>`).join("")}</select></label>
        ${c.id ? "" : `<div class="f"><span>Activités</span>${casesActivites(c)}</div><div class="f"><span>Entreprise</span>${casesEntreprise(c)}</div>`}</div>
      <label class="f">Élèves, séparés par des virgules${c.source_pense ? " (repris de Pense intelligent : à corriger là-bas)" : ""} — vu par l'intervenant<input type="text" name="eleves" value="${esc(elevesClient(c))}"></label>
      <label class="f">État<select name="etat">${["prospect", "avance_attente", "actif", "pause", "termine"].map(a => `<option ${c.etat === a ? "selected" : ""}>${a}</option>`).join("")}</select></label>
      <label class="f">Accès (digicode, étage…) — vu par l'intervenant<textarea name="acces">${esc(c.acces || "")}</textarea></label>
      <label class="f">Clé — vu par l'intervenant<textarea name="cle">${esc(c.cle || "")}</textarea></label>
      <label class="f">Consignes — vu par l'intervenant<textarea name="consignes">${esc(c.consignes || "")}</textarea></label>
      <div class="row"><button class="btn primary" type="submit">Enregistrer</button><button class="btn flat" type="button" data-fermer>Fermer</button></div></form>`;
}
function brancherFormClient(el, c, apres) {
  el.querySelector("#fc").onsubmit = async e => {
    e.preventDefault(); const d = {};
    for (const [k, v] of new FormData(e.target)) d[k] = String(v).trim() || null;
    d.zone = d.zone ? Number(d.zone) : null;
    d.eleves = (d.eleves || "").split(/[,;]/).map(x => x.trim()).filter(Boolean);
    delete d.act; delete d.ent;
    if (!c) { const fd = new FormData(e.target); d.activites = fd.getAll("act"); d.entite = valeurEntreprise(fd.getAll("ent")); d.entite_manuelle = !!d.entite;
      if (!d.activites.length && d.etat !== "prospect") return toast("Coche au moins une activité");
      if (!d.entite && d.etat !== "prospect") return toast("Coche au moins une entreprise");
      d.activite = activitePrincipale(d.activites); }
    if (!d.nom) return toast("Le nom est obligatoire");
    if (c && d.adresse !== c.adresse) { d.lat = null; d.lng = null; }   // la position sera recalculée
    await maj(c ? sb.from("clients").update(d).eq("id", c.id) : sb.from("clients").insert(d));
    toast("Enregistré"); apres();
  };
}

/* ===================== Papiers demandés (réglages) ===================== */
async function vuePapiers() {
  const pieces = await q(sb.from("pieces_demandees").select("*").order("ordre"));
  const ligne = p => `<tr data-id="${p.id}">
    <td><input type="text" name="libelle" value="${esc(p.libelle)}"><input type="text" name="aide" value="${esc(p.aide || "")}" placeholder="Aide affichée (facultatif)" style="margin-top:4px;font-size:13px">
      <input type="text" name="mots" value="${esc(p.mots || "")}" placeholder="Mots pour le reconnaître dans le Drive : rib, iban…" title="Mots ou expressions séparés par des virgules, cherchés dans le nom du fichier puis dans le texte lu" style="margin-top:4px;font-size:13px">
      <label class="small muted row" style="margin-top:4px">Valable <input type="number" name="validite_mois" min="1" max="120" value="${p.validite_mois || ""}" placeholder="—" style="width:70px"> mois (vide = sans limite)</label></td>
    <td><select name="pour">${[["tous", "Tous"], ["sous-traitant", "Auto-entrepreneurs"], ["salarie", "Salariés"]].map(([k, t]) => `<option value="${k}" ${p.pour === k ? "selected" : ""}>${t}</option>`).join("")}</select></td>
    <td><select name="condition">${[["", "Toujours"], ["ae_a_creer", "Si OIKOS crée l'AE"], ["voiture", "S'il a une voiture"]].map(([k, t]) => `<option value="${k}" ${(p.condition || "") === k ? "selected" : ""}>${t}</option>`).join("")}</select></td>
    <td><label class="chk"><input type="checkbox" name="obligatoire" ${p.obligatoire ? "checked" : ""}>obligatoire</label><label class="chk"><input type="checkbox" name="actif" ${p.actif ? "checked" : ""}>demandé</label></td>
    <td>${p.modele ? `<span class="row"><button class="btn" data-mvoir>Voir</button><button class="btn" data-mdep>Remplacer</button><button class="btn flat stop" data-mret>Retirer</button></span>`
      : `<button class="btn" data-mdep>📎 Ajouter</button>`}</td>
    <td><span class="row"><button class="btn flat" data-haut title="Monter">↑</button><button class="btn flat" data-bas title="Descendre">↓</button><button class="btn primary" data-enr>Enregistrer</button></span></td></tr>`;
  const el = contenu(`<h1>Papiers demandés</h1>
    <p class="muted small" style="margin:6px 0 12px">Ce que l'appli demande à chaque intervenant selon son statut. Décocher « demandé » retire le papier de la liste sans effacer ceux déjà reçus.
      Un <b>modèle</b> (PDF ou Word : contrat, droit à l'image…) se télécharge depuis l'appli : il l'imprime, le signe et renvoie la photo.</p>
    <section class="card"><table><tr><th>Papier</th><th>Pour</th><th>Quand</th><th>Options</th><th>Modèle</th><th></th></tr>${pieces.map(ligne).join("")}</table>
    <button class="btn" id="aj" style="margin-top:10px">➕ Ajouter un papier</button>
    <input type="file" id="fm" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" hidden></section>`);
  let pourModele = null;
  const champModele = el.querySelector("#fm");
  champModele.onchange = async () => {
    const f = champModele.files[0], p = pieces.find(x => x.id === pourModele); if (!f || !p) return;
    const ancien = p.modele;
    const nom = f.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9.]+/g, "-");
    const chemin = `${p.id}/${Date.now()}-${nom}`;
    toast("Envoi du modèle…");
    const { error } = await sb.storage.from("modeles").upload(chemin, f, { contentType: f.type || "application/octet-stream" });
    if (error) return souci(error);
    await maj(sb.from("pieces_demandees").update({ modele: chemin }).eq("id", p.id));
    if (ancien) await sb.storage.from("modeles").remove([ancien]);
    toast("Modèle en ligne : ils peuvent le télécharger"); afficher("papiers");
  };
  const lire = tr => { const v = n => tr.querySelector(`[name=${n}]`); return { libelle: v("libelle").value.trim(), aide: v("aide").value.trim() || null, pour: v("pour").value,
    mots: v("mots").value.trim() || null, validite_mois: Number(v("validite_mois").value) || null,
    condition: v("condition").value || null, obligatoire: v("obligatoire").checked, actif: v("actif").checked }; };
  el.onclick = async e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "aj") { await maj(sb.from("pieces_demandees").insert({ libelle: "Nouveau papier", pour: "tous", ordre: (pieces.at(-1)?.ordre || 0) + 10 })); return afficher("papiers"); }
    const tr = b.closest("tr"); if (!tr) return;
    const i = pieces.findIndex(p => p.id === tr.dataset.id);
    if (b.hasAttribute("data-mdep")) { pourModele = tr.dataset.id; champModele.value = ""; return champModele.click(); }
    if (b.hasAttribute("data-mvoir")) { const { data, error } = await sb.storage.from("modeles").createSignedUrl(pieces[i].modele, 300); if (error) return souci(error); return window.open(data.signedUrl, "_blank", "noopener"); }
    if (b.hasAttribute("data-mret")) { await maj(sb.from("pieces_demandees").update({ modele: null }).eq("id", tr.dataset.id)); await sb.storage.from("modeles").remove([pieces[i].modele]); toast("Modèle retiré"); return afficher("papiers"); }
    if (b.hasAttribute("data-enr")) { const d = lire(tr); if (!d.libelle) return toast("Le nom du papier est obligatoire"); await maj(sb.from("pieces_demandees").update(d).eq("id", tr.dataset.id)); toast("Enregistré"); }
    const j = b.hasAttribute("data-haut") ? i - 1 : b.hasAttribute("data-bas") ? i + 1 : -1;
    if (j >= 0 && j < pieces.length) {   // on échange les deux, puis on renumérote 10, 20, 30…
      [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
      for (let k = 0; k < pieces.length; k++) if (pieces[k].ordre !== (k + 1) * 10) await maj(sb.from("pieces_demandees").update({ ordre: (k + 1) * 10 }).eq("id", pieces[k].id));
      afficher("papiers");
    }
  };
}

demarrer();
</script>
