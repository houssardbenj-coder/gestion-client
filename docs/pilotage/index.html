/* Tableau de bord du gérant : un onglet par sujet en haut, des listes et des fiches qui s'ouvrent sur place.
   Même base que l'appli des intervenantes ; seul le compte gérant peut entrer (la base le vérifie aussi). */
:root{
  --bg:#F2EEE1; --surface:#FFFFFF; --sunk:#E9E4D3; --ink:#1F2119; --muted:#55574B; --line:#CFCAB5;
  --accent:#46572B; --accent-fort:#34421E; --accent-ink:#FFFFFF; --accent-soft:#E2E8CC;
  --go:#2F7D32; --go-ink:#FFFFFF; --go-soft:#DCF0D8; --stop:#B3411F; --stop-ink:#FFFFFF; --stop-soft:#F9E2D8; --warn:#8A5700; --warn-vif:#C98A16; --warn-soft:#FBE8BC; --info:#2B6170; --info-soft:#D9EAEC; --roi:#3B3FC9; --roi-soft:#E4E4FA;
  --tete:#2E3622; --carte:#FFFFFF; --carte-bord:#DED9C6; --ombre:0 1px 2px rgb(35 36 31 / .08),0 10px 24px rgb(35 36 31 / .09); --ombre-btn:0 4px 12px rgb(52 66 30 / .35); --flou:none;
  --bouton:#FFFFFF; --mono:#C9D4AA; --tri:#EEEADB; --trait:rgb(70 87 43 / .09); --paie:#DCF0D8; --paie-ink:#256B28; --delai:#F9E2D8; --delai-ink:#8E2F1C;
  --titre:Fraunces,"Cormorant Garamond",Georgia,serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1B1D15; --surface:#2A2E21; --sunk:#14160F; --ink:#F6F4EA; --muted:#C4C5B5; --line:#4F5441;
  --accent:#C8DE85; --accent-fort:#DCEBA9; --accent-ink:#1B1D15; --accent-soft:#3B4326;
  --go:#86D178; --go-ink:#14160F; --go-soft:#26381F; --stop:#F2805F; --stop-ink:#1B1D15; --stop-soft:#4A2519; --warn:#F0C35C; --warn-vif:#F0C35C; --warn-soft:#42360F; --info:#85C9D6; --info-soft:#1F3A40; --roi:#A9ACFF; --roi-soft:#2A2B5C;
  --tete:#2F3722; --carte:rgb(243 241 231 / .09); --carte-bord:rgb(243 241 231 / .2); --ombre:0 18px 40px rgb(0 0 0 / .28); --ombre-btn:0 4px 14px rgb(0 0 0 / .4); --flou:blur(18px);
  --bouton:rgb(243 241 231 / .06); --mono:#5C6349; --tri:#2B2E21; --trait:rgb(243 241 231 / .22); --paie:#26361F; --paie-ink:#A6DC9B; --delai:#43231A; --delai-ink:#F4B5A5; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1B1D15; --surface:#2A2E21; --sunk:#14160F; --ink:#F6F4EA; --muted:#C4C5B5; --line:#4F5441;
  --accent:#C8DE85; --accent-fort:#DCEBA9; --accent-ink:#1B1D15; --accent-soft:#3B4326;
  --go:#86D178; --go-ink:#14160F; --go-soft:#26381F; --stop:#F2805F; --stop-ink:#1B1D15; --stop-soft:#4A2519; --warn:#F0C35C; --warn-vif:#F0C35C; --warn-soft:#42360F; --info:#85C9D6; --info-soft:#1F3A40; --roi:#A9ACFF; --roi-soft:#2A2B5C;
  --tete:#2F3722; --carte:rgb(243 241 231 / .09); --carte-bord:rgb(243 241 231 / .2); --ombre:0 18px 40px rgb(0 0 0 / .28); --ombre-btn:0 4px 14px rgb(0 0 0 / .4); --flou:blur(18px);
  --bouton:rgb(243 241 231 / .06); --mono:#5C6349; --tri:#2B2E21; --trait:rgb(243 241 231 / .22); --paie:#26361F; --paie-ink:#A6DC9B; --delai:#43231A; --delai-ink:#F4B5A5; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-family:var(--titre);font-weight:600;font-size:26px;letter-spacing:-.01em;margin:0} h2{font-family:var(--titre);font-weight:600;font-size:19px;margin:20px 0 8px} h3{font-size:15px;margin:14px 0 6px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.wrap{max-width:1150px;margin:0 auto;padding:16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:10px}
.marque{font-family:var(--titre);font-weight:500;font-size:20px;display:flex;gap:10px;align-items:center}
.marque b{font-weight:600}
.marque img{width:42px;height:42px;padding:2px;background:#F7F5EE;border:1px solid var(--line);border-radius:12px}
.connexion .btn.primary{justify-content:center}
.connexion .marque{flex-direction:column;text-align:center;font-size:24px}
.connexion .marque img{width:128px;height:128px;padding:8px;border-radius:24px}
nav.onglets{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav.onglets button{border:0;background:none;padding:8px 12px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer}
nav.onglets button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.bulle{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--stop);color:#fff;font-size:12px;margin-left:4px;text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.deux{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:760px){.deux{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);border-radius:999px}
.btn.go{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.btn.stop{color:var(--stop)}
.btn.flat{border-color:transparent;background:none;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.45;cursor:default}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.off{background:var(--sunk);color:var(--muted)}
.pastille{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--go);margin-left:6px;vertical-align:middle}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],select,textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);width:100%}
textarea{min-height:80px;resize:vertical}
.chk{display:flex;gap:8px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0}
.ligne{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ligne:first-child{border-top:0}
.cliquable{cursor:pointer} .cliquable:hover{border-color:var(--accent)}
.err{color:var(--stop);font-weight:600}
.diff del{color:var(--stop)} .diff ins{color:var(--go);text-decoration:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:92vw}
/* La feuille de route : à lire d'un coup d'œil, la couleur dit ce qui passe d'abord */
.fdr{display:flex;flex-direction:column;gap:14px;min-width:0;text-align:left}
.fdr-tete{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px 16px}
.fdr-tete b{display:block;font-family:var(--titre);font-size:21px;font-weight:600;line-height:1.2}
.fdr-tete a,.fdr-tete span{color:inherit;font-size:14px}
.fdr-chiffres{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fdr-chiffre{background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.fdr-chiffre b{display:block;font-size:21px;line-height:1.2}
.fdr-chiffre span{font-size:12px;color:var(--muted)}
.fdr-chiffre.paie{background:var(--paie)}
.fdr-chiffre.paie b{color:var(--paie-ink)}
.fdr-delai{background:var(--delai);color:var(--delai-ink);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600}
.fdr-mot{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.fdr-photos{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.fdr-photos img{height:110px;width:146px;object-fit:cover;border-radius:10px;background:var(--sunk);display:block}
.fdr h4{margin:0 0 6px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.fdr-puces{display:flex;flex-wrap:wrap;gap:6px}
.fdr-puces span{padding:5px 10px;border-radius:999px;font-size:14px;background:var(--sunk)}
.fdr-puces.ramener span{background:var(--warn-soft);font-weight:600}
.fdr-groupe{display:flex;flex-direction:column;gap:6px}
.fdr-titre{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.fdr-titre i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.fdr-tache{border-left:5px solid var(--c);background:var(--surface);border-radius:8px;padding:8px 10px;box-shadow:0 0 0 1px var(--line)}
.fdr-tache>div{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.fdr-tache b{font-size:15px}
.fdr-tache em{font-style:normal;font-size:13px;color:var(--muted);white-space:nowrap}
.fdr-tache p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.fdr-tache details{font-size:13px;margin-top:2px}
.fdr-tache summary{cursor:pointer;color:var(--accent);font-weight:600}
.fdr-note{font-size:12px;color:var(--muted);margin:0}
.voile{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.fenetre{background:var(--bg);border-radius:16px;padding:18px;width:100%;max-width:820px;display:flex;flex-direction:column;gap:12px}
.connexion{max-width:380px;margin:12vh auto;display:flex;flex-direction:column;gap:12px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}
.photo{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.vignette{display:block;width:100%;border:0;padding:0;cursor:zoom-in;background:var(--sunk)}
.vignette img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.plante-ligne{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px}
.plante-photo{flex:none;width:56px;height:56px;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk);cursor:zoom-in}
.plante-photo img{display:block;width:100%;height:100%;object-fit:cover}
.photo figcaption{padding:8px 10px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.em-table{min-width:900px;table-layout:fixed}.em-table td{vertical-align:top}.em-table th{background:transparent;color:var(--ink);border-bottom:1px solid var(--line);border-radius:0}.em-table th.em-auj .em-aujm{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.em-ev{display:block;width:100%;text-align:left;margin-bottom:4px;padding:5px 7px;font-size:13px;font-weight:400;background:var(--surface);color:inherit;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;overflow-wrap:anywhere}
button.em-ev{cursor:pointer}button.em-ev:hover{background:var(--accent-soft)}
/* une couleur par activité : OIKOS olive, Benjamin enseignement bleu-vert, prospect ocre, hors presta bleu roi, tâche gris */
.em-s-OIKOS{--em:var(--accent)}.em-s-BE{--em:var(--info)}.em-s-PROSPECT{--em:var(--warn)}.em-s-CLIENT{--em:var(--muted)}.em-s-TACHE{--em:var(--line)}.em-s-AUTRE{--em:var(--roi)}
.em-ev{border-left-color:var(--em,var(--accent))}.em-ev.em-s-AUTRE{background:var(--roi-soft);border-color:var(--roi);color:var(--roi)}
.em-l.em-s-AUTRE{color:var(--roi)}.em-jour .em-l{border-left:4px solid var(--em,transparent);padding-left:8px}
.em-leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px;font-size:12.5px;color:var(--muted)}.em-leg span{display:inline-flex;align-items:center;gap:5px}
.em-leg i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--em)}.em-leg .em-ann i{background:var(--stop)}
.em-ev.em-rec{border-style:dashed;border-left-style:solid}
.em-annule{display:block;margin-bottom:4px;padding:4px 7px;font-size:12.5px;color:var(--stop);background:var(--stop-soft);border:1px solid var(--stop);border-radius:6px;overflow-wrap:anywhere}
.em-annule b{font-weight:600}.em-annule s{color:inherit;opacity:.85}
.em-jour{margin-bottom:14px;border-left:4px solid var(--accent)}.em-jour h2{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:17px}
.em-jour .em-l{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line);font-size:14px}.em-jour .em-l:first-of-type{border-top:0}
.em-jour .em-l b{min-width:96px;font-variant-numeric:tabular-nums}.em-jour .em-l.em-annule{padding:5px 7px;border-top:0;border-left:1px solid var(--stop);margin:3px 0}
.em-act .chip.em-rep{font-size:12px;padding:3px 9px;font-weight:600}.em-act .chip.em-rep .ico{width:13px;height:13px}
/* Grille des heures (comme l'Agenda de Pense intelligent) : une colonne par jour, une ligne par heure, clic sur un vide = nouveau RDV */
.em-grille{display:grid;grid-template-columns:46px repeat(var(--n),minmax(118px,1fr));min-width:calc(46px + var(--n) * 118px)}
.em-gh{padding:4px 4px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:13px}.em-gh .em-aujm{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase}
.em-gh.auj .btn{font-weight:700}
.em-gad{padding:3px;border-bottom:1px solid var(--line);min-height:6px}.em-gad .em-gev{position:static;display:block;margin-bottom:3px;height:auto}
.em-gh0{position:relative;border-right:1px solid var(--line)}.em-gh0 span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.em-gcol{position:relative;border-left:1px solid var(--line);cursor:copy;background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--px)),repeating-linear-gradient(to bottom,transparent 0 calc(var(--px) / 2),var(--trait) calc(var(--px) / 2) calc(var(--px) / 2 + 1px),transparent calc(var(--px) / 2 + 1px) var(--px))}
.em-gev{position:absolute;overflow:hidden;font-size:12px;line-height:1.25;padding:3px 26px 3px 6px;border-radius:6px;border:1px solid var(--line);border-left:3px solid var(--em,var(--accent));background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 1px 2px rgb(0 0 0 / .08);text-align:left}
.em-gev b{font-weight:700;font-variant-numeric:tabular-nums}.em-gev:hover{z-index:3;box-shadow:0 2px 8px rgb(0 0 0 / .18)}
.em-gev.em-s-AUTRE{background:var(--roi-soft);border-color:var(--roi);color:var(--roi)}
.em-gev.ann{background:var(--stop-soft);border-color:var(--stop);color:var(--stop);cursor:default}.em-gev.ann s{opacity:.85}
.em-gev.att{border-style:dashed;border-left-style:solid;opacity:.9}
.em-tg{position:absolute;top:2px;right:2px;width:22px;height:22px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.em-tg .ico{width:13px;height:13px}.em-tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.em-maint{position:absolute;left:0;right:0;height:2px;background:var(--stop);z-index:2;pointer-events:none}
.em-nv .seg{display:flex;gap:6px;margin:0 0 10px}.em-nv .f{margin-bottom:10px}
.em-jour h3{margin:8px 0 2px;font-size:13px;color:var(--muted);font-weight:600}.em-act{display:flex;flex-wrap:wrap;gap:2px;margin:-2px 0 6px}.em-act .btn{font-size:12px;padding:2px 6px;min-height:0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pk{display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.pk-tete{display:flex;gap:6px;align-items:center}
.pk-tete .chips{flex:1;justify-content:center}
.pk-autre{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--sunk);border-radius:10px}
.pk-autre .pk-tete b{flex:1;text-align:center}
.pk-jours{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pk-j{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:5px 0;cursor:pointer}
.pk-j span{font-size:11px;text-transform:uppercase;color:var(--muted)}
.pk-j b{font-size:16px}
.pk-j i{font-style:normal;font-size:11px;line-height:1;height:11px;color:var(--accent)}
.pk-j.auj b{color:var(--accent)}
.pk-j.passe{opacity:.5}
.pk-j.sel{background:var(--accent);border-color:var(--accent);opacity:1}
.pk-j.sel span,.pk-j.sel b,.pk-j.sel i{color:var(--accent-ink)}
.pk-grille{position:relative;background:var(--sunk);border-radius:10px;overflow:hidden;cursor:copy}
.pk-h{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.pk-h:first-child{border-top:0}
.pk-h span{position:absolute;left:8px;top:2px;font-size:11px;color:var(--muted)}
.pk-h::after{content:"";position:absolute;left:44px;right:0;top:50%;border-top:1px dashed var(--line)}
.pk-rdv,.pk-new{position:absolute;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;pointer-events:none}
.pk-rdv{background:var(--accent-soft);border-left:3px solid var(--accent)}
.pk-new{left:44px;right:4px;background:var(--accent);color:var(--accent-ink);border:2px solid var(--ink)}
.pk-new.conflit{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.pk-maint{position:absolute;left:40px;right:0;height:2px;background:var(--stop);pointer-events:none}
.pk-alerte{color:var(--warn);font-weight:600;font-size:13px}
#pk-txt{border-style:dashed}
.cl-liste{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.cl-liste .btn{text-align:left;font-weight:400;display:block;width:100%}
.tk-grp>summary::-webkit-details-marker{display:none}
.tk-grp>summary span{background:var(--bg);border-radius:999px;padding:0 8px;font-size:12px}

/* Charte : piste A le jour, piste B la nuit, comme l'appli des intervenants, en plus dense pour l'écran du PC. */

/* Couleurs franches (05/11/2026) : en-tête olive sombre, trois niveaux de boutons, terracotta = urgent, ocre = à décider, ardoise = pour information, vert = validé */
header.top{--ink:#F7F5EE;--muted:#D3D9BE;--accent:#C8DE85;--accent-ink:#1B1D15;--accent-soft:rgb(255 255 255 / .16);--line:rgb(255 255 255 / .28);--bouton:rgb(255 255 255 / .1);--bg:rgb(255 255 255 / .1);--mono:#6F7C4B;background:var(--tete);color:var(--ink);box-shadow:0 2px 10px rgb(0 0 0 / .22);-webkit-backdrop-filter:none;backdrop-filter:none}
header.top .btn.flat{color:var(--ink)}
nav.onglets button{color:var(--muted)}
nav.onglets button:hover{background:rgb(255 255 255 / .12);color:var(--ink)}

.cherche-btn:hover{background:rgb(255 255 255 / .18);color:var(--ink)}
/* Titres */

h2{font-weight:500;color:var(--accent-fort)}
.card h2:first-child{margin-top:0}
/* Boutons : plein = l'action à faire, contour = une autre action, texte seul = secondaire */
.btn{background:var(--bouton);border:1.5px solid var(--accent);color:var(--accent);font-weight:600}
.btn:hover:not(:disabled){background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

.btn.go{background:var(--go);border-color:var(--go);color:var(--go-ink);box-shadow:var(--ombre-btn)}
.btn.go:hover:not(:disabled){background:var(--go);filter:brightness(.9);transform:translateY(-1px)}
.btn.stop{background:var(--bouton);border-color:var(--stop);color:var(--stop)}
.btn.stop:hover:not(:disabled){background:var(--stop-soft)}
.btn.flat{background:none;border-color:transparent;color:var(--accent);box-shadow:none}
.btn.flat:hover:not(:disabled){background:var(--accent-soft)}
.btn.flat.stop{color:var(--stop)}
.btn.flat.stop:hover:not(:disabled){background:var(--stop-soft)}
.cl-liste .btn{border:1px solid var(--line);color:var(--ink);font-weight:400}
.btn[data-cr]{border-color:var(--line);color:var(--ink);box-shadow:none}
.btn[data-cr][style*="--go"]{background:var(--go-soft);border-width:2px}
.chip{border:1.5px solid var(--line);color:var(--accent-fort)}
.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.chip[aria-pressed="true"],.chip[aria-pressed="true"]:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
/* Étiquettes */

.card[style*="border-color:var(--warn)"]{border-color:var(--warn-vif)!important;border-left-width:6px;background:color-mix(in srgb,var(--warn-soft) 45%,var(--surface))}
.cliquable:hover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),var(--ombre)}
tr.cliquable:hover{background:var(--accent-soft);box-shadow:none}
.dos-carte:hover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),var(--ombre)}
th{background:var(--accent-soft);color:var(--accent-fort);font-weight:600}
th:first-child{border-radius:9px 0 0 9px}
th:last-child{border-radius:0 9px 9px 0}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],input[type=date],input[type=time],input[type=datetime-local],input[type=search],select,textarea,.rp-ligne input{border:1.5px solid var(--line)}

.jour-icone.info{background:var(--info-soft);color:var(--info)}

.rail details.rail-branche>summary::after{color:var(--accent-fort);font-size:18px}
.proc{background:var(--surface);border:1px solid var(--line)}
.proc:hover{border-color:var(--accent);background:var(--accent-soft)}

.etat.partiel{background:var(--warn-vif)!important}.etat.aucune{background:var(--stop)!important}

.ms-b{background:var(--surface);border-color:var(--line)}

.ms-pers[aria-current="true"]{box-shadow:inset 4px 0 0 var(--accent);border-radius:4px 10px 10px 4px}
/* Chiffres : un filet de couleur par nature de montant */
.su-chiffres .card{border-top:4px solid var(--accent)}
.su-chiffres .card:nth-child(4){border-top-color:var(--warn-vif)}
.su-chiffres .card:nth-child(5){border-top-color:var(--go)}
.su-chiffres b{color:var(--accent-fort)}
.su-table tr.total td{background:var(--accent-soft);color:var(--accent-fort)}

.lg-table .lg-num{position:sticky;left:0;z-index:1;background:var(--sunk);color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0;padding:2px 5px;text-align:right;border-top:1px solid var(--line);border-radius:0;min-width:34px}

.lg-table input.lg-c{border:1px solid transparent;border-radius:6px;background:transparent;padding:4px 3px;font-size:13px;color:var(--ink)}
.lg-table input.lg-c:hover{border-color:var(--line);background:var(--surface)}
.lg-table input.lg-c:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 2px var(--accent-soft)}

.lg-table input.lg-c{width:100%}.lg-table input.w-date{min-width:90px}.lg-table input.w-num{min-width:48px;text-align:right}.lg-table input.w-txt{min-width:84px}.lg-table input.w-long{min-width:90px}.lg-table input.w-nom{min-width:124px}.lg-table input.w-court{min-width:68px}

/* « Plus tard » sur la double authentification : retenu pour cet onglet, sinon chaque actualisation redemandait de l'activer */
const plusTard = () => { try { sessionStorage.setItem(PLUS_TARD_CLE, moi ? moi.id : ""); } catch (e) {} afficher(); };
const plusTardDejaDit = () => { try { return !!moi && sessionStorage.getItem(PLUS_TARD_CLE) === moi.id; } catch (e) { return false; } };
const coupureReseau = e => !!e && (e.name === "AuthRetryableFetchError" || /fetch|network|r[ée]seau|timeout/i.test(e.message || ""));
/* Pas de réseau ou base en pause : la session reste, on propose juste de réessayer (avant, cela renvoyait à l'écran de connexion) */
function ecranReessayer(msg) {
  app.innerHTML = `<div class="connexion card"><div class="marque"><img src="logo-oikos.png" alt=""><span><b>Oikos</b> Pilotage</span></div>
    <p class="err">${esc(msg)}</p><p class="muted">Tu es toujours connecté : réessaie dans un instant.</p>
    <button class="btn primary" type="button" id="reessayer">Réessayer</button><button class="btn flat" type="button" id="changer">Changer de compte</button></div>`;
  document.getElementById("reessayer").onclick = () => demarrer();
  document.getElementById("changer").onclick = async () => { await sb.auth.signOut(); ecranConnexion(); };
}
async function demarrer() {
  const { data: { session }, error: errSession } = await sb.auth.getSession();
  if (!session) return coupureReseau(errSession) ? ecranReessayer("Pas de réseau : " + errSession.message) : ecranConnexion();
  const p = await sb.from("profils").select("*").eq("id", session.user.id).maybeSingle();
  if (p.error) return ecranReessayer("Pas de réseau ou base en pause : " + p.error.message);
  if (!p.data || p.data.role !== "gerant" || !p.data.actif) { await sb.auth.signOut(); return ecranConnexion("Ce compte n'est pas le compte gérant."); }
  moi = p.data;
  const { data: niveau, error: errNiveau } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (errNiveau) return ecranReessayer("Pas de réseau : " + errNiveau.message);
  if (niveau.currentLevel === "aal2") return afficher(pageRetenue() || undefined);
  if (niveau.nextLevel === "aal2") return ecranCodeMfa();
  if (plusTardDejaDit()) return afficher(pageRetenue() || undefined);
  ecranActiverMfa();
}
/* Double authentification : le code à 6 chiffres de l'appli d'authentification, après le mot de passe */
function pageMfa(html) {
  app.innerHTML = `<form class="connexion card" id="f"><div class="marque"><img src="logo-oikos.png" alt=""><span><b>Oikos</b> Pilotage</span></div>${html}</form>`;

const champCode = `<label class="f">Code à 6 chiffres<input id="mfa-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>`;
async function ecranCodeMfa(msg) {
  const { data, error } = await sb.auth.mfa.listFactors();
  if (error) return ecranConnexion("Pas de réseau : " + error.message);
  const facteur = data.totp[0];
  if (!facteur) return ecranActiverMfa();
  pageMfa(`<p class="muted">Ouvre ton appli d'authentification et entre le code affiché pour OIKOS Pilotage.</p>${msg ? `<p class="err">${esc(msg)}</p>` : ""}${champCode}
    <button class="btn primary" type="submit">Valider</button><button class="btn flat" type="button" id="mfa-sortir">Changer de compte</button>`);
  document.getElementById("f").onsubmit = async ev => {
    ev.preventDefault();
    const { error: e } = await sb.auth.mfa.challengeAndVerify({ factorId: facteur.id, code: document.getElementById("mfa-code").value.trim() });
    if (e) return ecranCodeMfa("Code incorrect ou expiré : réessaie avec le code suivant.");
    demarrer();
  };
}
async function ecranActiverMfa(msg) {
  const liste = await sb.auth.mfa.listFactors();
  for (const f of (liste.data && liste.data.all) || []) if (f.status !== "verified") await sb.auth.mfa.unenroll({ factorId: f.id });   // essai abandonné
  const { data, error } = await sb.auth.mfa.enroll({ factorType: "totp", friendlyName: "OIKOS Pilotage " + Date.now() });

  pageMfa(`<h2 style="margin:0">Protège le pilotage</h2><p class="muted">Dans ton appli d'authentification, ajoute un compte en scannant ce carré, puis entre le code affiché.</p>

    ${champCode}<button class="btn primary" type="submit">Activer</button><button class="btn flat" type="button" id="mfa-tard">Plus tard</button>`);
  document.getElementById("mfa-tard").onclick = plusTard;
  document.getElementById("f").onsubmit = async ev => {
    ev.preventDefault();
    const { error: e } = await sb.auth.mfa.challengeAndVerify({ factorId: data.id, code: document.getElementById("mfa-code").value.trim() });
    if (e) return ecranActiverMfa("Code refusé : on recommence avec un nouveau carré. Supprime l'ancienne ligne dans ton appli.");
    toast("Double authentification activée"); demarrer();
  };
}

    ? `<a href="${esc(cible)}" target="_blank" rel="noopener noreferrer" data-web="${esc(cible)}" data-profil="${esc(profil)}">${esc(sansEmoji(nom))}</a>`

  const motif = /\[([^\]]+)\]\(([^)]+)\)|(https?:\/\/[^\s)]+)/g;
  let h = "", i = 0, m; t = String(t ?? "");

async function ikAjouter(f, confirmer) {
  const trajet = { date: f.date.value, lieu: f.lieu.value.trim(), adresse: f.adresse.value.trim(), motif: f.motif.value.trim() };
  if (!trajet.date || !trajet.lieu || !trajet.adresse) return toast("Il faut la date, le lieu et l'adresse");
  const b = f.querySelector("#ik-ajouter"); b.disabled = true;
  try {
    const r = await pc("/ik", { version: ikP.version, trajet, confirmer: !!confirmer }, 60000);
    if (r.doublon) { b.disabled = false; if (confirm(r.doublon + " L'ajouter quand même ?")) return ikAjouter(f, true); return; }
    ikP = r; ikErreur = ""; ikSource = "";
    ikMois = new Date(Number(trajet.date.slice(0, 4)), Number(trajet.date.slice(5, 7)) - 1, 1);
    toast("Trajet ajouté dans l'Excel (ligne " + r.ajoute.ligne + ")");
    ikDessiner();
  } catch (e) { ikErreur = e.message || String(e); ikDessiner(); }
}
/* Export : un fichier CSV que WPS et Excel ouvrent directement (point-virgule, accents gardés), une ligne par trajet, colonne km vide pour le comptable */
function ikExporter(liste, mois = ikMois) {
  const cellule = v => { let t = String(v ?? ""); if (/^[=+\-@]/.test(t)) t = "'" + t; return /[";\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const lignes = [["date", "lieu/personne", "adresse", "km", "motif", "type", "d'où"]].concat(liste.map(t => [ikJour(t.date), t.lieu, t.adresse, "", t.motif, IK_TYPES[t.type] || "", IK_SOURCES[t.source] || ""]));
  const texte = "﻿" + lignes.map(l => l.map(cellule).join(";")).join("\r\n") + "\r\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([texte], { type: "text/csv;charset=utf-8" }));
  a.download = "Trajets IK " + ikNomMois(mois) + (ikSource ? " - " + IK_SOURCES[ikSource] : "") + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(liste.length + " trajet" + (liste.length > 1 ? "s" : "") + " exporté" + (liste.length > 1 ? "s" : ""));
}

/* ===================== Déclarer mes heures : même saisie que le Reporting de l'appli, rattachée aux élèves de l'Excel =====================
   Vérifier puis enregistrer écrit une ligne de SAISIE COURS, par le programme du PC (lignes_excel.py), au même format que le programme Reporting.
   Comme Lignes Excel : rien de ces lignes n'est écrit dans cette page ni copié dans la base. OIKOS et Benjamin enseignement ne sont jamais additionnés.
   L'élève se tape au clavier : la page propose les fiches les plus proches, et retient l'écriture choisie (« simon » → SIMON) pour les fois suivantes. */
const HD_CLE = "oikos-gerant-heures", HD_MEM = "oikos-gerant-ecritures", HD_ENTITES = ["Benjamin enseignement", "OIKOS", "Entité à préciser"];
let hdBrouillon = []; try { hdBrouillon = JSON.parse(localStorage.getItem(HD_CLE)) || []; } catch (e) {}
const hdGarder = () => { try { localStorage.setItem(HD_CLE, JSON.stringify(hdBrouillon)); } catch (e) {} };
let hdMois = new Date(new Date().getFullYear(), new Date().getMonth(), 1), hdErreur = "";
const hdEntite = e => /enseignement|^be$/i.test(String(e || "").trim()) ? HD_ENTITES[0] : /^oikos$/i.test(String(e || "").trim()) ? HD_ENTITES[1] : HD_ENTITES[2];
const hdFiche = prenom => prenom ? lgP.listes.eleves.find(x => norm(x.prenom) === norm(prenom)) : null;
const hdNombre = v => { const n = parseFloat(String(v ?? "").trim().replace(",", ".")); return n > 0 ? n : 0; };
const hdDuree = min => { const h = Math.floor(min / 60), m = Math.round(min - h * 60); return m ? h + "h" + pad2(m) : h + "h"; };   // « 1h30 », comme les notes du programme Reporting
/* Les écritures retenues : { « simon » : { p: "SIMON", t: quand } }. Gardées dans ce navigateur et, si la base l'accepte (SQL 45), dans pilote_documents pour l'autre PC. */
let hdMemoire = {}; try { hdMemoire = JSON.parse(localStorage.getItem(HD_MEM)) || {}; } catch (e) {}
let hdMemoireLue = false;
async function hdMemoireLire() {
  if (hdMemoireLue) return; hdMemoireLue = true;
  try {
    const c = await lireCopie("ecritures"), d = (c && c.contenu) || {};
    Object.entries(d).forEach(([k, v]) => { if (v && v.p && (!hdMemoire[k] || (hdMemoire[k].t || 0) < (v.t || 0))) hdMemoire[k] = v; });
    try { localStorage.setItem(HD_MEM, JSON.stringify(hdMemoire)); } catch (e) {}
  } catch (e) {}
}
function hdRetenir(ecrit, prenom) {
  const k = norm(ecrit); if (k.length < 2 || !prenom || norm(prenom) === k && !hdMemoire[k]) return;
  if (hdMemoire[k] && hdMemoire[k].p === prenom) return;
  hdMemoire[k] = { p: prenom, t: Date.now() };
  try { localStorage.setItem(HD_MEM, JSON.stringify(hdMemoire)); } catch (e) {}
  if (typeof sb !== "undefined") copierDansBase("ecritures", String(Date.now()), hdMemoire).catch(() => {});
}
const hdMots = s => norm(s).split(" ").filter(m => m && !VIDES.has(m) && !/^\d+$/.test(m));
/* Les fiches qui ressemblent le plus à ce qui est écrit, la meilleure d'abord :
   écriture déjà retenue, puis prénom exact (« simon » → SIMON avant « simon p »), puis début du prénom, puis ressemblance (prénom ou client). */
function hdClasser(ecrit) {
  const k = norm(ecrit), mots = hdMots(ecrit);
  if (!k) return [];
  const retenu = (hdMemoire[k] || mots.map(m => hdMemoire[m]).find(Boolean) || {}).p || "";
  const usage = {}; lgP.cours.forEach(c => { const n = norm(c.prenom); usage[n] = (usage[n] || 0) + 1; });
  const vus = new Set(), res = [];
  lgP.listes.eleves.forEach(x => {
    const p = norm(x.prenom); if (!p || vus.has(p)) return; vus.add(p);   // même prénom écrit deux fois (casse) : la première fiche, comme l'Excel
    const siens = p.split(" ");
    let s;
    if (retenu && norm(retenu) === p) s = 3;
    else if (p === k || mots.join(" ") === p) s = 2;
    else if (mots.length === 1 && siens[0] === mots[0]) s = 1.5;
    else if (p.startsWith(k)) s = 1.2;
    else {
      const prenom = Math.max(0, ...mots.map(m => Math.max(0, ...siens.map(w => ressemblance(m, w)))));
      const oublies = siens.filter(w => !mots.some(m => ressemblance(m, w) >= .75)).length;   // « simon » ressemble moins à « simon p » qu'à « simon »
      const client = Math.max(0, ...mots.filter(m => m.length >= 3).map(m => Math.max(0, ...norm(x.client).split(" ").filter(w => w.length >= 3).map(w => ressemblance(m, w))))) * .85;
      s = Math.max(prenom - .1 * oublies, client);
    }
    if (s >= .6) res.push({ x, s: s + Math.min(usage[p] || 0, 20) / 1000 });   // à égalité, l'élève qui a le plus de cours
  });
  return res.sort((a, b) => b.s - a.s);
}
/* Choisi d'office seulement si une fiche se détache nettement des autres */
function hdDeviner(ecrit) {
  const [a, b] = hdClasser(ecrit);
  return a && a.s >= .75 && (!b || a.s - b.s > .05) ? a.x.prenom : "";
}
/* Même règle que le programme Reporting : la moitié payée d'avance seulement si tous ses cours (2 au moins) sont ainsi */
function hdMoitieHabituelle(prenom) {
  const siens = lgP.cours.filter(x => norm(x.prenom) === norm(prenom) && x.montant);
  return siens.length >= 2 && siens.every(x => x.acompte && Math.abs(x.acompte * 2 - x.montant) < .01);
}
/* Sans tarif sur la fiche (la plupart aujourd'hui) : celui tapé sur la ligne, sinon celui de son dernier cours, annoncé comme tel */
function hdTarif(l, fiche) {
  if (fiche && fiche.taux > 0) return { taux: +fiche.taux, source: "fiche" };
  if (hdNombre(l.tarif)) return { taux: hdNombre(l.tarif), source: "tape" };
  const dernier = fiche && lgP.cours.find(x => norm(x.prenom) === norm(fiche.prenom) && x.heures > 0 && x.montant > 0);
  return dernier ? { taux: Math.round(dernier.montant / dernier.heures * 100) / 100, source: "dernier" } : { taux: 0, source: "" };
}
function hdCalcul(l) {
  const fiche = hdFiche(l.eleve), t = hdTarif(l, fiche), total = l.minutes > 0 && t.taux ? Math.round(l.minutes / 60 * t.taux * 100) / 100 : 0;
  const acompte = l.moitie && total ? Math.round(total * 50) / 100 : 0;
  return { fiche, ...t, total, acompte, reste: Math.round((total - acompte) * 100) / 100 };
}
const hdOk = l => { const c = hdCalcul(l); return !!(c.fiche && c.total && l.jour && l.jour <= ymd(new Date())); };
/* Ce que dit la fiche de l'élève pour cette déclaration */
function hdTexteFiche(l) {
  const c = hdCalcul(l);
  if (!c.fiche) return { manque: true, h: (l.saisie ?? l.ecrit) ? `Pas de fiche à ce nom : choisis parmi les propositions, ou mets la ligne de côté.` : "Tape le prénom de l'élève : sa fiche donne le client et le tarif." };
  const qui = `Fiche : <b>${esc(c.fiche.prenom)}</b> · ${esc(c.fiche.client) || "client manquant"} · ${esc(hdEntite(c.fiche.entite))}`;
  if (!c.taux) return { manque: true, h: `${qui}<br>Pas de tarif sur sa fiche ni de cours passé : indique son tarif à l'heure.` };
  const origine = c.source === "fiche" ? "tarif de sa fiche" : c.source === "dernier" ? "pas de tarif sur sa fiche, repris de son dernier cours : à vérifier" : "tarif tapé ici, sa fiche n'en a pas";
  if (!c.total) return { manque: true, h: `${qui}<br>${suEuros(c.taux)} de l'heure (${origine}). Indique les heures.` };
  return { manque: false, h: `${qui}<br>${heures(l.minutes)} × ${suEuros(c.taux)} (${origine}) = <b>${suEuros(c.total)}</b>${c.acompte ? `<br>Déjà payé ${suEuros(c.acompte)}, reste à payer <b>${suEuros(c.reste)}</b>` : ""}` };
}

}

const GF_TEXTES = { sas: "Beaucoup de fichiers", rouge: "Plafond atteint", orphelins: "Envoi hors de l'appli", boucle: "Envoi en boucle", dossiers: "Beaucoup de dossiers", programme: "Fichier refusé" };

  const [reglages, alertes, sasDocs, sasPhotos] = await Promise.all([
    q(sb.from("depots_reglages").select("*").eq("id", 1).maybeSingle()),
    q(sb.from("alertes_fichiers").select("*").is("vue_le", null).order("cree_le")),
    q(sb.from("tache_documents").select("id,ajoute_par,nom,chemin,taille,sas_depuis").not("sas_depuis", "is", null).order("sas_depuis")),
    q(sb.from("client_photos").select("id,auteur,client_id,legende,sas_depuis").not("sas_depuis", "is", null).order("sas_depuis"))]);
  const qui = new Map();
  const fiche = id => { if (!qui.has(id)) qui.set(id, { id, alertes: [], docs: [], photos: [] }); return qui.get(id); };
  alertes.forEach(a => fiche(a.intervenante_id).alertes.push(a));
  sasDocs.forEach(d => fiche(d.ajoute_par).docs.push(d));
  sasPhotos.forEach(p => fiche(p.auteur).photos.push(p));

}

}

/* Répéter un passage chaque semaine (Planning) : copies réelles dans creneaux pour les 12 semaines suivantes, que l'appli
   du presta et son agenda Google voient comme les autres. Même série = même presta, même client (ou même objet), même jour,
   même heure, même durée. Un 2e clic annule les copies à venir ; le passage cliqué reste. Rouvrir le Planning ne prolonge pas. */
const PL_SEMAINES = 12;
const plMemeSerie = (x, y) => y.id !== x.id && y.intervenante_id === x.intervenante_id && (y.client_id || null) === (x.client_id || null)
  && (x.client_id || (y.titre || "") === (x.titre || "")) && new Date(y.debut).getDay() === new Date(x.debut).getDay()
  && hm(y.debut) === hm(x.debut) && (new Date(y.fin) - new Date(y.debut)) === (new Date(x.fin) - new Date(x.debut));
async function plBasculer(x, enlever) {
  try {
    const d0 = new Date(x.debut), dur = new Date(x.fin) - d0;
    const fin = plusJours(d0, 7 * PL_SEMAINES + 1);
    const deja = await q(sb.from("creneaux").select("id,intervenante_id,client_id,titre,debut,fin").eq("intervenante_id", x.intervenante_id).eq("annule", false).gt("debut", d0.toISOString()).lt("debut", fin.toISOString()));
    const suite = deja.filter(y => plMemeSerie(x, y));
    if (enlever) {
      if (suite.length) await maj(sb.from("creneaux").update({ annule: true }).in("id", suite.map(y => y.id)));
      toast(`Plus répété : ${suite.length} passage(s) à venir retiré(s). Celui-ci reste.`);
    } else {
      const lignes = [];
      for (let n = 1; n <= PL_SEMAINES; n++) {
        const j = plusJours(d0, 7 * n), debut = new Date(j.getFullYear(), j.getMonth(), j.getDate(), d0.getHours(), d0.getMinutes());
        if (suite.some(y => ymd(new Date(y.debut)) === ymd(debut))) continue;
        lignes.push({ intervenante_id: x.intervenante_id, client_id: x.client_id || null, titre: x.titre || null, lieu: x.lieu || null, note: x.note || null, debut: debut.toISOString(), fin: new Date(debut.getTime() + dur).toISOString() });
      }
      if (lignes.length) await maj(sb.from("creneaux").insert(lignes));
      toast(`Répété chaque semaine jusqu'au ${plusJours(d0, 7 * PL_SEMAINES).toLocaleDateString("fr-FR")}.`);

const TITRES = { nom: ["nom", "client", "name", "raison sociale"], prenom: ["prenom", "first name"], telephone: ["tel", "telephone", "portable", "mobile", "phone"],

/* Une photo → aperçu (640 px, gardé dans la base) + photo complète (1600 px, en transit vers le Drive d'OIKOS) */
async function envoyerPhoto(f, d) {
  let complet = f, apercu = f;
  try { complet = await reduire(f, 1600, 0.82); apercu = await reduire(f, 640, 0.7); } catch (e) {}   // format illisible ici : envoyé tel quel
  if (complet.size > 15 * 1024 * 1024) throw new Error("photo trop grosse (15 Mo au plus)");
  const n = nomFichier(), ch = `${d.client_id}/photos/${n}.jpg`, ap = `${d.client_id}/apercus/${n}.jpg`;
  for (const [chemin, blob] of [[ch, complet], [ap, apercu]]) {
    const { error } = await sb.storage.from("dossiers").upload(chemin, blob, { contentType: blob.type || "image/jpeg" });
    if (error) throw error;
  }
  const { error } = await sb.from("client_photos").insert({ ...d, apercu: ap, fichier: ch });
  if (error) throw error;
}

      <input type="text" name="mots" value="${esc(p.mots || "")}" placeholder="Mots pour le reconnaître dans le Drive : rib, iban…" title="Mots ou expressions séparés par des virgules, cherchés dans le nom du fichier puis dans le texte lu" style="margin-top:4px;font-size:13px">
      <label class="small muted row" style="margin-top:4px">Valable <input type="number" name="validite_mois" min="1" max="120" value="${p.validite_mois || ""}" placeholder="—" style="width:70px"> mois (vide = sans limite)</label></td>
    <td><select name="pour">${[["tous", "Tous"], ["sous-traitant", "Auto-entrepreneurs"], ["salarie", "Salariés"]].map(([k, t]) => `<option value="${k}" ${p.pour === k ? "selected" : ""}>${t}</option>`).join("")}</select></td>
    <td><select name="condition">${[["", "Toujours"], ["ae_a_creer", "Si OIKOS crée l'AE"], ["voiture", "S'il a une voiture"]].map(([k, t]) => `<option value="${k}" ${(p.condition || "") === k ? "selected" : ""}>${t}</option>`).join("")}</select></td>
    <td><label class="chk"><input type="checkbox" name="obligatoire" ${p.obligatoire ? "checked" : ""}>obligatoire</label><label class="chk"><input type="checkbox" name="actif" ${p.actif ? "checked" : ""}>demandé</label></td>
    <td>${p.modele ? `<span class="row"><button class="btn" data-mvoir>Voir</button><button class="btn" data-mdep>Remplacer</button><button class="btn flat stop" data-mret>Retirer</button></span>`
      : `<button class="btn" data-mdep>${ico("trombone")} Ajouter</button>`}</td>
    <td><span class="row"><button class="btn flat" data-haut title="Monter">↑</button><button class="btn flat" data-bas title="Descendre">↓</button><button class="btn primary" data-enr>Enregistrer</button></span></td></tr>`;
  const el = contenu(`<h1>Papiers demandés</h1>
    <p class="muted small" style="margin:6px 0 12px">Ce que l'appli demande à chaque intervenant selon son statut. Décocher « demandé » retire le papier de la liste sans effacer ceux déjà reçus.
      Un <b>modèle</b> (PDF ou Word : contrat, droit à l'image…) se télécharge depuis l'appli : il l'imprime, le signe et renvoie la photo.</p>
    <section class="card"><table><tr><th>Papier</th><th>Pour</th><th>Quand</th><th>Options</th><th>Modèle</th><th></th></tr>${pieces.map(ligne).join("")}</table>
    <button class="btn" id="aj" style="margin-top:10px">${ico("plus")} Ajouter un papier</button>
    <input type="file" id="fm" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" hidden></section>`);
  let pourModele = null;
  const champModele = el.querySelector("#fm");
  champModele.onchange = async () => {
    const f = champModele.files[0], p = pieces.find(x => x.id === pourModele); if (!f || !p) return;
    const ancien = p.modele;
    const nom = f.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9.]+/g, "-");
    const chemin = `${p.id}/${Date.now()}-${nom}`;
    toast("Envoi du modèle…");
    const { error } = await sb.storage.from("modeles").upload(chemin, f, { contentType: f.type || "application/octet-stream" });
    if (error) return souci(error);
    await maj(sb.from("pieces_demandees").update({ modele: chemin }).eq("id", p.id));
    if (ancien) await sb.storage.from("modeles").remove([ancien]);
    toast("Modèle en ligne : ils peuvent le télécharger"); afficher("papiers");
  };
  const lire = tr => { const v = n => tr.querySelector(`[name=${n}]`); return { libelle: v("libelle").value.trim(), aide: v("aide").value.trim() || null, pour: v("pour").value,
    mots: v("mots").value.trim() || null, validite_mois: Number(v("validite_mois").value) || null,
    condition: v("condition").value || null, obligatoire: v("obligatoire").checked, actif: v("actif").checked }; };
  el.onclick = async e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "aj") { await maj(sb.from("pieces_demandees").insert({ libelle: "Nouveau papier", pour: "tous", ordre: (pieces.at(-1)?.ordre || 0) + 10 })); return afficher("papiers"); }
    const tr = b.closest("tr"); if (!tr) return;
    const i = pieces.findIndex(p => p.id === tr.dataset.id);
    if (b.hasAttribute("data-mdep")) { pourModele = tr.dataset.id; champModele.value = ""; return champModele.click(); }
    if (b.hasAttribute("data-mvoir")) { const { data, error } = await sb.storage.from("modeles").createSignedUrl(pieces[i].modele, 300); if (error) return souci(error); return window.open(data.signedUrl, "_blank", "noopener"); }
    if (b.hasAttribute("data-mret")) { await maj(sb.from("pieces_demandees").update({ modele: null }).eq("id", tr.dataset.id)); await sb.storage.from("modeles").remove([pieces[i].modele]); toast("Modèle retiré"); return afficher("papiers"); }
    if (b.hasAttribute("data-enr")) { const d = lire(tr); if (!d.libelle) return toast("Le nom du papier est obligatoire"); await maj(sb.from("pieces_demandees").update(d).eq("id", tr.dataset.id)); toast("Enregistré"); }
    const j = b.hasAttribute("data-haut") ? i - 1 : b.hasAttribute("data-bas") ? i + 1 : -1;
    if (j >= 0 && j < pieces.length) {   // on échange les deux, puis on renumérote 10, 20, 30…
      [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
      for (let k = 0; k < pieces.length; k++) if (pieces[k].ordre !== (k + 1) * 10) await maj(sb.from("pieces_demandees").update({ ordre: (k + 1) * 10 }).eq("id", pieces[k].id));
      afficher("papiers");
    }
  };
}

demarrer();
</script>
</body>
</html>
