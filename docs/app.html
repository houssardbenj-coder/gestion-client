<!doctype html><html lang="fr"><head><meta charset="utf-8">
<!--PB_APP_MARKER-->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));padding-bottom:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
body{margin:0;font:14px system-ui,sans-serif;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.PB_VERSION=7;window.PB_UPDATE_URL="https://houssardbenj-coder.github.io/gestion-client/";</script>
<script>window.PB_SEED={};</script>
<script>// Base de données locale : remplace le stockage Claude par le stockage du téléphone.
// Même interface que la page Claude (collection / doc / onSnapshot / set / delete),
// donc le Pense-bête fonctionne sans modification.
(function(){
  const KEY="pb-data-v1";
  let data={};
  try{data=JSON.parse(localStorage.getItem(KEY)||"null")||null}catch(e){data=null}
  if(!data){data=JSON.parse(JSON.stringify(window.PB_SEED||{}));persist()}
  const subs={};

  function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){console.error("Sauvegarde locale impossible",e)}}
  function snap(c,order){
    let docs=Object.entries(data[c]||{}).map(([id,b])=>({id,exists:true,metadata:{fromCache:false,hasPendingWrites:false},data:()=>JSON.parse(JSON.stringify(b))}));
    if(order)docs.sort((a,b)=>{const x=a.data()[order],y=b.data()[order];return (x??Infinity)-(y??Infinity)});
    return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[]};
  }
  function fire(c){(subs[c]||[]).forEach(s=>s.cb(snap(c,s.order)));window.dispatchEvent(new Event("pb-data-changed"))}

  const db={
    collection(c){
      const q={_order:null,
        orderBy(f){const n=Object.create(q);n._order=f;return n},
        where(){return this},limit(){return this},
        async get(){return snap(c,this._order)},
        onSnapshot(cb){const s={cb,order:this._order};(subs[c]=subs[c]||[]).push(s);setTimeout(()=>cb(snap(c,s.order)));return()=>{subs[c]=(subs[c]||[]).filter(x=>x!==s)}},
        doc(id){return db.doc(c+"/"+(id||Math.random().toString(36).slice(2,11)))}};
      return q;
    },
    doc(path){
      const [c,id]=path.split("/");
      return {id,path,
        async get(){const b=(data[c]||{})[id];return {id,exists:!!b,data:()=>b&&JSON.parse(JSON.stringify(b))}},
        async set(body){(data[c]=data[c]||{})[id]=JSON.parse(JSON.stringify(body));persist();fire(c)},
        async update(body){if(!(data[c]||{})[id])throw {code:"invalid_argument"};Object.assign(data[c][id],JSON.parse(JSON.stringify(body)));persist();fire(c)},
        async delete(){if(data[c]){delete data[c][id];persist();fire(c)}}};
    }
  };

  window.PB_store={
    all:()=>data,
    exportJSON:()=>JSON.stringify({app:"pense-bete",version:1,exportedAt:new Date().toISOString(),data},null,1),
    importJSON(text){
      const o=JSON.parse(text);
      if(!o||o.app!=="pense-bete"||typeof o.data!=="object")throw new Error("format");
      data=o.data;persist();Object.keys(subs).forEach(fire);
    }
  };
  window.claude={use:async n=>n==="db"?db:null};
})();
</script>
<script>// Fonctions propres au téléphone : alarmes, agenda Android, sauvegarde, bouton retour.
(function(){
  const C=window.Capacitor;
  if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
  const LN=C.registerPlugin("LocalNotifications");
  const CAL=C.registerPlugin("CapacitorCalendar");
  const FS=C.registerPlugin("Filesystem");
  const SH=C.registerPlugin("Share");
  const APP=C.registerPlugin("App");
  const pad=n=>String(n).padStart(2,"0");
  const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const dim=(y,m)=>new Date(y,m+1,0).getDate();
  function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return y+"-W"+pad(w)}
  function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)%2000000000+1}
  const name=x=>[x.firstName,x.lastName].filter(Boolean).join(" ")||x.title||"Sans nom";
  let exact=false;

  // Prochaines échéances d'une routine : [{at:Date, key:période}]
  function occurrences(r){
    const [hh,mm]=String(r.time||"09:00").split(":").map(Number);
    const now=new Date(), out=[];
    const y=now.getFullYear(), m=now.getMonth();
    if(r.freq==="daily"){for(let k=0;k<31;k++){const d=new Date(y,m,now.getDate()+k,hh,mm);out.push({at:d,key:ymd(d)})}}
    else if(r.freq==="weekly"){const wd=Number(r.weekday||1),cur=now.getDay()||7;
      for(let k=0;k<26;k++){const d=new Date(y,m,now.getDate()+(wd-cur)+7*k,hh,mm);out.push({at:d,key:isoWeek(d)})}}
    else if(r.freq==="quarterly"){const qs=Math.floor(m/3)*3;
      for(let k=0;k<5;k++){const mo=qs+3*k+Number(r.monthOffset||0);const d=new Date(y,mo,1,hh,mm);d.setDate(Math.min(Number(r.day||1),dim(d.getFullYear(),d.getMonth())));
        const q=Math.floor((qs+3*k)%12/3)+1, qy=new Date(y,qs+3*k,1).getFullYear();out.push({at:d,key:qy+"-T"+q})}}
    else{for(let k=0;k<13;k++){const d=new Date(y,m+k,1,hh,mm);d.setDate(Math.min(Number(r.day||1),dim(d.getFullYear(),d.getMonth())));out.push({at:d,key:d.getFullYear()+"-"+pad(d.getMonth()+1)})}}
    return out;
  }

  function buildNotifications(){
    const D=window.PB_store.all(), now=Date.now(), list=[];
    Object.entries(D.routines||{}).forEach(([id,r])=>{
      const tasks=r.tasks||[];
      occurrences(r).forEach(o=>{
        if(o.at.getTime()<=now)return;
        const run=(D.runs||{})[id+"__"+o.key];const done=run&&run.done||{};
        if(tasks.length&&tasks.every(t=>done[t.id]))return;
        const body=tasks.length?tasks.length+" tâche"+(tasks.length>1?"s":"")+" : "+tasks.slice(0,3).map(t=>t.label).join(", ")+(tasks.length>3?"…":""):"Ouvre ta checklist";
        list.push({key:"r:"+id+":"+o.key,at:o.at,title:"📋 "+(r.title||"Routine"),body});
      });
    });
    Object.entries(D.leads||{}).forEach(([id,l])=>{
      if((l.status&&l.status!=="open")||!l.when)return;
      if(l.type==="rdv"){const at=l.when-3600e3;if(at>now)list.push({key:"l:"+id+":"+l.when,at:new Date(at),title:"📅 RDV dans 1 h : "+name(l),body:[l.address,l.phone].filter(Boolean).join(" · ")||"Rendez-vous"});}
      else if(l.when>now)list.push({key:"l:"+id+":"+l.when,at:new Date(l.when),title:"📞 À rappeler : "+name(l),body:[l.phone,l.reason].filter(Boolean).join(" · ")||"Rappel client"});
    });
    Object.entries(D.projects||{}).forEach(([id,p])=>{
      if(!p.rdv)return;const at=p.rdv-3600e3;
      if(at>now)list.push({key:"p:"+id+":"+p.rdv,at:new Date(at),title:"📅 RDV dans 1 h : "+name(p),body:[p.address,p.phone].filter(Boolean).join(" · ")||"Rendez-vous client"});
    });
    return list.sort((a,b)=>a.at-b.at).slice(0,400);
  }

  let timer=null, running=false, again=false;
  function reschedule(){clearTimeout(timer);timer=setTimeout(doReschedule,800)}
  async function doReschedule(){
    if(running){again=true;return}
    running=true;
    try{
      const pend=await LN.getPending();
      if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
      const list=buildNotifications();
      if(list.length)await LN.schedule({notifications:list.map(n=>({id:hash(n.key),title:n.title,body:n.body,channelId:"rappels",
        schedule:{at:n.at,allowWhileIdle:true},isExactNotification:exact,foreground:true}))});
    }catch(e){console.error("Programmation des rappels impossible",e)}
    running=false; if(again){again=false;reschedule()}
  }

  async function setup(){
    try{await LN.createChannel({id:"rappels",name:"Rappels",description:"Routines, rendez-vous et rappels clients",importance:5,visibility:1,vibration:true})}catch(e){}
    try{const p=await LN.checkPermissions();if(p.display!=="granted")await LN.requestPermissions()}catch(e){}
    try{const s=await LN.checkExactNotificationSetting();exact=s.exact_alarm==="granted"}catch(e){}
    reschedule();
  }

  // ===== Mise à jour automatique de l'interface depuis GitHub =====
  // version.json : {"version": N, "notes": "..."} ; app.html : la nouvelle interface complète.
  // Elle est copiée dans le stockage de l'appli puis chargée à la place de celle d'origine
  // (même adresse interne, donc les données restent). Un nouvel APK installé reprend la main.
  const WV=C.registerPlugin("WebView");
  let checking=false,lastCheck=0;
  async function checkUpdate(manual){
    const base=window.PB_UPDATE_URL;
    if(!base||checking)return manual?"none":undefined;
    checking=true;lastCheck=Date.now();
    try{
      const r=await fetch(base+"version.json?t="+Date.now(),{cache:"no-store"});
      if(!r.ok)throw new Error("http "+r.status);
      const info=await r.json();
      if(!(Number(info.version)>Number(window.PB_VERSION||0)))return "uptodate";
      if(!manual&&document.querySelector(".sheet-bg"))return "later"; // une fiche est ouverte : on attend
      const page=await (await fetch(base+"app.html?v="+info.version,{cache:"no-store"})).text();
      if(!page.includes("<!--PB_APP_MARKER-->")||!page.includes("window.PB_VERSION="+Number(info.version)+";"))throw new Error("fichier incomplet");
      const dir="live/"+Number(info.version);
      await FS.writeFile({path:dir+"/index.html",data:page,directory:"DATA",encoding:"utf8",recursive:true});
      const {uri}=await FS.getUri({path:dir,directory:"DATA"});
      try{localStorage.setItem("pb-just-updated",JSON.stringify({v:info.version,notes:info.notes||""}))}catch(e){}
      WV.setServerBasePath({path:decodeURIComponent(uri.replace(/^file:\/\//,""))});
      WV.persistServerBasePath();
      return "updated";
    }catch(e){console.error("Mise à jour impossible",e);window.PB_lastUpdateError=String(e&&(e.message||e.errorMessage)||e);return "error"}
    finally{checking=false}
  }
  document.addEventListener("DOMContentLoaded",()=>{
    let j=null;try{j=JSON.parse(localStorage.getItem("pb-just-updated")||"null");localStorage.removeItem("pb-just-updated")}catch(e){}
    if(j)setTimeout(()=>{const s=document.getElementById("status");if(s)s.textContent="✓ Appli mise à jour (version "+j.v+")"+(j.notes?" : "+j.notes:"")},800);
    setTimeout(()=>checkUpdate(false),2500);
  });

  window.addEventListener("pb-data-changed",reschedule);
  APP.addListener("resume",async()=>{
    try{const s=await LN.checkExactNotificationSetting();exact=s.exact_alarm==="granted"}catch(e){}
    window.dispatchEvent(new Event("pb-resume"));reschedule();
    if(Date.now()-lastCheck>2*60e3)checkUpdate(false);
  });
  APP.addListener("backButton",()=>{
    if(document.querySelector(".sheet-bg"))document.dispatchEvent(new KeyboardEvent("keydown",{key:"Escape"}));
    else APP.exitApp();
  });

  async function canWrite(){
    let s=(await CAL.checkPermission({scope:"writeCalendar"})).result;
    if(s!=="granted")s=(await CAL.requestFullCalendarAccess()).result;
    return s==="granted";
  }

  // Agenda cible : celui choisi dans les réglages, sinon l'agenda principal du compte Gmail
  async function chosenCalendar(){
    let id="";try{id=localStorage.getItem("pb-cal-id")||""}catch(e){}
    let list=[];try{list=(await CAL.listCalendars()).result||[]}catch(e){return id||undefined}
    if(id&&list.some(c=>String(c.id)===id))return id;
    const google=list.filter(c=>/@(gmail|googlemail)\.com$/i.test(c.accountName||""));
    const best=google.find(c=>(c.ownerAccount||"")===(c.accountName||"")&&(c.title===c.accountName||c.internalTitle===c.accountName))
      ||google.find(c=>(c.ownerAccount||"")===(c.accountName||""))||google[0];
    if(best){id=String(best.id);try{localStorage.setItem("pb-cal-id",id)}catch(e){}return id}
    return undefined;
  }

  window.PB_native={
    async agendaPermission(){try{return (await CAL.checkPermission({scope:"readCalendar"})).result}catch(e){return "denied"}},
    async askAgenda(){try{return (await CAL.requestFullCalendarAccess()).result}catch(e){return "denied"}},
    async listEvents(from,to){const r=await CAL.listEventsInRange({from,to});return (r.result||[]).map(e=>({id:e.id,title:e.title,startDate:e.startDate,endDate:e.endDate,location:e.location,isAllDay:e.isAllDay}))},
    // Crée l'événement dans l'agenda Google (ou le met à jour s'il existe déjà : calId)
    async addEvent({title,start,end,minutes,location,description,calId}){
      if(!(await canWrite()))throw new Error("denied");
      const calendarId=await chosenCalendar();
      const body={title,startDate:start,endDate:end&&end>start?end:start+3600e3,location,description,alerts:[-(minutes||60)]};
      if(calId&&calId!=="ok"){
        try{await CAL.modifyEvent({id:String(calId),...body});return calId}catch(e){/* supprimé de l'agenda : on le recrée */}
      }
      const r=await CAL.createEvent(calendarId?{...body,calendarId}:body);
      return r&&r.id;
    },
    async calendars(){
      if(!(await canWrite()))return [];
      const r=await CAL.listCalendars();
      return (r.result||[]).map(c=>({id:c.id,title:c.title||c.internalTitle||c.accountName||"Agenda",account:c.accountName||""}));
    },
    chosenCalendarId:()=>{try{return localStorage.getItem("pb-cal-id")||""}catch(e){return ""}},
    setCalendar(id){try{localStorage.setItem("pb-cal-id",id)}catch(e){}},
    async exportData(){
      const file="pense-intelligent-sauvegarde-"+ymd(new Date())+".json";
      const w=await FS.writeFile({path:file,data:window.PB_store.exportJSON(),directory:"CACHE",encoding:"utf8"});
      await SH.share({title:"Sauvegarde Pense intelligent",text:"Sauvegarde de mes données Pense intelligent",files:[w.uri],dialogTitle:"Où enregistrer la sauvegarde ?"});
    },
    version:()=>window.PB_VERSION||0,
    checkUpdate:()=>checkUpdate(true),
    async importData(text){window.PB_store.importJSON(text);reschedule()},
    async openAlarmSettings(){
      try{await LN.requestPermissions()}catch(e){}
      try{const s=await LN.changeExactNotificationSetting();exact=s.exact_alarm==="granted"}catch(e){}
      reschedule();
    }
  };
  setup();
})();
</script>

<title>Pense intelligent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout : une colonne façon carnet, cartes de routines empilées, feuille d'édition en bas d'écran */
:root{
  --bg:#eef1f5; --paper:#ffffff; --ink:#18212f; --muted:#5d6878; --line:#d9dee6;
  --hi:#ffe14d; --hi-ink:#18212f; --accent:#2346d8; --ok:#1f8a4c; --warn:#c2410c;
  --shadow:0 1px 2px rgba(24,33,47,.06),0 4px 14px rgba(24,33,47,.06);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151d; --paper:#19202b; --ink:#e8ecf2; --muted:#9aa5b5; --line:#2a3340;
  --hi:#e8c935; --hi-ink:#10151d; --accent:#8aa2ff; --ok:#4cc27e; --warn:#fb923c;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151d; --paper:#19202b; --ink:#e8ecf2; --muted:#9aa5b5; --line:#2a3340;
  --hi:#e8c935; --hi-ink:#10151d; --accent:#8aa2ff; --ok:#4cc27e; --warn:#fb923c;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:20px 96px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;margin:0;letter-spacing:-.02em}
h1 span{background:linear-gradient(transparent 55%,var(--hi) 55%);padding:0 .1em}
.today{color:var(--muted);font-size:.9rem;margin-top:6px}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:600 .8rem var(--body);padding:8px 2px;min-width:0;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.section-label{font:600 .75rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 2px -6px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
.card-head h2{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:0;flex:1;min-width:0;text-wrap:balance}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 16px 10px;font-size:.82rem;color:var(--muted)}
.pill{font:600 .72rem var(--body);padding:3px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill.due{border-color:var(--warn);color:var(--warn)}
.pill.done{border-color:var(--ok);color:var(--ok)}
.ring{width:38px;height:38px;flex:none}
.ring circle{fill:none;stroke-width:4}
.ring .bgc{stroke:var(--line)} .ring .fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .3s}
.ring text{font:600 10px var(--body);fill:var(--ink);font-variant-numeric:tabular-nums}
ul.tasks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ul.tasks li{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
ul.tasks li:last-child{border-bottom:0}
.chk{appearance:none;width:26px;height:26px;border:2px solid var(--muted);border-radius:7px;flex:none;cursor:pointer;display:grid;place-items:center;background:var(--paper);margin:0}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:7px;height:13px;border:solid var(--paper);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.t-label{flex:1;min-width:0;cursor:pointer}
.t-label .txt{background-image:linear-gradient(var(--hi),var(--hi));background-repeat:no-repeat;background-size:0 45%;background-position:0 85%;transition:background-size .35s ease;overflow-wrap:anywhere}
li.is-done .t-label .txt{background-size:100% 45%;color:var(--muted)}
.t-note{display:block;font-size:.8rem;color:var(--muted)}
.go{font:600 .8rem var(--body);color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;white-space:nowrap}
.iconbtn{border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;font:600 .85rem var(--body)}
.iconbtn:hover{color:var(--ink)}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:1.15rem;margin-bottom:6px}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:14px 20px;font:600 1rem var(--body);box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer}
.alldone{text-align:center;padding:14px;font-weight:600;color:var(--ok)}
.hist-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:.9rem}
.hist-row .per{flex:1;font-variant-numeric:tabular-nums}
.bar{width:110px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.hist-row .n{width:44px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
/* feuille d'édition */
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--paper);color:var(--ink);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{font-family:var(--display);font-size:1.3rem;margin:0}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font:600 .78rem var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.field{flex:1;min-width:120px}
input[type=text],input[type=url],input[type=number],input[type=time],select{font:500 1rem var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}

<div class="wrap">
  <header>
    <div>
      <h1><span>Pense intelligent</span></h1>
      <div class="today" id="today"></div>
    </div>
  </header>
  <div class="tabs" role="tablist">
    <button id="tab-now" role="tab" aria-selected="true" data-tab="now">À faire</button>
    <button id="tab-agenda" role="tab" aria-selected="false" data-tab="agenda">Agenda</button>
    <button id="tab-proj" role="tab" aria-selected="false" data-tab="proj">Suivi</button>
    <button id="tab-cust" role="tab" aria-selected="false" data-tab="cust">Clients</button>
    <button id="tab-all" role="tab" aria-selected="false" data-tab="all">Routines</button>
  </div>
  <main id="view">
    <div class="card empty"><strong>Chargement de tes routines…</strong>Tes listes apparaissent ici. Ajoute ta première routine avec le bouton « + Routine ».</div>
  </main>
  <div class="status" id="status"></div>
</div>
<button class="fab" id="fab">+ Routine</button>
<div id="sheet-root"></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const FREQ={monthly:"Chaque mois",weekly:"Chaque semaine",daily:"Chaque jour",quarterly:"Chaque trimestre"};

let db=null, routines=[], runs={}, tab="now", pending={};
let projects=[], models=[], leads=[], projFilter="leads", openP=new Set();
let customers=[], activities=[], custAct="all", custStatus="actif", custQ="";
try{tab=localStorage.getItem("pb-tab")||"now";if(tab==="hist")tab="all";projFilter=localStorage.getItem("pb-pf")||"leads"}catch(e){}

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return y+"-W"+pad(w)}
const dim=(y,m)=>new Date(y,m+1,0).getDate();

// Période courante d'une routine + date d'échéance dans cette période
function periodOf(r,ref){
  const d=ref||new Date(); d.setHours(0,0,0,0);
  const y=d.getFullYear(), m=d.getMonth();
  if(r.freq==="daily") return {key:ymd(d),due:new Date(d),label:d.getDate()+" "+MOIS[m]};
  if(r.freq==="weekly"){
    const wd=Number(r.weekday||1); const cur=d.getDay()||7;
    const due=new Date(d); due.setDate(d.getDate()+(wd-cur));
    return {key:isoWeek(d),due,label:"semaine "+isoWeek(d).split("-W")[1]};
  }
  if(r.freq==="quarterly"){
    const q=Math.floor(m/3); const fm=q*3+Number(r.monthOffset||0);
    const due=new Date(y,fm,Math.min(Number(r.day||1),dim(y,fm)));
    return {key:y+"-T"+(q+1),due,label:"T"+(q+1)+" "+y};
  }
  const due=new Date(y,m,Math.min(Number(r.day||1),dim(y,m)));
  return {key:y+"-"+pad(m+1),due,label:MOIS[m]+" "+y};
}
function prevRef(r,n){const d=new Date();d.setHours(12);
  if(r.freq==="daily")d.setDate(d.getDate()-n);
  else if(r.freq==="weekly")d.setDate(d.getDate()-7*n);
  else if(r.freq==="quarterly"){d.setDate(1);d.setMonth(d.getMonth()-3*n)}
  else{d.setDate(1);d.setMonth(d.getMonth()-n)}
  return d}
function whenText(r){
  if(r.freq==="daily")return "Chaque jour";
  if(r.freq==="weekly")return "Chaque "+JOURS[Number(r.weekday||1)%7];
  if(r.freq==="quarterly")return "Trimestre : le "+(r.day||1)+" du "+["1er","2e","3e"][Number(r.monthOffset||0)]+" mois";
  return "Le "+(r.day==1?"1er":r.day)+" de chaque mois";
}
const runId=(r,p)=>r.id+"__"+p.key;
function doneMap(r,p){return (runs[runId(r,p)]||{}).done||{}}
function progress(r,p){const dm=doneMap(r,p);const t=(r.tasks||[]);const n=t.filter(x=>dm[x.id]).length;return {n,total:t.length}}

function ring(n,total){const R=15,C=2*Math.PI*R,f=total?n/total:0;
  return `<svg class="ring" viewBox="0 0 38 38" aria-hidden="true"><circle class="bgc" cx="19" cy="19" r="${R}"/><circle class="fg" cx="19" cy="19" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}" transform="rotate(-90 19 19)"/><text x="19" y="22.5" text-anchor="middle">${n}/${total}</text></svg>`}

function routineCard(r){
  const p=periodOf(r); const dm=doneMap(r,p); const {n,total}=progress(r,p);
  const today=new Date();today.setHours(0,0,0,0);
  const late=p.due<=today && n<total;
  const pill= n===total&&total ? `<span class="pill done">Terminé</span>` : late ? `<span class="pill due">À faire depuis le ${p.due.getDate()} ${MOIS[p.due.getMonth()]}</span>` : `<span class="pill">Prévu le ${p.due.getDate()} ${MOIS[p.due.getMonth()]}</span>`;
  const items=(r.tasks||[]).map(t=>{const on=!!dm[t.id];const cid="c-"+r.id+"-"+t.id;
    return `<li class="${on?"is-done":""}"><input type="checkbox" class="chk" id="${esc(cid)}" data-r="${esc(r.id)}" data-t="${esc(t.id)}" ${on?"checked":""}>
    <label class="t-label" for="${esc(cid)}"><span class="txt">${esc(t.label)}</span>${t.note?`<span class="t-note">${esc(t.note)}</span>`:""}</label>
    ${t.link?`<a class="go" href="${esc(t.link)}" target="_blank" rel="noopener">Ouvrir ↗</a>`:""}</li>`}).join("");
  return `<article class="card"><div class="card-head">${ring(n,total)}<h2>${esc(r.title)}</h2><button class="iconbtn" data-edit="${esc(r.id)}" aria-label="Modifier ${esc(r.title)}">Modifier</button></div>
  <div class="meta">${pill}<span>${esc(whenText(r))} · ${esc(p.label)}</span></div>
  ${items?`<ul class="tasks">${items}</ul>`:`<div class="empty" style="padding:14px">Aucune tâche. Ajoute-en avec « Modifier ».</div>`}</article>`;
}

function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  const v=$("#view");
  if(!db){v.innerHTML=`<div class="card empty"><strong>Ouvre cette page depuis Claude</strong>Tes routines sont enregistrées dans ton compte. Connecte-toi pour les voir et cocher tes tâches.</div>`;return}
  $("#fab").hidden=tab==="proj";
  $("#fab").textContent=tab==="agenda"?"+ RDV":tab==="cust"?"+ Client":"+ Routine";
  if(tab==="proj"){v.innerHTML=renderClients();return}
  if(tab==="cust"){v.innerHTML=renderCustomers();return}
  if(tab==="agenda"){v.innerHTML=renderAgenda();const n=v.querySelector(".ag-now")||v.querySelector(".ag-ev");if(n&&!agScrolled){agScrolled=true;n.scrollIntoView({block:"center"})}return}
  const today=new Date();today.setHours(0,0,0,0);
  if(tab==="now"){
    const dueLeads=openLeads().filter(l=>!l.when||l.when<=endToday());
    const leadsH=planningHTML()+(dueLeads.length?`<div class="section-label">Rappels et RDV du jour</div>`+dueLeads.map(leadCard).join(""):"");
    if(!routines.length){v.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">${leadsH}<div class="card empty"><strong>Aucune routine pour l'instant</strong>Crée ta première liste via « + Routine ».</div></div>`;return}
    const due=[],soon=[],done=[];
    routines.forEach(r=>{const p=periodOf(r);const {n,total}=progress(r,p);
      if(total&&n===total)done.push(r);else if(p.due<=today)due.push(r);else soon.push(r)});
    let h=leadsH;
    if(due.length)h+=`<div class="section-label">À faire maintenant</div>`+due.map(routineCard).join("");
    else h+=`<div class="card alldone">Rien en attente. Tout est à jour.</div>`;
    if(soon.length)h+=`<div class="section-label">Plus tard dans la période</div>`+soon.map(routineCard).join("");
    if(done.length)h+=`<div class="section-label">Terminé</div>`+done.map(routineCard).join("");
    v.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">${h}</div>`;
  }else if(!routines.length){v.innerHTML=`<div class="card empty"><strong>Aucune routine pour l'instant</strong>Crée ta première liste via « + Routine ».</div>`;
  }else if(tab==="all"){
    v.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">`+routines.map(r=>`<article class="card"><div class="card-head"><h2>${esc(r.title)}</h2><button class="iconbtn" data-edit="${esc(r.id)}">Modifier</button></div><div class="meta"><span class="pill">${esc(FREQ[r.freq]||"")}</span><span>${esc(whenText(r))}${r.time?" · rappel "+esc(r.time):""} · ${(r.tasks||[]).length} tâche${(r.tasks||[]).length>1?"s":""}</span></div></article>`).join("")+histHTML()+nativeToolsHTML()+`</div>`;
  }
}
function histHTML(){
  return `<div class="section-label">Historique</div>`+routines.map(r=>{
      let rows="";for(let i=0;i<6;i++){const p=periodOf(r,prevRef(r,i));const {n,total}=progress(r,p);const pct=total?Math.round(100*n/total):0;
        rows+=`<div class="hist-row"><span class="per">${esc(p.label)}${i===0?" (en cours)":""}</span><span class="bar"><i style="width:${pct}%"></i></span><span class="n">${n}/${total}</span></div>`}
      return `<article class="card"><div class="card-head"><h2>${esc(r.title)}</h2></div>${rows}</article>`}).join("");
}

// ===== Onglet Agenda : semaine + journée heure par heure =====
const dayStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const addDays=(t,n)=>{const d=new Date(t);d.setDate(d.getDate()+n);return dayStart(d)};
const weekStart=t=>{const d=new Date(t);return addDays(d,-((d.getDay()+6)%7))};
let agDay=dayStart(Date.now()), agEvents=[], agRange="", agScrolled=false;
const AG_PX=56;
async function loadWeek(force){
  const a=weekStart(agDay);
  if(!force&&agRange===String(a))return;
  agRange=String(a);
  if(!NATIVE||agendaState!=="granted"){agEvents=[];return}
  try{agEvents=await NATIVE.listEvents(a,addDays(a,7))}catch(e){agEvents=[]}

function writeDoc(path,body){
  const prev=pending[path]||Promise.resolve();
  pending[path]=prev.then(()=>db.doc(path).set(body)).catch(e=>{$("#status").textContent="Enregistrement impossible ("+(e&&e.code||"erreur")+"). Réessaie."});
}

function saveProjectState(p){
  const st=pState(p); p.doneAt=st.finished?(p.doneAt||Date.now()):null;
  if(st.finished)$("#status").textContent="🎉 Parcours de « "+fullName(p)+" » validé.";

  const d=ld;
  const steps=d.steps.filter(t=>t.label.trim()).map(t=>({id:t.id,label:t.label.trim(),link:(t.link||"").trim(),note:(t.note||"").trim()}));
  steps.forEach(t=>{if(t.link&&!/^https?:\/\//i.test(t.link))t.link="https://"+t.link});
  if(d.kind==="model"){if(!(d.title||"").trim()){$("#l-msg").textContent="Donne un nom au parcours type.";$("#l-title").focus();return}}
  else if(!d.firstName.trim()&&!d.lastName.trim()){$("#l-msg").textContent="Indique au moins un prénom ou un nom.";$("#l-fn").focus();return}
  if(!steps.length){$("#l-msg").textContent="Ajoute au moins une étape.";return}
  if(d.kind==="project"&&d._clash&&d._clash.length&&!d._forced){d._forced=true;$("#l-msg").textContent="⚠️ Le prochain RDV tombe sur un créneau déjà occupé. Touche encore « Enregistrer » pour confirmer quand même.";$("#l-save").textContent="Enregistrer quand même";return}
  $("#l-save").disabled=true;
  try{
    if(d.kind==="model") await db.doc("models/"+d.id).set({title:d.title.trim(),steps,order:d.order||Date.now()});
    else{
      const p={...d,firstName:d.firstName.trim(),lastName:d.lastName.trim(),phone:(d.phone||"").trim(),address:(d.address||"").trim(),email:(d.email||"").trim(),steps,createdAt:d.createdAt||Date.now()};
      const keep={};steps.forEach(s=>{if((d.done||{})[s.id])keep[s.id]=d.done[s.id]});p.done=keep;
      const st=pState(p);p.doneAt=st.finished?(d.doneAt||Date.now()):null;
      await db.doc("projects/"+d.id).set(projBody(p));
      const cb=$("#l-cal");if(cb&&cb.checked&&p.rdv&&p.rdv>Date.now()&&!inAgenda("projects",p))setTimeout(()=>{const x=projects.find(o=>o.id===d.id);if(x)pushToAgenda("projects",x)},300);
      if(d.isNew&&d.leadId){const l=leads.find(x=>x.id===d.leadId);if(l)setLead(l,{status:"converted",doneAt:Date.now(),projectId:d.id})}
      if(d.isNew)projFilter="open";
    }
    closeList(); render();
  }catch(e){$("#l-save").disabled=false;$("#l-msg").textContent="Enregistrement impossible ("+(e&&e.code||"erreur")+").";}
}

// Feuille d'édition
let draft=null, confirmDel=false;
const uid=()=>Math.random().toString(36).slice(2,9);
function openSheet(r){
  if(!db){$("#status").textContent="Connecte-toi pour créer des routines.";return}
  draft=r?JSON.parse(JSON.stringify(r)):{id:"r"+uid(),title:"",freq:"monthly",day:1,weekday:1,monthOffset:0,time:"09:00",tasks:[{id:uid(),label:"",link:"",note:""}],order:Date.now()};
  draft.isNew=!r; confirmDel=false; drawSheet();
}
function drawSheet(){
  const d=draft; const root=$("#sheet-root");
  if(!d){root.innerHTML="";return}
  const whenFields = d.freq==="weekly" ? `<div class="field"><label for="f-wd">Jour</label><select id="f-wd">${[1,2,3,4,5,6,7].map(i=>`<option value="${i}" ${Number(d.weekday)===i?"selected":""}>${JOURS[i%7]}</option>`).join("")}</select></div>`
    : d.freq==="daily" ? "" :
    `<div class="field"><label for="f-day">Jour du mois</label><input type="number" id="f-day" min="1" max="31" value="${esc(d.day)}"></div>`+
    (d.freq==="quarterly"?`<div class="field"><label for="f-mo">Mois du trimestre</label><select id="f-mo">${["1er","2e","3e"].map((l,i)=>`<option value="${i}" ${Number(d.monthOffset)===i?"selected":""}>${l} mois</option>`).join("")}</select></div>`:"");
  root.innerHTML=`<div class="sheet-bg" id="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
   <h3 id="sheet-title">${d.isNew?"Nouvelle routine":"Modifier la routine"}</h3>
   <div class="field"><label for="f-title">Nom</label><input type="text" id="f-title" placeholder="Ex. Début de mois" value="${esc(d.title)}"></div>
   <div class="row"><div class="field"><label for="f-freq">Fréquence</label><select id="f-freq">${Object.entries(FREQ).map(([k,l])=>`<option value="${k}" ${d.freq===k?"selected":""}>${l}</option>`).join("")}</select></div>${whenFields}
   <div class="field"><label for="f-time">Heure du rappel</label><input type="time" id="f-time" value="${esc(d.time||"09:00")}"></div></div>
   <div class="field"><label>Tâches</label><div style="display:flex;flex-direction:column;gap:8px">${d.tasks.map((t,i)=>`<div class="task-edit">
     <div class="row"><input type="text" id="tl-${t.id}" data-i="${i}" data-k="label" placeholder="Tâche, ex. Déclaration URSSAF" value="${esc(t.label)}"><button class="iconbtn" data-up="${i}" aria-label="Monter">↑</button><button class="iconbtn" data-rm="${i}" aria-label="Supprimer la tâche">✕</button></div>
     <input type="url" id="tk-${t.id}" data-i="${i}" data-k="link" placeholder="Lien (facultatif), ex. https://www.autoentrepreneur.urssaf.fr" value="${esc(t.link)}">
     <input type="text" id="tn-${t.id}" data-i="${i}" data-k="note" placeholder="Note (facultatif)" value="${esc(t.note)}"></div>`).join("")}
     <button class="btn" id="add-task">+ Ajouter une tâche</button></div></div>
   <div class="btns"><button class="btn primary" id="save">Enregistrer</button><button class="btn" id="cancel">Annuler</button>
   ${d.isNew?"":`<button class="btn danger" id="del">${confirmDel?"Confirmer la suppression":"Supprimer"}</button>`}</div>
   <div class="status" id="sheet-msg"></div></div></div>`;
  const s=$("#sheet-bg");
  s.addEventListener("click",ev=>{if(ev.target===s)closeSheet()});
  s.querySelectorAll("[data-k]").forEach(inp=>inp.addEventListener("input",()=>{d.tasks[inp.dataset.i][inp.dataset.k]=inp.value}));
  $("#f-title").addEventListener("input",ev=>d.title=ev.target.value);
  $("#f-freq").addEventListener("change",ev=>{d.freq=ev.target.value;drawSheet()});
  $("#f-time").addEventListener("input",ev=>d.time=ev.target.value);
  const fd=$("#f-day");if(fd)fd.addEventListener("input",ev=>d.day=Math.max(1,Math.min(31,Number(ev.target.value)||1)));
  const fw=$("#f-wd");if(fw)fw.addEventListener("change",ev=>d.weekday=Number(ev.target.value));
  const fm=$("#f-mo");if(fm)fm.addEventListener("change",ev=>d.monthOffset=Number(ev.target.value));
  s.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{d.tasks.splice(Number(b.dataset.rm),1);drawSheet()}));
  s.querySelectorAll("[data-up]").forEach(b=>b.addEventListener("click",()=>{const i=Number(b.dataset.up);if(i>0){[d.tasks[i-1],d.tasks[i]]=[d.tasks[i],d.tasks[i-1]];drawSheet()}}));
  $("#add-task").addEventListener("click",()=>{d.tasks.push({id:uid(),label:"",link:"",note:""});drawSheet();const last=d.tasks[d.tasks.length-1];const el=document.getElementById("tl-"+last.id);if(el)el.focus()});
  $("#cancel").addEventListener("click",closeSheet);
  $("#save").addEventListener("click",saveSheet);
  const del=$("#del");if(del)del.addEventListener("click",async()=>{
    if(!confirmDel){confirmDel=true;drawSheet();return}
    try{await db.doc("routines/"+d.id).delete();closeSheet()}catch(e){$("#sheet-msg").textContent="Suppression impossible. Réessaie."}});
}
function closeSheet(){draft=null;drawSheet()}
async function saveSheet(){
  const d=draft;
  if(!d.title.trim()){$("#sheet-msg").textContent="Donne un nom à ta routine.";$("#f-title").focus();return}
  const tasks=d.tasks.filter(t=>t.label.trim()).map(t=>({id:t.id,label:t.label.trim(),link:(t.link||"").trim(),note:(t.note||"").trim()}));
  tasks.forEach(t=>{if(t.link&&!/^https?:\/\//i.test(t.link))t.link="https://"+t.link});
  const body={title:d.title.trim(),freq:d.freq,day:Number(d.day)||1,weekday:Number(d.weekday)||1,monthOffset:Number(d.monthOffset)||0,time:d.time||"09:00",tasks,order:d.order||Date.now()};
  $("#save").disabled=true;
  try{await db.doc("routines/"+d.id).set(body);closeSheet()}catch(e){$("#save").disabled=false;$("#sheet-msg").textContent="Enregistrement impossible ("+(e&&e.code||"erreur")+").";}
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(draft)closeSheet();else if(ld)closeList();else if(lead)closeLead();else if(cs)closeCust();else $("#sheet-root").innerHTML=""}});

// Date du jour + rafraîchissement à minuit
function stamp(){const d=new Date();$("#today").textContent=JOURS[d.getDay()]+" "+d.getDate()+" "+MOIS[d.getMonth()]+" "+d.getFullYear()}
stamp(); let lastDay=new Date().getDate();
setInterval(()=>{if(new Date().getDate()!==lastDay){lastDay=new Date().getDate();stamp();render()}},60000);
render();

(async()=>{
  try{db=await window.claude?.use?.("db")}catch(e){db=null}
  if(!db){render();return}
  loadAgenda();
  db.collection("routines").orderBy("order").onSnapshot(s=>{routines=s.docs.map(x=>({id:x.id,...x.data()}));render()},e=>{$("#status").textContent="Connexion perdue. Recharge la page."});
  db.collection("projects").onSnapshot(s=>{projects=s.docs.map(x=>{const b=x.data();return {id:x.id,...b,done:{...(b.done||{})},steps:(b.steps||[]).map(t=>({...t}))}});render()},()=>{});
  db.collection("leads").onSnapshot(s=>{leads=s.docs.map(x=>({id:x.id,...x.data()}));render()},()=>{});
  db.collection("customers").onSnapshot(s=>{customers=s.docs.map(x=>({id:x.id,...x.data()}));render()},()=>{});
  db.collection("activities").orderBy("order").onSnapshot(s=>{activities=s.docs.map(x=>({id:x.id,...x.data()}));render()},()=>{});
  db.collection("models").orderBy("order").onSnapshot(s=>{models=s.docs.map(x=>({id:x.id,...x.data()}));render()},()=>{});
  db.collection("runs").onSnapshot(s=>{const m={};s.docs.forEach(x=>{const b=x.data();m[x.id]={routineId:b.routineId,period:b.period,done:{...(b.done||{})}}});runs=m;render()},()=>{});
})();
})();
</script>
