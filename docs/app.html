<!--PB_APP_MARKER-->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));padding-bottom:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
body{margin:0;font:14px system-ui,sans-serif;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.PB_VERSION=15;window.PB_UPDATE_URL="https://houssardbenj-coder.github.io/gestion-client/";</script>
<script>window.PB_SEED={};</script>
<script>// Base de données locale : remplace le stockage Claude par le stockage du téléphone.
// Même interface que la page Claude (collection / doc / onSnapshot / set / delete),
// donc l'interface fonctionne sans modification.
// Chaque collection est rangée sous sa propre clé (pb-c-<nom>) : une modification
// ne réécrit que sa collection, ce qui reste rapide même avec des années de tâches.
(function(){
  const OLD_KEY="pb-data-v1", PREFIX="pb-c-";
  let data={};
  const load=()=>{const out={};
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
      if(k&&k.startsWith(PREFIX)){try{out[k.slice(PREFIX.length)]=JSON.parse(localStorage.getItem(k))||{}}catch(e){}}}
    return out};
  try{
    data=load();
    const old=localStorage.getItem(OLD_KEY);
    if(old){ // ancien format (une seule clé) : on le découpe une fois
      const o=JSON.parse(old)||{};
      for(const c of Object.keys(o)){if(!data[c]){data[c]=o[c];localStorage.setItem(PREFIX+c,JSON.stringify(o[c]))}}
      localStorage.removeItem(OLD_KEY);
    }
    if(!Object.keys(data).length&&window.PB_SEED&&Object.keys(window.PB_SEED).length){
      data=JSON.parse(JSON.stringify(window.PB_SEED));Object.keys(data).forEach(persist);
    }
  }catch(e){console.error("Lecture des données impossible",e)}
  const subs={};

  function persist(c){try{localStorage.setItem(PREFIX+c,JSON.stringify(data[c]||{}))}catch(e){console.error("Sauvegarde locale impossible",e);
    const s=document.getElementById("status");if(s)s.textContent="⚠️ Mémoire de l'appli pleine : fais une sauvegarde puis contacte-moi.";}}
  function snap(c,order){
    let docs=Object.entries(data[c]||{}).map(([id,b])=>({id,exists:true,metadata:{fromCache:false,hasPendingWrites:false},data:()=>JSON.parse(JSON.stringify(b))}));
    if(order)docs.sort((a,b)=>{const x=a.data()[order],y=b.data()[order];return (x??Infinity)-(y??Infinity)});
    return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[]};
  }
  function fire(c){(subs[c]||[]).forEach(s=>s.cb(snap(c,s.order)));window.dispatchEvent(new Event("pb-data-changed"))}

  const db={
    collection(c){
      const q={_order:null,
        orderBy(f){const n=Object.create(q);n._order=f;return n},
        where(){return this},limit(){return this},
        async get(){return snap(c,this._order)},
        onSnapshot(cb){const s={cb,order:this._order};(subs[c]=subs[c]||[]).push(s);setTimeout(()=>cb(snap(c,s.order)));return()=>{subs[c]=(subs[c]||[]).filter(x=>x!==s)}},
        doc(id){return db.doc(c+"/"+(id||Math.random().toString(36).slice(2,11)))}};
      return q;
    },
    doc(path){
      const [c,id]=path.split("/");
      return {id,path,
        async get(){const b=(data[c]||{})[id];return {id,exists:!!b,data:()=>b&&JSON.parse(JSON.stringify(b))}},
        async set(body){(data[c]=data[c]||{})[id]=JSON.parse(JSON.stringify(body));persist(c);fire(c)},
        async update(body){if(!(data[c]||{})[id])throw {code:"invalid_argument"};Object.assign(data[c][id],JSON.parse(JSON.stringify(body)));persist(c);fire(c)},
        async delete(){if(data[c]){delete data[c][id];persist(c);fire(c)}}};
    }
  };

  window.PB_store={
    all:()=>data,
    sizeKB:()=>{let n=0;for(const c of Object.keys(data))n+=(localStorage.getItem(PREFIX+c)||"").length;return Math.round(n*2/1024)},
    exportJSON:()=>JSON.stringify({app:"pense-bete",version:1,exportedAt:new Date().toISOString(),data},null,1),
    importJSON(text){
      const o=JSON.parse(text);
      if(!o||o.app!=="pense-bete"||typeof o.data!=="object")throw new Error("format");
      Object.keys(data).forEach(c=>localStorage.removeItem(PREFIX+c));
      data=o.data;Object.keys(data).forEach(persist);Object.keys(subs).forEach(fire);
    }
  };
  window.claude={use:async n=>n==="db"?db:null};
})();
</script>

<script>// Fonctions propres au téléphone : alarmes, agenda Android, sauvegarde, bouton retour.
(function(){
  const C=window.Capacitor;
  if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
  // registerPlugin vient du module Capacitor inclus dans la page (capacitorExports) ; le pont natif seul ne le fournit pas
  const REG=(window.capacitorExports&&window.capacitorExports.registerPlugin)||(C.registerPlugin&&C.registerPlugin.bind(C));
  if(!REG){console.error("Capacitor : registerPlugin introuvable");return}
  const LN=REG("LocalNotifications");
  const CAL=REG("CapacitorCalendar");
  const FS=REG("Filesystem");
  const SH=REG("Share");
  const APP=REG("App");
  const pad=n=>String(n).padStart(2,"0");
  const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const dim=(y,m)=>new Date(y,m+1,0).getDate();
  function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return y+"-W"+pad(w)}
  function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)%2000000000+1}
  const name=x=>[x.firstName,x.lastName].filter(Boolean).join(" ")||x.title||"Sans nom";
  let exact=false;

  // Prochaines échéances d'une routine : [{at:Date, key:période}]
  function occurrences(r){
    const [hh,mm]=String(r.time||"09:00").split(":").map(Number);
    const now=new Date(), out=[];
    const y=now.getFullYear(), m=now.getMonth();
    if(r.freq==="daily"){for(let k=0;k<31;k++){const d=new Date(y,m,now.getDate()+k,hh,mm);out.push({at:d,key:ymd(d)})}}
    else if(r.freq==="weekly"){const wd=Number(r.weekday||1),cur=now.getDay()||7;
      for(let k=0;k<26;k++){const d=new Date(y,m,now.getDate()+(wd-cur)+7*k,hh,mm);out.push({at:d,key:isoWeek(d)})}}
    else if(r.freq==="quarterly"){const qs=Math.floor(m/3)*3;
      for(let k=0;k<5;k++){const mo=qs+3*k+Number(r.monthOffset||0);const d=new Date(y,mo,1,hh,mm);d.setDate(Math.min(Number(r.day||1),dim(d.getFullYear(),d.getMonth())));
        const q=Math.floor((qs+3*k)%12/3)+1, qy=new Date(y,qs+3*k,1).getFullYear();out.push({at:d,key:qy+"-T"+q})}}
    else if(r.freq==="yearly"){for(let k=0;k<3;k++){const yy=y+k,mo=Number(r.month||0);const d=new Date(yy,mo,Math.min(Number(r.day||1),dim(yy,mo)),hh,mm);out.push({at:d,key:String(yy)})}}
    else{for(let k=0;k<13;k++){const d=new Date(y,m+k,1,hh,mm);d.setDate(Math.min(Number(r.day||1),dim(d.getFullYear(),d.getMonth())));out.push({at:d,key:d.getFullYear()+"-"+pad(d.getMonth()+1)})}}
    return out;
  }

  function buildNotifications(){
    const D=window.PB_store.all(), now=Date.now(), list=[];
    Object.entries(D.routines||{}).forEach(([id,r])=>{
      const tasks=r.tasks||[];
      occurrences(r).forEach(o=>{
        if(o.at.getTime()<=now)return;
        const run=(D.runs||{})[id+"__"+o.key];const done=run&&run.done||{};
        if(tasks.length&&tasks.every(t=>done[t.id]))return;
        const body=tasks.length?tasks.length+" tâche"+(tasks.length>1?"s":"")+" : "+tasks.slice(0,3).map(t=>t.label).join(", ")+(tasks.length>3?"…":""):"Ouvre ta checklist";
        list.push({key:"r:"+id+":"+o.key,at:o.at,title:"📋 "+(r.title||"Routine"),body});
      });
    });
    Object.entries(D.leads||{}).forEach(([id,l])=>{
      if((l.status&&l.status!=="open")||!l.when)return;
      if(l.type==="rdv"){const at=l.when-3600e3;if(at>now)list.push({key:"l:"+id+":"+l.when,at:new Date(at),title:"📅 RDV dans 1 h : "+name(l),body:[l.address,l.phone].filter(Boolean).join(" · ")||"Rendez-vous"});}
      else if(l.when>now)list.push({key:"l:"+id+":"+l.when,at:new Date(l.when),title:"📞 À rappeler : "+name(l),body:[l.phone,l.reason].filter(Boolean).join(" · ")||"Rappel client"});
    });
    Object.entries(D.appts||{}).forEach(([id,a])=>{
      if(a.done||!a.when)return;const at=a.when-3600e3;const c=a.customerId&&(D.customers||{})[a.customerId];const who=c?name(c):name(a);
      if(at>now)list.push({key:"a:"+id+":"+a.when,at:new Date(at),title:"📅 RDV dans 1 h : "+who,body:[a.address||(c&&c.address),a.phone||(c&&c.phone)].filter(Boolean).join(" · ")||"Rendez-vous"});
    });
    Object.entries(D.projects||{}).forEach(([id,p])=>{
      if(!p.rdv)return;const at=p.rdv-3600e3;
      if(at>now)list.push({key:"p:"+id+":"+p.rdv,at:new Date(at),title:"📅 RDV dans 1 h : "+name(p),body:[p.address,p.phone].filter(Boolean).join(" · ")||"Rendez-vous client"});
    });
    // séances régulières des clients (calculées par l'interface)
    try{(window.PB_extraNotifs?window.PB_extraNotifs():[]).forEach(n=>{if(n.at.getTime()>now)list.push(n)})}catch(e){}
    return list.sort((a,b)=>a.at-b.at).slice(0,400);
  }

  let timer=null, running=false, again=false;
  function reschedule(){clearTimeout(timer);timer=setTimeout(doReschedule,800)}
  async function doReschedule(){
    if(running){again=true;return}
    running=true;
    try{
      const pend=await LN.getPending();
      if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
      const list=buildNotifications();
      if(list.length)await LN.schedule({notifications:list.map(n=>({id:hash(n.key),title:n.title,body:n.body,channelId:"rappels",
        schedule:{at:n.at,allowWhileIdle:true},isExactNotification:exact,foreground:true}))});
    }catch(e){console.error("Programmation des rappels impossible",e)}
    running=false; if(again){again=false;reschedule()}
  }

  async function setup(){
    try{await LN.createChannel({id:"rappels",name:"Rappels",description:"Routines, rendez-vous et rappels clients",importance:5,visibility:1,vibration:true})}catch(e){}
    try{const p=await LN.checkPermissions();if(p.display!=="granted")await LN.requestPermissions()}catch(e){}
    try{const s=await LN.checkExactNotificationSetting();exact=s.exact_alarm==="granted"}catch(e){}
    reschedule();
  }

  // ===== Mise à jour automatique de l'interface depuis GitHub =====
  // version.json : {"version": N, "notes": "..."} ; app.html : la nouvelle interface complète.
  // Elle est copiée dans le stockage de l'appli puis chargée à la place de celle d'origine
  // (même adresse interne, donc les données restent). Un nouvel APK installé reprend la main.
  const WV=REG("WebView");
  let checking=false,lastCheck=0;
  async function checkUpdate(manual){
    const base=window.PB_UPDATE_URL;
    if(!base||checking)return manual?"none":undefined;
    checking=true;lastCheck=Date.now();
    try{
      const r=await fetch(base+"version.json?t="+Date.now(),{cache:"no-store"});
      if(!r.ok)throw new Error("http "+r.status);
      const info=await r.json();
      if(!(Number(info.version)>Number(window.PB_VERSION||0)))return "uptodate";
      if(!manual&&document.querySelector(".sheet-bg"))return "later"; // une fiche est ouverte : on attend
      const page=await (await fetch(base+"app.html?v="+info.version,{cache:"no-store"})).text();
      if(!page.includes("<!--PB_APP_MARKER-->")||!page.includes("window.PB_VERSION="+Number(info.version)+";"))throw new Error("fichier incomplet");
      const dir="live/"+Number(info.version);
      await FS.writeFile({path:dir+"/index.html",data:page,directory:"DATA",encoding:"utf8",recursive:true});
      const {uri}=await FS.getUri({path:dir,directory:"DATA"});
      try{localStorage.setItem("pb-just-updated",JSON.stringify({v:info.version,notes:info.notes||""}))}catch(e){}
      WV.setServerBasePath({path:decodeURIComponent(uri.replace(/^file:\/\//,""))});
      WV.persistServerBasePath();
      return "updated";
    }catch(e){console.error("Mise à jour impossible",e);window.PB_lastUpdateError=String(e&&(e.message||e.errorMessage)||e);return "error"}
    finally{checking=false}
  }
  document.addEventListener("DOMContentLoaded",()=>{
    let j=null;try{j=JSON.parse(localStorage.getItem("pb-just-updated")||"null");localStorage.removeItem("pb-just-updated")}catch(e){}
    if(j)setTimeout(()=>{const s=document.getElementById("status");if(s)s.textContent="✓ Appli mise à jour (version "+j.v+")"+(j.notes?" : "+j.notes:"")},800);
    setTimeout(()=>checkUpdate(false),2500);
  });

  window.addEventListener("pb-data-changed",reschedule);
  APP.addListener("resume",async()=>{
    try{const s=await LN.checkExactNotificationSetting();exact=s.exact_alarm==="granted"}catch(e){}
    window.dispatchEvent(new Event("pb-resume"));reschedule();
    if(Date.now()-lastCheck>2*60e3)checkUpdate(false);
  });
  APP.addListener("backButton",()=>{
    if(document.querySelector(".sheet-bg"))document.dispatchEvent(new KeyboardEvent("keydown",{key:"Escape"}));
    else APP.exitApp();
  });

  async function canWrite(){
    let s=(await CAL.checkPermission({scope:"writeCalendar"})).result;
    if(s!=="granted")s=(await CAL.requestFullCalendarAccess()).result;
    return s==="granted";
  }

  // Agenda cible : celui choisi dans les réglages, sinon l'agenda principal du compte Gmail
  async function chosenCalendar(){
    let id="";try{id=localStorage.getItem("pb-cal-id")||""}catch(e){}
    let list=[];try{list=(await CAL.listCalendars()).result||[]}catch(e){return id||undefined}
    if(id&&list.some(c=>String(c.id)===id))return id;
    const google=list.filter(c=>/@(gmail|googlemail)\.com$/i.test(c.accountName||""));
    const best=google.find(c=>(c.ownerAccount||"")===(c.accountName||"")&&(c.title===c.accountName||c.internalTitle===c.accountName))
      ||google.find(c=>(c.ownerAccount||"")===(c.accountName||""))||google[0];
    if(best){id=String(best.id);try{localStorage.setItem("pb-cal-id",id)}catch(e){}return id}
    return undefined;
  }

  window.PB_native={
    async agendaPermission(){try{return (await CAL.checkPermission({scope:"readCalendar"})).result}catch(e){return "denied"}},
    async askAgenda(){try{return (await CAL.requestFullCalendarAccess()).result}catch(e){return "denied"}},
    async listEvents(from,to){const r=await CAL.listEventsInRange({from,to});return (r.result||[]).map(e=>({id:e.id,title:e.title,startDate:e.startDate,endDate:e.endDate,location:e.location,isAllDay:e.isAllDay}))},
    // Crée l'événement dans l'agenda Google (ou le met à jour s'il existe déjà : calId)
    async addEvent({title,start,end,minutes,location,description,calId}){
      if(!(await canWrite()))throw new Error("denied");
      const calendarId=await chosenCalendar();
      const body={title,startDate:start,endDate:end&&end>start?end:start+3600e3,location,description,alerts:[-(minutes||60)]};
      if(calId&&calId!=="ok"){
        try{await CAL.modifyEvent({id:String(calId),...body});return calId}catch(e){/* supprimé de l'agenda : on le recrée */}
      }
      const r=await CAL.createEvent(calendarId?{...body,calendarId}:body);
      return r&&r.id;
    },
    async deleteEvent(id){if(!(await canWrite()))throw new Error("denied");await CAL.deleteEvent({id:String(id)})},
    async calendars(){
      if(!(await canWrite()))return [];
      const r=await CAL.listCalendars();
      return (r.result||[]).map(c=>({id:c.id,title:c.title||c.internalTitle||c.accountName||"Agenda",account:c.accountName||""}));
    },
    chosenCalendarId:()=>{try{return localStorage.getItem("pb-cal-id")||""}catch(e){return ""}},
    setCalendar(id){try{localStorage.setItem("pb-cal-id",id)}catch(e){}},
    async exportData(){
      const file="pense-intelligent-sauvegarde-"+ymd(new Date())+".json";
      const w=await FS.writeFile({path:file,data:window.PB_store.exportJSON(),directory:"CACHE",encoding:"utf8"});
      await SH.share({title:"Sauvegarde Pense intelligent",text:"Sauvegarde de mes données Pense intelligent",files:[w.uri],dialogTitle:"Où enregistrer la sauvegarde ?"});
    },
    version:()=>window.PB_VERSION||0,
    checkUpdate:()=>checkUpdate(true),
    async importData(text){window.PB_store.importJSON(text);reschedule()},
    async openAlarmSettings(){
      try{await LN.requestPermissions()}catch(e){}
      try{const s=await LN.changeExactNotificationSetting();exact=s.exact_alarm==="granted"}catch(e){}
      reschedule();
    }
  };
  setup();
})();
</script>

<div class="wrap">
  <header>
    <div>
      <h1><span>Pense intelligent</span></h1>
      <div class="today" id="today"></div>
    </div>
  </header>
  <div class="tabs" role="tablist">
    <button id="tab-now" role="tab" aria-selected="true" data-tab="now">À faire</button>
    <button id="tab-agenda" role="tab" aria-selected="false" data-tab="agenda">Agenda</button>
    <button id="tab-proj" role="tab" aria-selected="false" data-tab="proj">Suivi</button>
    <button id="tab-cust" role="tab" aria-selected="false" data-tab="cust">Clients</button>
    <button id="tab-all" role="tab" aria-selected="false" data-tab="all">Routines</button>
  </div>
  <main id="view">
    <div class="card empty"><strong>Chargement de tes routines…</strong>Tes listes apparaissent ici. Ajoute ta première routine avec le bouton « + Routine ».</div>
  </main>
  <div class="status" id="status"></div>
</div>
<button class="fab" id="fab">+ Routine</button>
<div id="sheet-root"></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const FREQ={monthly:"Chaque mois",weekly:"Chaque semaine",daily:"Chaque jour",quarterly:"Chaque trimestre",yearly:"Chaque année"};

let db=null, routines=[], runs={}, tab="now", pending={};
let projects=[], models=[], leads=[], projFilter="leads", openP=new Set();
let customers=[], activities=[], custAct="all", custStatus="actif", custQ="";
let appts=[], tasks=[], openTk=new Set();
try{tab=localStorage.getItem("pb-tab")||"now";if(tab==="hist")tab="all";projFilter=localStorage.getItem("pb-pf")||"leads"}catch(e){}

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return y+"-W"+pad(w)}
const dim=(y,m)=>new Date(y,m+1,0).getDate();

// Période courante d'une routine + date d'échéance dans cette période
function periodOf(r,ref){
  const d=ref||new Date(); d.setHours(0,0,0,0);
  const y=d.getFullYear(), m=d.getMonth();
  if(r.freq==="daily") return {key:ymd(d),due:new Date(d),label:d.getDate()+" "+MOIS[m]};
  if(r.freq==="weekly"){
    const wd=Number(r.weekday||1); const cur=d.getDay()||7;
    const due=new Date(d); due.setDate(d.getDate()+(wd-cur));
    return {key:isoWeek(d),due,label:"semaine "+isoWeek(d).split("-W")[1]};
  }
  if(r.freq==="quarterly"){
    const q=Math.floor(m/3); const fm=q*3+Number(r.monthOffset||0);
    const due=new Date(y,fm,Math.min(Number(r.day||1),dim(y,fm)));
    return {key:y+"-T"+(q+1),due,label:"T"+(q+1)+" "+y};
  }
  if(r.freq==="yearly"){
    const mo=Number(r.month||0);const due=new Date(y,mo,Math.min(Number(r.day||1),dim(y,mo)));
    return {key:String(y),due,label:"année "+y};
  }
  const due=new Date(y,m,Math.min(Number(r.day||1),dim(y,m)));
  return {key:y+"-"+pad(m+1),due,label:MOIS[m]+" "+y};
}
function prevRef(r,n){const d=new Date();d.setHours(12);
  if(r.freq==="daily")d.setDate(d.getDate()-n);
  else if(r.freq==="weekly")d.setDate(d.getDate()-7*n);
  else if(r.freq==="quarterly"){d.setDate(1);d.setMonth(d.getMonth()-3*n)}
  else if(r.freq==="yearly"){d.setDate(1);d.setFullYear(d.getFullYear()-n)}
  else{d.setDate(1);d.setMonth(d.getMonth()-n)}
  return d}
function whenText(r){
  if(r.freq==="daily")return "Chaque jour";
  if(r.freq==="weekly")return "Chaque "+JOURS[Number(r.weekday||1)%7];
  if(r.freq==="yearly")return "Chaque année le "+(r.day==1?"1er":(r.day||1))+" "+MOIS[Number(r.month||0)];
  if(r.freq==="quarterly")return "Trimestre : le "+(r.day||1)+" du "+["1er","2e","3e"][Number(r.monthOffset||0)]+" mois";
  return "Le "+(r.day==1?"1er":r.day)+" de chaque mois";
}
const runId=(r,p)=>r.id+"__"+p.key;
function doneMap(r,p){return (runs[runId(r,p)]||{}).done||{}}
function progress(r,p){const dm=doneMap(r,p);const t=(r.tasks||[]);const n=t.filter(x=>dm[x.id]).length;return {n,total:t.length}}

function ring(n,total){const R=15,C=2*Math.PI*R,f=total?n/total:0;
  return `<svg class="ring" viewBox="0 0 38 38" aria-hidden="true"><circle class="bgc" cx="19" cy="19" r="${R}"/><circle class="fg" cx="19" cy="19" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}" transform="rotate(-90 19 19)"/><text x="19" y="22.5" text-anchor="middle">${n}/${total}</text></svg>`}

function routineCard(r){
  const p=periodOf(r); const dm=doneMap(r,p); const {n,total}=progress(r,p);
  const today=new Date();today.setHours(0,0,0,0);
  const late=p.due<=today && n<total;
  const pill= n===total&&total ? `<span class="pill done">Terminé</span>` : late ? `<span class="pill due">À faire depuis le ${p.due.getDate()} ${MOIS[p.due.getMonth()]}</span>` : `<span class="pill">Prévu le ${p.due.getDate()} ${MOIS[p.due.getMonth()]}</span>`;
  const items=(r.tasks||[]).map(t=>{const on=!!dm[t.id];const cid="c-"+r.id+"-"+t.id;
    return `<li class="${on?"is-done":""}"><input type="checkbox" class="chk" id="${esc(cid)}" data-r="${esc(r.id)}" data-t="${esc(t.id)}" ${on?"checked":""}>
    <label class="t-label" for="${esc(cid)}"><span class="txt">${esc(t.label)}</span>${t.note?`<span class="t-note">${esc(t.note)}</span>`:""}</label>
    ${t.link?`<a class="go" href="${esc(t.link)}" target="_blank" rel="noopener">Ouvrir ↗</a>`:""}</li>`}).join("");
  return `<article class="card"><div class="card-head">${ring(n,total)}<h2>${esc(r.title)}</h2><button class="iconbtn" data-edit="${esc(r.id)}" aria-label="Modifier ${esc(r.title)}">Modifier</button></div>
  <div class="meta">${pill}<span>${esc(whenText(r))} · ${esc(p.label)}</span></div>
  ${items?`<ul class="tasks">${items}</ul>`:`<div class="empty" style="padding:14px">Aucune tâche. Ajoute-en avec « Modifier ».</div>`}</article>`;
}

function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  const v=$("#view");
  if(!db){v.innerHTML=`<div class="card empty"><strong>Ouvre cette page depuis Claude</strong>Tes routines sont enregistrées dans ton compte. Connecte-toi pour les voir et cocher tes tâches.</div>`;return}
  $("#fab").hidden=tab==="proj";
  $("#fab").textContent=tab==="agenda"?"+ RDV":tab==="cust"?"+ Client":"+ Routine";
  if(tab==="proj"){v.innerHTML=renderClients();return}
  if(tab==="cust"){v.innerHTML=renderCustomers();return}
  if(tab==="agenda"){v.innerHTML=renderAgenda();const n=v.querySelector(".ag-now")||v.querySelector(".ag-ev");if(n&&!agScrolled){agScrolled=true;n.scrollIntoView({block:"center"})}return}
  const today=new Date();today.setHours(0,0,0,0);
  if(tab==="now"){
    const leadsH=todayHTML()+tasksHTML()+resumeHTML()+weekHTML();
    if(!routines.length){v.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">${leadsH}<div class="card empty"><strong>Aucune routine pour l'instant</strong>Crée ta première liste via « + Routine ».</div></div>`;return}
    const due=[],soon=[],done=[];
    routines.forEach(r=>{const p=periodOf(r);const {n,total}=progress(r,p);
      if(total&&n===total)done.push(r);else if(p.due<=today)due.push(r);else soon.push(r)});
    let h=leadsH;
    if(due.length)h+=`<div class="section-label">À faire maintenant</div>`+due.map(routineCard).join("");
    else h+=`<div class="card alldone">Rien en attente. Tout est à jour.</div>`;
    if(soon.length)h+=`<div class="section-label">Plus tard dans la période</div>`+soon.map(routineCard).join("");

async function applyMove(ref,when,scope){

  const warn=clash.length?" ⚠️ Chevauche « "+clash[0].title+" ».":"";
  try{
    if(it.k==="occ"){const o=it.o;
      if(!scope){askOccScope(o,when);return}
      if(scope==="one"){ // un RDV ponctuel remplace la séance de ce jour
        const a={id:"r"+uid(),customerId:o.c.id,when,dur:o.dur,note:"Séance déplacée (au lieu du "+fmtDT(o.t)+")",createdAt:Date.now()};

function busyItems(a,b,events,selfKind,selfId){
  const items=[],mine=new Set();
  leads.forEach(l=>{const self=selfKind==="leads"&&l.id===selfId;if(l.calId)mine.add(String(l.calId));
    if(!self&&(l.status==="open"||!l.status)&&l.when&&l.when>=a&&l.when<b)items.push({t:l.when,end:l.when+durOf("leads",l)*6e4,title:(l.type==="rdv"?"RDV ":"Rappel ")+fullName(l),kind:l.type==="rdv"?"rdv":"call"})});
  projects.forEach(p=>{const self=selfKind==="projects"&&p.id===selfId;if(p.calId)mine.add(String(p.calId));
    if(!self&&p.rdv&&p.rdv>=a&&p.rdv<b)items.push({t:p.rdv,end:p.rdv+durOf("projects",p)*6e4,title:"RDV "+fullName(p),kind:"rdv"})});
  appts.forEach(x=>{const self=selfKind==="appts"&&x.id===selfId;if(x.calId)mine.add(String(x.calId));
    if(!self&&!x.done&&x.when&&x.when>=a&&x.when<b)items.push({t:x.when,end:x.when+durOf("appts",x)*6e4,title:"RDV "+apptName(x),kind:"rdv"})});
  occCalIds().forEach(id=>mine.add(id));
  occList(a,b).forEach(o=>items.push({t:o.t,end:o.end,title:"🔁 "+occName(o),kind:"occ"}));
  (events||[]).forEach(e=>{const end=e.endDate||e.startDate+3600e3;if(!mine.has(String(e.id))&&e.startDate<b&&end>a)items.push({t:e.startDate,end,title:e.title||"(sans titre)",kind:"cal",allDay:e.isAllDay})});

  const r=grid.getBoundingClientRect();const mins=Number(grid.dataset.h0)*60+Math.floor((e.clientY-r.top)/Number(grid.dataset.px)*2)*30;
  pkSet(atMins(pk.day,mins));return true;
}
// « mardi pro 14h30 », « demain 9h », « jeudi dans 2 semaines », « le 12/11 à 10h »
function parseQuand(txt,ref){
  const s=fold(txt).replace(/[’']/g," "),today=dayStart(ref||Date.now());let day=null,mins=null;
  const tm=s.match(/\b(\d{1,2})\s*(?:h|:)\s*(\d{2})?/)||(/\bmidi\b/.test(s)?[0,"12","0"]:null);
  if(tm){const h=Number(tm[1]),m=Number(tm[2]||0);if(h<24&&m<60)mins=h*60+m}
  const dm=s.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
  if(dm){const y0=new Date(today).getFullYear(),y=dm[3]?Number(dm[3].length===2?"20"+dm[3]:dm[3]):y0;const d=new Date(y,Number(dm[2])-1,Number(dm[1]));
    if(!dm[3]&&d.getTime()<today)d.setFullYear(y0+1);if(!isNaN(d))day=dayStart(d)}
  else if(/apres[- ]?demain/.test(s))day=addDays(today,2);
  else if(/\bdemain\b/.test(s))day=addDays(today,1);
  else if(/\baujourd|\bauj\b|\bce (matin|soir|midi)\b|\bcet apres/.test(s))day=today;
  else{const w=s.match(/\b(lun|mar|mer|jeu|ven|sam|dim)[a-z]*\b/);
    if(w){const wd={lun:1,mar:2,mer:3,jeu:4,ven:5,sam:6,dim:0}[w[1]];let wk=0;
      const n=s.match(/dans\s+(\d)\s*sem/);if(n)wk=Number(n[1]);else if(/\bpro(chain|chaine)?\b|\bsuivant/.test(s))wk=1;
      let t=addDays(weekStart(today),7*wk+(wd+6)%7);if(!wk&&t<today)t=addDays(t,7);day=t}
    else{const n=s.match(/dans\s+(\d+)\s*j/);if(n)day=addDays(today,Number(n[1]))}}
  return {day,mins};
}
document.addEventListener("input",e=>{if(e.target.id!=="pk-txt"||!pk)return;
  const v=e.target.value;pk.txt=v;pk.refocus=true;const r=parseQuand(v);
  if(r.day==null&&r.mins==null){pk.txtErr=v.trim().length>3;pkRender();return}
  pk.txtErr=false;const w=pk.d[pk.field];
  pkSet(atMins(r.day!=null?r.day:pk.day,r.mins!=null?r.mins:(w?minsOf(w):9*60)));
});

// Ce qui est déjà prévu le jour choisi (appli + agenda du téléphone)
async function dayItems(when,selfKind,selfId){
  const d0=new Date(when);d0.setHours(0,0,0,0);const a=d0.getTime(),b=a+864e5;
  const items=[],mine=new Set();
  leads.forEach(l=>{const self=selfKind==="leads"&&l.id===selfId;if(l.calId&&(self||l.when))mine.add(String(l.calId));
    if(!self&&(l.status==="open"||!l.status)&&l.when&&l.when>=a&&l.when<b)items.push({t:l.when,end:l.when+durOf("leads",l)*6e4,title:(l.type==="rdv"?"RDV – ":"Rappeler – ")+fullName(l)})});
  projects.forEach(p=>{const self=selfKind==="projects"&&p.id===selfId;if(p.calId)mine.add(String(p.calId));
    if(!self&&p.rdv&&p.rdv>=a&&p.rdv<b)items.push({t:p.rdv,end:p.rdv+durOf("projects",p)*6e4,title:"RDV – "+fullName(p)})});
  appts.forEach(x=>{const self=selfKind==="appts"&&x.id===selfId;if(x.calId)mine.add(String(x.calId));
    if(!self&&!x.done&&x.when&&x.when>=a&&x.when<b)items.push({t:x.when,end:x.when+durOf("appts",x)*6e4,title:"RDV – "+apptName(x)})});
  if(NATIVE&&agendaState==="granted"){try{(await NATIVE.listEvents(a,b)).forEach(e=>{if(!mine.has(String(e.id)))items.push({t:e.startDate,end:e.endDate||e.startDate+3600e3,title:e.title||"(sans titre)",allDay:e.isAllDay,phone:true})})}catch(e){}}
  return items.sort((x,y)=>x.t-y.t);
}
// Affiche la journée sous le champ date et renvoie les créneaux qui se chevauchent
async function showDay(boxId,when,dur,kind,id){
  const box=document.getElementById(boxId);if(!box)return [];
  if(!when){box.innerHTML="";return []}
  const items=await dayItems(when,kind,id);
  const end=when+dur, clash=items.filter(it=>!it.allDay&&it.t<end&&it.end>when);
  const hm=t=>{const d=new Date(t);return d.getHours()+"h"+pad(d.getMinutes())};
  const d=new Date(when);
  let html=`<div class="day-h">${ymd(d)===ymd(new Date())?"Aujourd'hui":esc(JOURS[d.getDay()]+" "+d.getDate()+" "+MOIS[d.getMonth()])} : ${items.length?items.length+" déjà prévu"+(items.length>1?"s":""):"rien de prévu"}</div>`;
  html+=items.map(it=>`<div class="day-row${clash.includes(it)?" clash":""}"><span>${it.allDay?"Journée":hm(it.t)+"–"+hm(it.end)}</span><b>${esc(it.title)}</b>${it.phone?`<small>agenda</small>`:""}</div>`).join("");
  if(clash.length)html+=`<div class="day-warn">⚠️ Ce créneau (${hm(when)}–${hm(end)}) chevauche ${clash.length>1?clash.length+" rendez-vous":"« "+esc(clash[0].title)+" »"}. Choisis une autre heure ou enregistre quand même.</div>`;
  if(NATIVE&&agendaState!=="granted")html+=`<button class="iconbtn" data-agenda-allow="1" type="button">Vérifier aussi dans mon agenda Google</button>`;
  box.innerHTML=html;return clash;
}

async function importContacts(o){
  if(!o||o.app!=="pense-bete-contacts"||!Array.isArray(o.contacts))throw new Error("format");
  const actId=async name=>{const a=activities.find(x=>fold(x.name)===fold(name));if(a)return a.id;
    const id="a"+uid(),order=Date.now()+activities.length;await db.doc("activities/"+id).set({name,order});if(!actById(id))activities.push({id,name,order});return id};
  let added=0,updated=0;const merged=[];
  for(const x of o.contacts){
    const svc=[];for(const s of x.services||[])svc.push({act:await actId(s.act),who:s.who||"",hours:""});
    const ex=customers.find(c=>c.extKey===x.key)||customers.find(c=>!c.extKey&&fold(fullName(c))===fold(fullName(x)));
    const seen=x.seen?new Date(x.seen+"T12:00").getTime():(x.last?new Date(x.last+"T12:00").getTime():null);
    const info={extKey:x.key,firstName:x.firstName||"",lastName:x.lastName||"",phone:x.phone||"",phone2:x.phone2||"",address:x.address||"",email:x.email||"",students:x.students||[],entity:x.entity||"",lastBilled:seen};
    let id;
    if(ex){ // on garde ce qui a été réglé dans l'appli (statut, heures, planning, note)
      const cur=svcOf(ex);for(const s of svc){const y=cur.find(z=>z.act===s.act);if(!y)cur.push(s);else if(!y.who&&s.who)y.who=s.who}
      const c={...ex,...info,phone:info.phone||ex.phone,address:info.address||ex.address,email:info.email||ex.email,services:cur,lastBilled:Math.max(ex.lastBilled||0,seen||0)||null};
      if(c.status==="termine"&&seen&&(ex.lastBilled||0)<seen&&Date.now()-seen<ARCHIVE_AFTER){c.status="actif";c.touchedAt=Date.now()} // nouvelle facture : de retour
      await db.doc("customers/"+ex.id).set(custBody(c));Object.assign(ex,c);updated++;id=ex.id;
    }else{
      const c={id:"c"+uid(),...info,status:x.active?"actif":"termine",schedule:"",start:x.last?new Date(x.last+"T12:00").getTime():null,note:x.notes||"",services:svc,createdAt:Date.now()};
      await db.doc("customers/"+c.id).set(custBody(c));if(!customers.some(y=>y.id===c.id))customers.push(c);added++;id=c.id;
    }
    // fiche créée à la main au nom de l'élève (ex. « Simon » pour l'élève « simon p ») : fusionnée avec le parent
    for(const m of customers.filter(c=>!c.extKey&&c.id!==id&&studentMatch(c,x,o.contacts))){await mergeCustomers(m.id,id);merged.push(fullName(m)+" → "+fullName(x))}
  }
  await autoArchive();render();return {added,updated,merged};
}
// La fiche manuelle c correspond-elle à un élève de x, et à aucun autre parent ?
function studentMatch(c,x,all){
  const fn=fold(c.firstName).trim(),ln=fold(c.lastName).trim();if(!fn)return false;
  // élève « simon p » : prénom identique, et nom de la fiche vide ou commençant par « p »
  const fits=p=>(p.students||[]).some(s=>{const [a,...r]=fold(s).trim().split(/\s+/);const b=r.join(" ");
    return a===fn&&(!ln||(b?ln.startsWith(b):ln===fold(p.lastName)))});
  if(!fits(x))return false;
  const cand=all.filter(fits);if(cand.length===1)return true;
  const act=cand.filter(p=>p.active);return act.length===1&&act[0]===x; // homonymes : le seul client actif
}

async function mergeCustomers(fromId,toId){
  const a=customers.find(c=>c.id===fromId),b=customers.find(c=>c.id===toId);if(!a||!b||a===b)return;
  const sv=svcOf(b);for(const s of svcOf(a)){const y=sv.find(z=>z.act===s.act);if(!y)sv.push(s);else{if(!y.who&&s.who)y.who=s.who;if((y.hours===""||y.hours==null)&&s.hours!=="")y.hours=s.hours}}
  const c={...b,services:sv,phone:b.phone||a.phone,phone2:[b.phone2,a.phone&&a.phone!==b.phone?a.phone:""].filter(Boolean).join(" / "),address:b.address||a.address,email:b.email||a.email,
    schedule:b.schedule||a.schedule,slots:slotsOf(b).length?slotsOf(b):slotsOf(a),skipHol:slotsOf(b).length?b.skipHol:a.skipHol,absences:[...(b.absences||[]),...(a.absences||[])],note:[b.note,a.note].filter(Boolean).join("\n"),status:a.status==="actif"||b.status==="actif"?"actif":b.status,touchedAt:Math.max(a.touchedAt||0,b.touchedAt||0,a.createdAt||0)||null};
  await db.doc("customers/"+b.id).set(custBody(c));Object.assign(b,c);
  for(const x of appts.filter(x=>x.customerId===a.id))await db.doc("appts/"+x.id).set(apptBody({...x,customerId:b.id}));
  for(const p of projects.filter(p=>p.customerId===a.id))await db.doc("projects/"+p.id).set(projBody({...p,customerId:b.id}));
  await db.doc("customers/"+a.id).delete();
}

const MOISC=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const sundayKey=()=>{const d=new Date();d.setDate(d.getDate()+((7-d.getDay())%7));return ymd(d)};
const plusKey=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
function whenOfDay(day){if(!day)return "none";if(day===todayKey())return "today";if(day===plusKey(1))return "tomorrow";if(day===sundayKey())return "week";return "pick"}

  const st=pState(p); p.doneAt=st.finished?(p.doneAt||Date.now()):null;
  if(st.finished)$("#status").textContent="🎉 Parcours de « "+fullName(p)+" » validé.";
  writeDoc("projects/"+p.id,projBody(p)); render();
}
function setLead(l,patch){Object.assign(l,patch);writeDoc("leads/"+l.id,leadBody(l));render()}

document.addEventListener("change",e=>{
  const c=e.target.closest(".chk"); if(!c||!db)return;
  if(c.dataset.p){
    const p=projects.find(x=>x.id===c.dataset.p); if(!p)return;
    const done={...(p.done||{})}; if(c.checked)done[c.dataset.s]=Date.now(); else delete done[c.dataset.s];
    p.done=done; saveProjectState(p); return;
  }
  const r=routines.find(x=>x.id===c.dataset.r); if(!r)return;
  const p=periodOf(r); const id=runId(r,p);
  const cur=runs[id]||{routineId:r.id,period:p.key,done:{}};
  const done={...cur.done}; if(c.checked)done[c.dataset.t]=Date.now(); else delete done[c.dataset.t];
  runs[id]={routineId:r.id,period:p.key,done};
  writeRun(id,runs[id]); render();
});

  if(g("[data-pkgo]")){if(pk){pk.day=dayStart(pk.d[pk.field]);pkRender()}return}
  if(agTap(e))return;

  if(t=g("[data-agview]")){agView=t.dataset.agview;try{localStorage.setItem("pb-agview",agView)}catch(_){}agScrolled=false;render();return}
  if(t=g("[data-wkday]")){agDay=Number(t.dataset.wkday);agView="day";try{localStorage.setItem("pb-agview",agView)}catch(_){}agScrolled=false;render();return}
  if(t=g("[data-agnav]")){agDay=addDays(agDay,Number(t.dataset.agnav));agScrolled=false;render();return}
  if(t=g("[data-agday]")){agDay=Number(t.dataset.agday);agScrolled=false;render();return}
  if(g("[data-agtoday]")){agDay=dayStart(Date.now());agScrolled=false;render();return}
  if(t=g("[data-agref]")){const [k,id]=t.dataset.agref.split(":");
    if(k==="lead"){const l=leads.find(x=>x.id===id);if(l)openLeadSheet(l)}
    else if(k==="appt"){const a=appts.find(x=>x.id===id);if(a)openApptSheet(a)}
    else if(k==="proj"){const p=projects.find(x=>x.id===id);if(p)openListSheet("project",p)}
    else if(k==="occ")openOccSheet(id);
    else if(k==="routine"){tab="now";render()}
    else{const ev=(agEvents||[]).find(x=>String(x.id)===id);if(ev){const d=new Date(ev.startDate);$("#status").textContent=(ev.title||"Événement")+" · "+(ev.isAllDay?"toute la journée":d.getHours()+"h"+pad(d.getMinutes()))+(ev.location?" · "+ev.location:"")+" (agenda Google)"}}
    return}

  if(t=g("[data-cstat]")){custStatus=t.dataset.cstat;render();return}
  if(g("[data-newcust]")){openCustSheet(null);return}

  if(t=g("[data-l2c]")){const l=leads.find(x=>x.id===t.dataset.l2c);if(l)openCustSheet(null,{firstName:l.firstName||"",lastName:l.lastName||"",phone:l.phone||"",address:l.address||"",note:[l.reason,l.note].filter(Boolean).join("\n"),leadId:l.id});return}
  if(t=g("[data-tkdone]")){const k=tasks.find(x=>x.id===t.dataset.tkdone);if(k){k.done=true;k.doneAt=Date.now();writeDoc("tasks/"+k.id,taskBody(k))}return}
  if(t=g("[data-crdv]")){const c=customers.find(x=>x.id===t.dataset.crdv);if(c)openApptSheet(null,{customerId:c.id});return}
  if(t=g("[data-adone]")){const a=appts.find(x=>x.id===t.dataset.adone);if(a){a.done=true;a.doneAt=Date.now();writeDoc("appts/"+a.id,apptBody(a));render()}return}
  if(t=g("[data-cstatus]")){const [id,st]=t.dataset.cstatus.split(":");const c=customers.find(x=>x.id===id);if(c){c.status=st;if(st!=="pause")c.pauseUntil=null;if(st==="actif")c.touchedAt=Date.now();writeDoc("customers/"+c.id,custBody(c));if(document.getElementById("cd-h"))$("#sheet-root").innerHTML="";$("#status").textContent=st==="actif"?"✓ Client réactivé.":st==="pause"?"⏸ Client mis en pause.":"🗄 Client archivé."}return}
  if(t=g("[data-tk]")){const k=tasks.find(x=>x.id===t.dataset.tk);if(k){k.done=t.checked;k.doneAt=t.checked?Date.now():null;writeDoc("tasks/"+k.id,taskBody(k))}return}
  if(t=g("[data-tkopen]")){openTaskSheet(t.dataset.tkopen);return}
  if(g("[data-tkhr]")){const ti=$("#tk-time");if(ti){ti.hidden=!ti.hidden;if(!ti.hidden)ti.focus()}return}
  if(t=g("[data-tkc]")){const id=t.dataset.tkc;if(openTk.has(id))openTk.delete(id);else openTk.add(id);render();const ta=document.getElementById("tkc-"+id);if(ta)ta.focus();return}
  if(t=g("[data-tkdel]")){const id=t.dataset.tkdel;if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent="Supprimer ?";return}db.doc("tasks/"+id).delete();return}
  if(g("[data-tkadd]")){addTask();return}
  if(g("[data-tkarch]")){openTaskArchive();return}
  if(t=g("[data-p2c]")){const p=projects.find(x=>x.id===t.dataset.p2c);if(p)openCustSheet(null,{firstName:p.firstName||"",lastName:p.lastName||(p.firstName?"":p.title||""),phone:p.phone||"",address:p.address||"",email:p.email||"",note:p.note||"",projectId:p.id});return}
  if(g("[data-actedit]")){openActSheet();return}
  if(t=g("[data-tab]")){tab=t.dataset.tab;try{localStorage.setItem("pb-tab",tab)}catch(_){}render();return}
  if(t=g("[data-edit]")){openSheet(routines.find(r=>r.id===t.dataset.edit));return}
  if(t=g("[data-pf]")){projFilter=t.dataset.pf;try{localStorage.setItem("pb-pf",projFilter)}catch(_){}render();return}
  if(t=g("[data-editp]")){openListSheet("project",projects.find(p=>p.id===t.dataset.editp));return}
  if(t=g("[data-editm]")){openListSheet("model",models.find(m=>m.id===t.dataset.editm));return}
  if(g("[data-newm]")){openListSheet("model",null);return}
  if(g("[data-newp]")){openListSheet("project",null);return}
  if(g("[data-newlead]")){openLeadSheet(null);return}
  if(t=g("[data-ledit]")){openLeadSheet(leads.find(l=>l.id===t.dataset.ledit));return}
  if(t=g("[data-ldone]")){const l=leads.find(x=>x.id===t.dataset.ldone);if(l)setLead(l,{status:"done",doneAt:Date.now()});return}
  if(t=g("[data-lreopen]")){const l=leads.find(x=>x.id===t.dataset.lreopen);if(l)setLead(l,{status:"open",doneAt:null});return}
  if(t=g("[data-lconv]")){const l=leads.find(x=>x.id===t.dataset.lconv);if(l)openListSheet("project",null,l);return}

$("#fab").addEventListener("click",()=>tab==="agenda"?openApptSheet(null,{when:agDay+9*36e5}):tab==="cust"?openCustSheet(null):openSheet(null));

// Feuille demande (rappel / RDV)
let lead=null, leadConfirm=false;
function openLeadSheet(l,preset){
  if(!db){$("#status").textContent="Connecte-toi pour ajouter des demandes.";return}
  lead=l?{...l,isNew:false}:{id:"l"+uid(),isNew:true,type:"rappel",firstName:"",lastName:"",phone:"",address:"",when:null,reason:"",note:"",status:"open",...(preset||{})};
  leadConfirm=false; drawLeadSheet();
}
function drawLeadSheet(){
  const d=lead, root=$("#sheet-root"); if(!d){root.innerHTML="";return}
  root.innerHTML=`<div class="sheet-bg" id="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ld-h">
   <h3 id="ld-h">${d.isNew?"Nouvelle demande":"Modifier la demande"}</h3>
   <div class="field"><label for="ld-type">Type</label><select id="ld-type">${Object.entries(LTYPE).map(([k,v])=>`<option value="${k}" ${d.type===k?"selected":""}>${v}</option>`).join("")}</select></div>
   <div class="row"><div class="field"><label for="ld-fn">Prénom</label><input type="text" id="ld-fn" autocomplete="off" value="${esc(d.firstName)}"></div>
   <div class="field"><label for="ld-ln">Nom</label><input type="text" id="ld-ln" autocomplete="off" value="${esc(d.lastName)}"></div></div>
   <div class="field"><label for="ld-ph">Téléphone</label><input type="tel" id="ld-ph" autocomplete="off" placeholder="06 12 34 56 78" value="${esc(d.phone)}"></div>
   <div class="field"><label for="ld-ad">Adresse</label><input type="text" id="ld-ad" autocomplete="off" placeholder="N°, rue, code postal, ville" value="${esc(d.address)}"></div>
   <div class="field"><label for="ld-dur">Durée</label>${durSelect("ld-dur",durOf("leads",d))}</div>
   <div class="field"><label>${d.type==="rdv"?"Choisis le créneau du RDV":"Quand rappeler (facultatif)"}</label><div class="pk" id="ld-pk"></div>
   <label for="ld-wh" class="pk-fine-l">ou heure précise</label><input type="datetime-local" id="ld-wh" value="${esc(toLocalInput(d.when))}"></div>
   <div class="field"><label for="ld-re">Motif</label><input type="text" id="ld-re" placeholder="Ex. aide au ménage 2 h/semaine" value="${esc(d.reason)}"></div>
   <div class="field"><label for="ld-no">Note</label><textarea id="ld-no">${esc(d.note)}</textarea></div>
   ${agendaToggle("ld-cal",d.toCal!==false)}
   <div class="btns"><button class="btn primary" id="ld-save">Enregistrer</button><button class="btn" id="ld-cancel">Annuler</button>
   ${d.isNew?"":`<button class="btn danger" id="ld-del">${leadConfirm?"Confirmer la suppression":"Supprimer"}</button>`}</div>
   ${d.isNew?"":`<div class="btns"><button class="iconbtn" id="ld-proj">→ Démarrer un parcours</button><button class="iconbtn" id="ld-done">Classer sans suite</button></div>`}
   <div class="status" id="ld-msg"></div></div></div>`;
  const s=$("#sheet-bg");
  s.addEventListener("click",ev=>{if(ev.target===s)closeLead()});
  const bind=(id,k,f)=>$(id).addEventListener("input",ev=>d[k]=f?f(ev.target.value):ev.target.value);
  bind("#ld-fn","firstName");bind("#ld-ln","lastName");bind("#ld-ph","phone");bind("#ld-ad","address");bind("#ld-re","reason");bind("#ld-no","note");
  bind("#ld-wh","when",v=>v?new Date(v).getTime():null);
  pkStart({d,field:"when",dur:()=>durOf("leads",d)*6e4,kind:"leads",id:d.id,inputId:"ld-wh",boxId:"ld-pk",saveId:"ld-save"});
  $("#ld-dur").addEventListener("change",ev=>{d.dur=Number(ev.target.value);d._forced=false;pkRender()});
  $("#ld-wh").addEventListener("change",()=>{d._forced=false;if(d.when&&pk)pk.day=dayStart(d.when);pkRender()});
  $("#ld-type").addEventListener("change",ev=>{const wasDefault=!d.dur;d.type=ev.target.value;if(wasDefault)d.dur=d.type==="rdv"?60:15;drawLeadSheet()});
  $("#ld-cancel").addEventListener("click",closeLead);
  $("#ld-save").addEventListener("click",async()=>{
    if(!d.firstName.trim()&&!d.lastName.trim()){$("#ld-msg").textContent="Indique au moins un prénom ou un nom.";$("#ld-fn").focus();return}
    if(d._clash&&d._clash.length&&!d._forced){d._forced=true;$("#ld-msg").textContent="⚠️ Créneau déjà occupé. Touche encore « Enregistrer » pour confirmer quand même.";$("#ld-save").textContent="Enregistrer quand même";return}
    $("#ld-save").disabled=true;
    const cb=$("#ld-cal");const wantCal=!!(cb&&cb.checked);
    try{const saved={...d,firstName:d.firstName.trim(),lastName:d.lastName.trim(),phone:d.phone.trim(),address:d.address.trim()};
      await db.doc("leads/"+d.id).set(leadBody(saved));
      if(wantCal&&saved.when&&saved.when>Date.now()&&!inAgenda("leads",saved))setTimeout(()=>{const x=leads.find(o=>o.id===d.id);if(x)pushToAgenda("leads",x)},300);
      projFilter="leads";closeLead();render()}
    catch(e){$("#ld-save").disabled=false;$("#ld-msg").textContent="Enregistrement impossible ("+(e&&e.code||"erreur")+").";}
  });
  const lp=$("#ld-proj");if(lp)lp.addEventListener("click",()=>{const l=leads.find(x=>x.id===d.id);closeLead();if(l)openListSheet("project",null,l)});
  const lf=$("#ld-done");if(lf)lf.addEventListener("click",()=>{const l=leads.find(x=>x.id===d.id);closeLead();if(l)setLead(l,{status:"done",doneAt:Date.now()})});
  const del=$("#ld-del");if(del)del.addEventListener("click",async()=>{
    if(!leadConfirm){leadConfirm=true;drawLeadSheet();return}
    try{await db.doc("leads/"+d.id).delete();closeLead()}catch(e){$("#ld-msg").textContent="Suppression impossible. Réessaie."}});
}
function closeLead(){lead=null;pk=null;drawLeadSheet()}

// Feuille client sur parcours / parcours type
let ld=null, ldConfirm=false;
function openListSheet(kind,item,fromLead){
  if(!db){$("#status").textContent="Connecte-toi pour créer des clients.";return}
  if(item) ld={kind,isNew:false,...JSON.parse(JSON.stringify(item))};
  else if(kind==="model") ld={kind,isNew:true,id:"m"+uid(),title:"",steps:[blankStep()]};
  else{const m=models[0];const L=fromLead||{};
    ld={kind,isNew:true,id:"p"+uid(),firstName:L.firstName||"",lastName:L.lastName||"",phone:L.phone||"",address:L.address||"",email:"",
      note:[L.reason,L.note].filter(Boolean).join("\n"),leadId:L.id||"",model:m?m.title:"",modelId:m?m.id:"",done:{},steps:m?JSON.parse(JSON.stringify(m.steps||[])):[blankStep()]}}
  if(ld.kind==="project"&&!ld.isNew&&!ld.firstName&&!ld.lastName)ld.lastName=ld.title||"";
  ldConfirm=false; drawListSheet();
}
function stepsEditor(d){
  return `<div style="display:flex;flex-direction:column;gap:8px">${d.steps.map((t,i)=>`<div class="task-edit">
     <div class="row"><input type="text" id="sl-${t.id}" data-i="${i}" data-k="label" placeholder="Étape ${i+1}" value="${esc(t.label)}"><button class="iconbtn" data-sup="${i}" aria-label="Monter">↑</button><button class="iconbtn" data-srm="${i}" aria-label="Supprimer l'étape">✕</button></div>
     <input type="url" id="sk-${t.id}" data-i="${i}" data-k="link" placeholder="Lien vers un site (facultatif), ex. https://www.urssaf.fr" value="${esc(t.link)}"></div>`).join("")}
     <button class="btn" id="l-add">+ Ajouter une étape</button></div>`;
}
function drawListSheet(){
  const d=ld, root=$("#sheet-root"); if(!d){root.innerHTML="";return}
  const isP=d.kind==="project";
  const modelSel=isP&&d.isNew?`<div class="field"><label for="l-model">Parcours type</label><select id="l-model">${models.map(m=>`<option value="${esc(m.id)}" ${d.modelId===m.id?"selected":""}>${esc(m.title)}</option>`).join("")}<option value="" ${!d.modelId?"selected":""}>Liste vide</option></select></div>`:"";
  const body=isP?`
   ${modelSel}
   <div class="row"><div class="field"><label for="l-fn">Prénom</label><input type="text" id="l-fn" autocomplete="off" value="${esc(d.firstName)}"></div>
   <div class="field"><label for="l-ln">Nom</label><input type="text" id="l-ln" autocomplete="off" value="${esc(d.lastName)}"></div></div>
   <div class="field"><label for="l-ph">Téléphone</label><input type="tel" id="l-ph" autocomplete="off" placeholder="06 12 34 56 78" value="${esc(d.phone)}"></div>
   <div class="field"><label for="l-ad">Adresse</label><input type="text" id="l-ad" autocomplete="off" placeholder="N°, rue, code postal, ville" value="${esc(d.address)}"></div>
   <div class="field"><label for="l-dur">Durée du prochain RDV</label>${durSelect("l-dur",durOf("projects",d))}</div>
   <div class="field"><label for="l-rdv">Prochain RDV (facultatif)</label><div class="pk" id="l-pk"></div><label for="l-rdv" class="pk-fine-l">ou heure précise</label><input type="datetime-local" id="l-rdv" value="${esc(toLocalInput(d.rdv))}"></div>
   ${agendaToggle("l-cal",d.toCal!==false)}
   <div class="field"><label for="l-em">Email (facultatif)</label><input type="email" id="l-em" autocomplete="off" value="${esc(d.email)}"></div>
   <div class="field"><label for="l-note">Note</label><textarea id="l-note" placeholder="Besoins, disponibilités, infos utiles…">${esc(d.note)}</textarea></div>
   <details class="cfg" ${d.isNew?"":""}><summary>Personnaliser les étapes pour ce client</summary>${stepsEditor(d)}</details>`
  :`<div class="field"><label for="l-title">Nom du parcours type</label><input type="text" id="l-title" placeholder="Ex. Parcours client avance immédiate" value="${esc(d.title)}"></div>
   <div class="field"><label>Étapes, dans l'ordre</label>${stepsEditor(d)}</div>
   <div class="status">Modifier un parcours type ne change pas les clients déjà lancés dessus.</div>`;
  root.innerHTML=`<div class="sheet-bg" id="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="l-h">
   <h3 id="l-h">${isP?(d.isNew?"Nouveau client sur un parcours":"Modifier la fiche client"):(d.isNew?"Nouveau parcours type":"Modifier le parcours type")}</h3>
   ${body}
   <div class="btns"><button class="btn primary" id="l-save">Enregistrer</button><button class="btn" id="l-cancel">Annuler</button>
   ${d.isNew?"":`<button class="btn danger" id="l-del">${ldConfirm?"Confirmer la suppression":"Supprimer"}</button>`}</div>
   <div class="status" id="l-msg"></div></div></div>`;
  const s=$("#sheet-bg");
  if(d.cfgOpen){const c=s.querySelector("details.cfg");if(c)c.open=true}
  const cfg=s.querySelector("details.cfg");if(cfg)cfg.addEventListener("toggle",()=>d.cfgOpen=cfg.open);
  s.addEventListener("click",ev=>{if(ev.target===s)closeList()});
  s.querySelectorAll("[data-k]").forEach(inp=>inp.addEventListener("input",()=>{d.steps[inp.dataset.i][inp.dataset.k]=inp.value}));
  const bind=(id,k)=>{const el=$(id);if(el)el.addEventListener("input",ev=>d[k]=ev.target.value)};
  bind("#l-title","title");bind("#l-fn","firstName");bind("#l-ln","lastName");bind("#l-ph","phone");bind("#l-ad","address");bind("#l-em","email");bind("#l-note","note");
  const ldur=$("#l-dur");if(ldur)ldur.addEventListener("change",ev=>{d.rdvDur=Number(ev.target.value);d._forced=false;pkRender()});
  const rv=$("#l-rdv");if(rv){pkStart({d,field:"rdv",dur:()=>durOf("projects",d)*6e4,kind:"projects",id:d.id,inputId:"l-rdv",boxId:"l-pk",saveId:"l-save"});
    const upd=ev=>{d.rdv=ev.target.value?new Date(ev.target.value).getTime():null;d._forced=false;if(d.rdv&&pk)pk.day=dayStart(d.rdv);pkRender()};
    rv.addEventListener("change",upd)}
  const ms=$("#l-model");if(ms)ms.addEventListener("change",ev=>{const m=models.find(x=>x.id===ev.target.value);d.modelId=m?m.id:"";d.model=m?m.title:"";d.steps=m?JSON.parse(JSON.stringify(m.steps||[])):[blankStep()];drawListSheet()});
  s.querySelectorAll("[data-srm]").forEach(b=>b.addEventListener("click",()=>{d.steps.splice(Number(b.dataset.srm),1);drawListSheet()}));
  s.querySelectorAll("[data-sup]").forEach(b=>b.addEventListener("click",()=>{const i=Number(b.dataset.sup);if(i>0){[d.steps[i-1],d.steps[i]]=[d.steps[i],d.steps[i-1]];drawListSheet()}}));
  $("#l-add").addEventListener("click",()=>{d.steps.push(blankStep());d.cfgOpen=true;drawListSheet();const el=document.getElementById("sl-"+d.steps[d.steps.length-1].id);if(el)el.focus()});
  $("#l-cancel").addEventListener("click",closeList);
  $("#l-save").addEventListener("click",saveList);
  const del=$("#l-del");if(del)del.addEventListener("click",async()=>{
    if(!ldConfirm){ldConfirm=true;drawListSheet();return}
    try{await db.doc((isP?"projects/":"models/")+d.id).delete();closeList()}catch(e){$("#l-msg").textContent="Suppression impossible. Réessaie."}});
}
function closeList(){ld=null;pk=null;drawListSheet()}
async function saveList(){
  const d=ld;
  const steps=d.steps.filter(t=>t.label.trim()).map(t=>({id:t.id,label:t.label.trim(),link:(t.link||"").trim(),note:(t.note||"").trim()}));
  steps.forEach(t=>{if(t.link&&!/^https?:\/\//i.test(t.link))t.link="https://"+t.link});
  if(d.kind==="model"){if(!(d.title||"").trim()){$("#l-msg").textContent="Donne un nom au parcours type.";$("#l-title").focus();return}}
  else if(!d.firstName.trim()&&!d.lastName.trim()){$("#l-msg").textContent="Indique au moins un prénom ou un nom.";$("#l-fn").focus();return}
  if(!steps.length){$("#l-msg").textContent="Ajoute au moins une étape.";return}
  if(d.kind==="project"&&d._clash&&d._clash.length&&!d._forced){d._forced=true;$("#l-msg").textContent="⚠️ Le prochain RDV tombe sur un créneau déjà occupé. Touche encore « Enregistrer » pour confirmer quand même.";$("#l-save").textContent="Enregistrer quand même";return}
  $("#l-save").disabled=true;
  try{
    if(d.kind==="model") await db.doc("models/"+d.id).set({title:d.title.trim(),steps,order:d.order||Date.now()});
    else{
      const p={...d,firstName:d.firstName.trim(),lastName:d.lastName.trim(),phone:(d.phone||"").trim(),address:(d.address||"").trim(),email:(d.email||"").trim(),steps,createdAt:d.createdAt||Date.now()};
      const keep={};steps.forEach(s=>{if((d.done||{})[s.id])keep[s.id]=d.done[s.id]});p.done=keep;
      const st=pState(p);p.doneAt=st.finished?(d.doneAt||Date.now()):null;
      await db.doc("projects/"+d.id).set(projBody(p));
      const cb=$("#l-cal");if(cb&&cb.checked&&p.rdv&&p.rdv>Date.now()&&!inAgenda("projects",p))setTimeout(()=>{const x=projects.find(o=>o.id===d.id);if(x)pushToAgenda("projects",x)},300);
      if(d.isNew&&d.leadId){const l=leads.find(x=>x.id===d.leadId);if(l)setLead(l,{status:"converted",doneAt:Date.now(),projectId:d.id})}
      if(d.isNew)projFilter="open";
    }
    closeList(); render();
  }catch(e){$("#l-save").disabled=false;$("#l-msg").textContent="Enregistrement impossible ("+(e&&e.code||"erreur")+").";}
}

// Feuille d'édition
let draft=null, confirmDel=false;
const uid=()=>Math.random().toString(36).slice(2,9);
function openSheet(r){
  if(!db){$("#status").textContent="Connecte-toi pour créer des routines.";return}
  draft=r?JSON.parse(JSON.stringify(r)):{id:"r"+uid(),title:"",freq:"monthly",day:1,weekday:1,monthOffset:0,time:"09:00",tasks:[{id:uid(),label:"",link:"",note:""}],order:Date.now()};
  draft.isNew=!r; confirmDel=false; drawSheet();
}
function drawSheet(){
  const d=draft; const root=$("#sheet-root");
  if(!d){root.innerHTML="";return}
  const whenFields = d.freq==="weekly" ? `<div class="field"><label for="f-wd">Jour</label><select id="f-wd">${[1,2,3,4,5,6,7].map(i=>`<option value="${i}" ${Number(d.weekday)===i?"selected":""}>${JOURS[i%7]}</option>`).join("")}</select></div>`
    : d.freq==="daily" ? "" :
    `<div class="field"><label for="f-day">Jour du mois</label><input type="number" id="f-day" min="1" max="31" value="${esc(d.day)}"></div>`+
    (d.freq==="yearly"?`<div class="field"><label for="f-mon">Mois</label><select id="f-mon">${MOIS.map((l,i)=>`<option value="${i}" ${Number(d.month||0)===i?"selected":""}>${l}</option>`).join("")}</select></div>`:"")+
    (d.freq==="quarterly"?`<div class="field"><label for="f-mo">Mois du trimestre</label><select id="f-mo">${["1er","2e","3e"].map((l,i)=>`<option value="${i}" ${Number(d.monthOffset)===i?"selected":""}>${l} mois</option>`).join("")}</select></div>`:"");
  root.innerHTML=`<div class="sheet-bg" id="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
   <h3 id="sheet-title">${d.isNew?"Nouvelle routine":"Modifier la routine"}</h3>
   <div class="field"><label for="f-title">Nom</label><input type="text" id="f-title" placeholder="Ex. Début de mois" value="${esc(d.title)}"></div>
   <div class="row"><div class="field"><label for="f-freq">Fréquence</label><select id="f-freq">${Object.entries(FREQ).map(([k,l])=>`<option value="${k}" ${d.freq===k?"selected":""}>${l}</option>`).join("")}</select></div>${whenFields}
   <div class="field"><label for="f-time">Heure du rappel</label><input type="time" id="f-time" value="${esc(d.time||"09:00")}"></div></div>
   <div class="field"><label>Tâches</label><div style="display:flex;flex-direction:column;gap:8px">${d.tasks.map((t,i)=>`<div class="task-edit">
     <div class="row"><input type="text" id="tl-${t.id}" data-i="${i}" data-k="label" placeholder="Tâche, ex. Déclaration URSSAF" value="${esc(t.label)}"><button class="iconbtn" data-up="${i}" aria-label="Monter">↑</button><button class="iconbtn" data-rm="${i}" aria-label="Supprimer la tâche">✕</button></div>
     <input type="url" id="tk-${t.id}" data-i="${i}" data-k="link" placeholder="Lien (facultatif), ex. https://www.autoentrepreneur.urssaf.fr" value="${esc(t.link)}">
     <input type="text" id="tn-${t.id}" data-i="${i}" data-k="note" placeholder="Note (facultatif)" value="${esc(t.note)}"></div>`).join("")}
     <button class="btn" id="add-task">+ Ajouter une tâche</button></div></div>
   <div class="btns"><button class="btn primary" id="save">Enregistrer</button><button class="btn" id="cancel">Annuler</button>
   ${d.isNew?"":`<button class="btn danger" id="del">${confirmDel?"Confirmer la suppression":"Supprimer"}</button>`}</div>
   <div class="status" id="sheet-msg"></div></div></div>`;
  const s=$("#sheet-bg");
  s.addEventListener("click",ev=>{if(ev.target===s)closeSheet()});
  s.querySelectorAll("[data-k]").forEach(inp=>inp.addEventListener("input",()=>{d.tasks[inp.dataset.i][inp.dataset.k]=inp.value}));
  $("#f-title").addEventListener("input",ev=>d.title=ev.target.value);
  $("#f-freq").addEventListener("change",ev=>{d.freq=ev.target.value;drawSheet()});
  $("#f-time").addEventListener("input",ev=>d.time=ev.target.value);
  const fd=$("#f-day");if(fd)fd.addEventListener("input",ev=>d.day=Math.max(1,Math.min(31,Number(ev.target.value)||1)));
  const fw=$("#f-wd");if(fw)fw.addEventListener("change",ev=>d.weekday=Number(ev.target.value));
  const fm=$("#f-mo");if(fm)fm.addEventListener("change",ev=>d.monthOffset=Number(ev.target.value));
  const fmon=$("#f-mon");if(fmon)fmon.addEventListener("change",ev=>d.month=Number(ev.target.value));
  s.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{d.tasks.splice(Number(b.dataset.rm),1);drawSheet()}));
  s.querySelectorAll("[data-up]").forEach(b=>b.addEventListener("click",()=>{const i=Number(b.dataset.up);if(i>0){[d.tasks[i-1],d.tasks[i]]=[d.tasks[i],d.tasks[i-1]];drawSheet()}}));
  $("#add-task").addEventListener("click",()=>{d.tasks.push({id:uid(),label:"",link:"",note:""});drawSheet();const last=d.tasks[d.tasks.length-1];const el=document.getElementById("tl-"+last.id);if(el)el.focus()});
  $("#cancel").addEventListener("click",closeSheet);
  $("#save").addEventListener("click",saveSheet);
  const del=$("#del");if(del)del.addEventListener("click",async()=>{
    if(!confirmDel){confirmDel=true;drawSheet();return}
    try{await db.doc("routines/"+d.id).delete();closeSheet()}catch(e){$("#sheet-msg").textContent="Suppression impossible. Réessaie."}});
}
function closeSheet(){draft=null;drawSheet()}
async function saveSheet(){
  const d=draft;
  if(!d.title.trim()){$("#sheet-msg").textContent="Donne un nom à ta routine.";$("#f-title").focus();return}
  const tasks=d.tasks.filter(t=>t.label.trim()).map(t=>({id:t.id,label:t.label.trim(),link:(t.link||"").trim(),note:(t.note||"").trim()}));
  tasks.forEach(t=>{if(t.link&&!/^https?:\/\//i.test(t.link))t.link="https://"+t.link});
  const body={title:d.title.trim(),freq:d.freq,day:Number(d.day)||1,weekday:Number(d.weekday)||1,monthOffset:Number(d.monthOffset)||0,month:Number(d.month)||0,time:d.time||"09:00",tasks,order:d.order||Date.now()};
  $("#save").disabled=true;
  try{await db.doc("routines/"+d.id).set(body);closeSheet()}catch(e){$("#save").disabled=false;$("#sheet-msg").textContent="Enregistrement impossible ("+(e&&e.code||"erreur")+").";}
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(moving&&!$("#sheet-root").innerHTML){moving=null;render()}else if(tkEdit){tkEdit=null;$("#sheet-root").innerHTML=""}else if(draft)closeSheet();else if(ld)closeList();else if(lead)closeLead();else if(cs)closeCust();else if(ap)closeAppt();else $("#sheet-root").innerHTML=""}});

// Date du jour + rafraîchissement à minuit
function stamp(){const d=new Date();$("#today").textContent=JOURS[d.getDay()]+" "+d.getDate()+" "+MOIS[d.getMonth()]+" "+d.getFullYear()}
stamp(); let lastDay=new Date().getDate();
setInterval(()=>{if(new Date().getDate()!==lastDay){lastDay=new Date().getDate();stamp();render()}},60000);
render();

(async()=>{
  try{db=await window.claude?.use?.("db")}catch(e){db=null}
  if(!db){render();return}
  loadAgenda();
  db.collection("routines").orderBy("order").onSnapshot(s=>{routines=s.docs.map(x=>({id:x.id,...x.data()}));render()},e=>{$("#status").textContent="Connexion perdue. Recharge la page."});
  db.collection("projects").onSnapshot(s=>{projects=s.docs.map(x=>{const b=x.data();return {id:x.id,...b,done:{...(b.done||{})},steps:(b.steps||[]).map(t=>({...t}))}});render()},()=>{});
  db.collection("leads").onSnapshot(s=>{leads=s.docs.map(x=>({id:x.id,...x.data()}));render()},()=>{});
  db.collection("appts").onSnapshot(s=>{appts=s.docs.map(x=>({id:x.id,...x.data()}));render()},()=>{});
  db.collection("tasks").onSnapshot(s=>{tasks=s.docs.map(x=>({id:x.id,...x.data()}));render()},()=>{});
  db.collection("customers").onSnapshot(s=>{customers=s.docs.map(x=>({id:x.id,...x.data()}));render();occSyncSoon()},()=>{});
  db.collection("skips").onSnapshot(s=>{const m={};s.docs.forEach(x=>m[x.id]=x.data());skips=m;render();occSyncSoon()},()=>{});
  db.collection("occcal").onSnapshot(s=>{const m={};s.docs.forEach(x=>m[x.id]=x.data());occcal=m},()=>{});
  db.collection("config").onSnapshot(s=>{const m={};s.docs.forEach(x=>m[x.id]=x.data());cfg=m;render();vacAuto()},()=>{});
  setTimeout(()=>window.dispatchEvent(new Event("pb-data-changed")),2500); // rappels des séances régulières
  db.collection("activities").orderBy("order").onSnapshot(s=>{activities=s.docs.map(x=>({id:x.id,...x.data()}));render()},()=>{});
  db.collection("models").orderBy("order").onSnapshot(s=>{models=s.docs.map(x=>({id:x.id,...x.data()}));render()},()=>{});
  db.collection("runs").onSnapshot(s=>{const m={};s.docs.forEach(x=>{const b=x.data();m[x.id]={routineId:b.routineId,period:b.period,done:{...(b.done||{})}}});runs=m;render()},()=>{});
})();
})();
</script>
